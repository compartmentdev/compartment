services:
  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile.self-hosted
      args:
        BUILDKIT_SYNTAX: ${COMPARTMENT_DOCKERFILE_SYNTAX_IMAGE:-docker/dockerfile:1.7}
        COMPARTMENT_NODE_BUILD_IMAGE: ${COMPARTMENT_NODE_BUILD_IMAGE:-node:24.14.0-bookworm}
        COMPARTMENT_NODE_RUNTIME_IMAGE: ${COMPARTMENT_NODE_RUNTIME_IMAGE:-node:24.14.0-bookworm-slim}

  edge:
    build:
      context: .
      dockerfile: packages/edge/Dockerfile.self-hosted
      args:
        BUILDKIT_SYNTAX: ${COMPARTMENT_DOCKERFILE_SYNTAX_IMAGE:-docker/dockerfile:1.7}
        COMPARTMENT_NODE_BUILD_IMAGE: ${COMPARTMENT_NODE_BUILD_IMAGE:-node:24.14.0-bookworm}
        COMPARTMENT_NODE_RUNTIME_IMAGE: ${COMPARTMENT_NODE_RUNTIME_IMAGE:-node:24.14.0-bookworm-slim}

  caddy:
    build:
      context: .
      dockerfile: packages/edge/Dockerfile.caddy.self-hosted
      args:
        BUILDKIT_SYNTAX: ${COMPARTMENT_DOCKERFILE_SYNTAX_IMAGE:-docker/dockerfile:1.7}
        COMPARTMENT_CADDY_BUILDER_IMAGE: ${COMPARTMENT_CADDY_BUILDER_IMAGE:-caddy:2.11.3-builder}
        COMPARTMENT_CADDY_RUNTIME_IMAGE: ${COMPARTMENT_CADDY_RUNTIME_IMAGE:-caddy:2.11.3}

  worker:
    build:
      context: .
      dockerfile: packages/worker/Dockerfile.self-hosted
      args:
        BUILDKIT_SYNTAX: ${COMPARTMENT_DOCKERFILE_SYNTAX_IMAGE:-docker/dockerfile:1.7}
        COMPARTMENT_BUILDKIT_VERSION: ${COMPARTMENT_BUILDKIT_VERSION:-v0.30.0}
        COMPARTMENT_GO_BUILD_IMAGE: ${COMPARTMENT_GO_BUILD_IMAGE:-golang:1.26.3-bookworm}
        COMPARTMENT_NODE_BUILD_IMAGE: ${COMPARTMENT_NODE_BUILD_IMAGE:-node:24.14.0-bookworm}
        COMPARTMENT_NODE_RUNTIME_IMAGE: ${COMPARTMENT_NODE_RUNTIME_IMAGE:-node:24.14.0-bookworm-slim}

  runtime-probe:
    profiles:
      - build
    image: ${COMPARTMENT_RUNTIME_PROBE_IMAGE}
    build:
      context: .
      dockerfile: packages/node/Dockerfile.runtime-probe.self-hosted
      args:
        BUILDKIT_SYNTAX: ${COMPARTMENT_DOCKERFILE_SYNTAX_IMAGE:-docker/dockerfile:1.7}
        COMPARTMENT_NODE_RUNTIME_IMAGE: ${COMPARTMENT_NODE_RUNTIME_IMAGE:-node:24.14.0-bookworm-slim}
