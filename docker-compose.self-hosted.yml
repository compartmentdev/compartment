name: ${COMPARTMENT_DOCKER_NAMESPACE}

services:
  api-migrate:
    image: ${COMPARTMENT_API_IMAGE}
    environment:
      COMPARTMENT_DATABASE_URL: ${COMPARTMENT_DATABASE_URL}
    command: ['node', 'dist/db/migrate.js']
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - system_internal
      - db_internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m

  api:
    image: ${COMPARTMENT_API_IMAGE}
    user: '${COMPARTMENT_RUNTIME_UID}:${COMPARTMENT_RUNTIME_GID}'
    restart: unless-stopped
    environment:
      COMPARTMENT_API_BIND_HOST: ${COMPARTMENT_API_BIND_HOST}
      COMPARTMENT_API_PORT: ${COMPARTMENT_API_PORT}
      COMPARTMENT_AUDIT_RETENTION_DAYS: ${COMPARTMENT_AUDIT_RETENTION_DAYS}
      COMPARTMENT_AUDIT_RETENTION_CLEANUP_BATCH_SIZE: ${COMPARTMENT_AUDIT_RETENTION_CLEANUP_BATCH_SIZE}
      COMPARTMENT_AUDIT_RETENTION_CLEANUP_CRON: ${COMPARTMENT_AUDIT_RETENTION_CLEANUP_CRON}
      COMPARTMENT_AUDIT_RETENTION_CLEANUP_MAX_BATCHES: ${COMPARTMENT_AUDIT_RETENTION_CLEANUP_MAX_BATCHES}
      COMPARTMENT_AUDIT_FILE_SINK_DIR: ${COMPARTMENT_AUDIT_FILE_SINK_DIR}
      COMPARTMENT_AUDIT_FILE_SINK_ENABLED: ${COMPARTMENT_AUDIT_FILE_SINK_ENABLED}
      COMPARTMENT_AUDIT_FILE_SINK_RETENTION_FILES: ${COMPARTMENT_AUDIT_FILE_SINK_RETENTION_FILES}
      COMPARTMENT_AUDIT_FILE_SINK_ROTATE_INTERVAL: ${COMPARTMENT_AUDIT_FILE_SINK_ROTATE_INTERVAL}
      COMPARTMENT_AUDIT_FILE_SINK_ROTATE_SIZE: ${COMPARTMENT_AUDIT_FILE_SINK_ROTATE_SIZE}
      COMPARTMENT_BASE_DOMAIN: ${COMPARTMENT_BASE_DOMAIN}
      COMPARTMENT_CADDY_TLS_MODE: ${COMPARTMENT_CADDY_TLS_MODE}
      COMPARTMENT_CUSTOM_TLS_DIR: ${COMPARTMENT_CUSTOM_TLS_DIR}
      COMPARTMENT_DATABASE_URL: ${COMPARTMENT_DATABASE_URL}
      COMPARTMENT_EDGE_INTERNAL_HOST: ${COMPARTMENT_EDGE_INTERNAL_HOST}
      COMPARTMENT_EDGE_PORT: ${COMPARTMENT_EDGE_PORT}
      COMPARTMENT_EDGE_TOKEN: ${COMPARTMENT_EDGE_TOKEN}
      COMPARTMENT_ENV: ${COMPARTMENT_ENV}
      COMPARTMENT_LOG_LEVEL: ${COMPARTMENT_LOG_LEVEL}
      COMPARTMENT_MANAGED_DOMAIN_BROKER_TOKEN: ${COMPARTMENT_MANAGED_DOMAIN_BROKER_TOKEN}
      COMPARTMENT_MANAGED_DOMAIN_BROKER_URL: ${COMPARTMENT_MANAGED_DOMAIN_BROKER_URL}
      COMPARTMENT_TRUSTED_OUTBOUND_HOSTS: ${COMPARTMENT_TRUSTED_OUTBOUND_HOSTS}
      COMPARTMENT_ROLLBACK_RETENTION_LIMIT: ${COMPARTMENT_ROLLBACK_RETENTION_LIMIT}
      COMPARTMENT_POSTGRES_PASSWORD: ${COMPARTMENT_POSTGRES_PASSWORD}
      COMPARTMENT_PUBLIC_HTTP_PORT: ${COMPARTMENT_PUBLIC_HTTP_PORT}
      COMPARTMENT_PUBLIC_HTTPS_PORT: ${COMPARTMENT_PUBLIC_HTTPS_PORT}
      COMPARTMENT_PUBLIC_INGRESS_IPV4: ${COMPARTMENT_PUBLIC_INGRESS_IPV4}
      COMPARTMENT_PUBLIC_INGRESS_IPV6: ${COMPARTMENT_PUBLIC_INGRESS_IPV6}
      COMPARTMENT_PUBLIC_PROTOCOL: ${COMPARTMENT_PUBLIC_PROTOCOL}
      COMPARTMENT_RESOURCE_BACKUP_DIR: ${COMPARTMENT_RESOURCE_BACKUP_DIR}
      COMPARTMENT_RUNTIME_CONTROL_TOKEN: ${COMPARTMENT_RUNTIME_CONTROL_TOKEN}
      COMPARTMENT_RUNTIME_DEFAULT_UPSTREAM_HOST: ${COMPARTMENT_RUNTIME_DEFAULT_UPSTREAM_HOST}
      COMPARTMENT_SESSION_SECRET: ${COMPARTMENT_SESSION_SECRET}
      COMPARTMENT_SESSION_TTL: ${COMPARTMENT_SESSION_TTL}
      COMPARTMENT_SOURCE_ARCHIVE_DIR: ${COMPARTMENT_SOURCE_ARCHIVE_DIR}
      COMPARTMENT_SOURCE_ARCHIVE_MAX_BYTES: ${COMPARTMENT_SOURCE_ARCHIVE_MAX_BYTES}
      COMPARTMENT_NODE_AGENT_SOCKET: ${COMPARTMENT_NODE_AGENT_SOCKET}
      COMPARTMENT_THROTTLE_AUTH_ACTIVATE_ROUTE_MAX_REQUESTS: ${COMPARTMENT_THROTTLE_AUTH_ACTIVATE_ROUTE_MAX_REQUESTS}
      COMPARTMENT_THROTTLE_AUTH_ACTIVATE_ROUTE_WINDOW: ${COMPARTMENT_THROTTLE_AUTH_ACTIVATE_ROUTE_WINDOW}
      COMPARTMENT_THROTTLE_AUTH_ACTIVATE_SOURCE_BLOCK: ${COMPARTMENT_THROTTLE_AUTH_ACTIVATE_SOURCE_BLOCK}
      COMPARTMENT_THROTTLE_AUTH_ACTIVATE_SOURCE_MAX_FAILURES: ${COMPARTMENT_THROTTLE_AUTH_ACTIVATE_SOURCE_MAX_FAILURES}
      COMPARTMENT_THROTTLE_AUTH_ACTIVATE_SOURCE_SUBJECT_BLOCK: ${COMPARTMENT_THROTTLE_AUTH_ACTIVATE_SOURCE_SUBJECT_BLOCK}
      COMPARTMENT_THROTTLE_AUTH_ACTIVATE_SOURCE_SUBJECT_MAX_FAILURES: ${COMPARTMENT_THROTTLE_AUTH_ACTIVATE_SOURCE_SUBJECT_MAX_FAILURES}
      COMPARTMENT_THROTTLE_AUTH_ACTIVATE_SOURCE_SUBJECT_WINDOW: ${COMPARTMENT_THROTTLE_AUTH_ACTIVATE_SOURCE_SUBJECT_WINDOW}
      COMPARTMENT_THROTTLE_AUTH_ACTIVATE_SOURCE_WINDOW: ${COMPARTMENT_THROTTLE_AUTH_ACTIVATE_SOURCE_WINDOW}
      COMPARTMENT_THROTTLE_AUTH_ACTIVATE_SUBJECT_BLOCK: ${COMPARTMENT_THROTTLE_AUTH_ACTIVATE_SUBJECT_BLOCK}
      COMPARTMENT_THROTTLE_AUTH_ACTIVATE_SUBJECT_MAX_FAILURES: ${COMPARTMENT_THROTTLE_AUTH_ACTIVATE_SUBJECT_MAX_FAILURES}
      COMPARTMENT_THROTTLE_AUTH_ACTIVATE_SUBJECT_WINDOW: ${COMPARTMENT_THROTTLE_AUTH_ACTIVATE_SUBJECT_WINDOW}
      COMPARTMENT_THROTTLE_AUTH_LOGIN_ACCOUNT_BLOCK: ${COMPARTMENT_THROTTLE_AUTH_LOGIN_ACCOUNT_BLOCK}
      COMPARTMENT_THROTTLE_AUTH_LOGIN_ACCOUNT_MAX_FAILURES: ${COMPARTMENT_THROTTLE_AUTH_LOGIN_ACCOUNT_MAX_FAILURES}
      COMPARTMENT_THROTTLE_AUTH_LOGIN_ACCOUNT_WINDOW: ${COMPARTMENT_THROTTLE_AUTH_LOGIN_ACCOUNT_WINDOW}
      COMPARTMENT_THROTTLE_AUTH_LOGIN_ROUTE_MAX_REQUESTS: ${COMPARTMENT_THROTTLE_AUTH_LOGIN_ROUTE_MAX_REQUESTS}
      COMPARTMENT_THROTTLE_AUTH_LOGIN_ROUTE_WINDOW: ${COMPARTMENT_THROTTLE_AUTH_LOGIN_ROUTE_WINDOW}
      COMPARTMENT_THROTTLE_AUTH_LOGIN_SOURCE_ACCOUNT_BLOCK: ${COMPARTMENT_THROTTLE_AUTH_LOGIN_SOURCE_ACCOUNT_BLOCK}
      COMPARTMENT_THROTTLE_AUTH_LOGIN_SOURCE_ACCOUNT_MAX_FAILURES: ${COMPARTMENT_THROTTLE_AUTH_LOGIN_SOURCE_ACCOUNT_MAX_FAILURES}
      COMPARTMENT_THROTTLE_AUTH_LOGIN_SOURCE_ACCOUNT_WINDOW: ${COMPARTMENT_THROTTLE_AUTH_LOGIN_SOURCE_ACCOUNT_WINDOW}
      COMPARTMENT_THROTTLE_AUTH_LOGIN_SOURCE_BLOCK: ${COMPARTMENT_THROTTLE_AUTH_LOGIN_SOURCE_BLOCK}
      COMPARTMENT_THROTTLE_AUTH_LOGIN_SOURCE_MAX_FAILURES: ${COMPARTMENT_THROTTLE_AUTH_LOGIN_SOURCE_MAX_FAILURES}
      COMPARTMENT_THROTTLE_AUTH_LOGIN_SOURCE_WINDOW: ${COMPARTMENT_THROTTLE_AUTH_LOGIN_SOURCE_WINDOW}
      COMPARTMENT_THROTTLE_AUTH_RESET_PASSWORD_ROUTE_MAX_REQUESTS: ${COMPARTMENT_THROTTLE_AUTH_RESET_PASSWORD_ROUTE_MAX_REQUESTS}
      COMPARTMENT_THROTTLE_AUTH_RESET_PASSWORD_ROUTE_WINDOW: ${COMPARTMENT_THROTTLE_AUTH_RESET_PASSWORD_ROUTE_WINDOW}
      COMPARTMENT_THROTTLE_AUTH_RESET_PASSWORD_SOURCE_BLOCK: ${COMPARTMENT_THROTTLE_AUTH_RESET_PASSWORD_SOURCE_BLOCK}
      COMPARTMENT_THROTTLE_AUTH_RESET_PASSWORD_SOURCE_MAX_FAILURES: ${COMPARTMENT_THROTTLE_AUTH_RESET_PASSWORD_SOURCE_MAX_FAILURES}
      COMPARTMENT_THROTTLE_AUTH_RESET_PASSWORD_SOURCE_SUBJECT_BLOCK: ${COMPARTMENT_THROTTLE_AUTH_RESET_PASSWORD_SOURCE_SUBJECT_BLOCK}
      COMPARTMENT_THROTTLE_AUTH_RESET_PASSWORD_SOURCE_SUBJECT_MAX_FAILURES: ${COMPARTMENT_THROTTLE_AUTH_RESET_PASSWORD_SOURCE_SUBJECT_MAX_FAILURES}
      COMPARTMENT_THROTTLE_AUTH_RESET_PASSWORD_SOURCE_SUBJECT_WINDOW: ${COMPARTMENT_THROTTLE_AUTH_RESET_PASSWORD_SOURCE_SUBJECT_WINDOW}
      COMPARTMENT_THROTTLE_AUTH_RESET_PASSWORD_SOURCE_WINDOW: ${COMPARTMENT_THROTTLE_AUTH_RESET_PASSWORD_SOURCE_WINDOW}
      COMPARTMENT_THROTTLE_AUTH_RESET_PASSWORD_SUBJECT_BLOCK: ${COMPARTMENT_THROTTLE_AUTH_RESET_PASSWORD_SUBJECT_BLOCK}
      COMPARTMENT_THROTTLE_AUTH_RESET_PASSWORD_SUBJECT_MAX_FAILURES: ${COMPARTMENT_THROTTLE_AUTH_RESET_PASSWORD_SUBJECT_MAX_FAILURES}
      COMPARTMENT_THROTTLE_AUTH_RESET_PASSWORD_SUBJECT_WINDOW: ${COMPARTMENT_THROTTLE_AUTH_RESET_PASSWORD_SUBJECT_WINDOW}
      COMPARTMENT_SYSTEM_API_SOCKET: ${COMPARTMENT_SYSTEM_API_SOCKET}
      COMPARTMENT_SYSTEM_TOKEN: ${COMPARTMENT_SYSTEM_TOKEN}
      COMPARTMENT_VARIABLES_MASTER_KEY: ${COMPARTMENT_VARIABLES_MASTER_KEY}
    ports:
      - '127.0.0.1:${COMPARTMENT_API_PORT}:${COMPARTMENT_API_PORT}'
    volumes:
      - ${COMPARTMENT_AUDIT_FILE_SINK_DIR}:${COMPARTMENT_AUDIT_FILE_SINK_DIR}
      - ${COMPARTMENT_CUSTOM_TLS_DIR}:${COMPARTMENT_CUSTOM_TLS_DIR}:ro
      - ${COMPARTMENT_RESOURCE_BACKUP_DIR}:${COMPARTMENT_RESOURCE_BACKUP_DIR}
      - ${COMPARTMENT_SOURCE_ARCHIVE_DIR}:${COMPARTMENT_SOURCE_ARCHIVE_DIR}
      - /var/run/compartment/api:/var/run/compartment/api
      - /var/run/compartment/node:/var/run/compartment/node
    depends_on:
      api-migrate:
        condition: service_completed_successfully
    networks:
      - system_internal
      - db_internal
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:' + process.env.COMPARTMENT_API_PORT + '/readyz').then((response) => { process.exit(response.ok ? 0 : 1); }).catch(() => { process.exit(1); });",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
    extra_hosts:
      - host.docker.internal:host-gateway
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m

  registry:
    image: registry:2
    restart: unless-stopped
    environment:
      REGISTRY_HTTP_RELATIVEURLS: 'true'
      REGISTRY_STORAGE_DELETE_ENABLED: 'true'
    volumes:
      - compartment-artifact-registry-data:/var/lib/registry
    networks:
      - system_internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m

  registry-auth:
    image: ${COMPARTMENT_WORKER_IMAGE}
    restart: unless-stopped
    command: ['node', 'dist/registry-auth-proxy.js']
    environment:
      # Intentionally listens on all container interfaces so BuildKit and worker paths can reach it;
      # host access stays loopback-only through the ports mapping below.
      COMPARTMENT_ARTIFACT_REGISTRY_PROXY_BIND_HOST: 0.0.0.0
      COMPARTMENT_ARTIFACT_REGISTRY_PROXY_PORT: 5000
      COMPARTMENT_ARTIFACT_REGISTRY_PROXY_TARGET_URL: http://registry:5000
      COMPARTMENT_ARTIFACT_REGISTRY_READ_PASSWORD: ${COMPARTMENT_ARTIFACT_REGISTRY_READ_PASSWORD}
      COMPARTMENT_ARTIFACT_REGISTRY_READ_USERNAME: ${COMPARTMENT_ARTIFACT_REGISTRY_READ_USERNAME}
      COMPARTMENT_ARTIFACT_REGISTRY_WRITE_PASSWORD: ${COMPARTMENT_ARTIFACT_REGISTRY_WRITE_PASSWORD}
      COMPARTMENT_ARTIFACT_REGISTRY_WRITE_USERNAME: ${COMPARTMENT_ARTIFACT_REGISTRY_WRITE_USERNAME}
    ports:
      - '127.0.0.1:${COMPARTMENT_ARTIFACT_REGISTRY_PORT}:5000'
    depends_on:
      - registry
    networks:
      - build_internal
      - system_internal
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  edge:
    image: ${COMPARTMENT_EDGE_IMAGE}
    restart: unless-stopped
    environment:
      COMPARTMENT_API_INTERNAL_HOST: ${COMPARTMENT_API_INTERNAL_HOST}
      COMPARTMENT_API_PORT: ${COMPARTMENT_API_PORT}
      COMPARTMENT_BASE_DOMAIN: ${COMPARTMENT_BASE_DOMAIN}
      COMPARTMENT_EDGE_BIND_HOST: ${COMPARTMENT_EDGE_BIND_HOST}
      COMPARTMENT_EDGE_INTERNAL_HOST: ${COMPARTMENT_EDGE_INTERNAL_HOST}
      COMPARTMENT_EDGE_PORT: ${COMPARTMENT_EDGE_PORT}
      COMPARTMENT_EDGE_SNAPSHOT_PATH: ${COMPARTMENT_EDGE_SNAPSHOT_PATH}
      COMPARTMENT_EDGE_TOKEN: ${COMPARTMENT_EDGE_TOKEN}
      COMPARTMENT_LOG_LEVEL: ${COMPARTMENT_LOG_LEVEL}
      COMPARTMENT_PUBLIC_PROTOCOL: ${COMPARTMENT_PUBLIC_PROTOCOL}
    ports:
      - '127.0.0.1:${COMPARTMENT_EDGE_PORT}:${COMPARTMENT_EDGE_PORT}'
    depends_on:
      api:
        condition: service_started
    networks:
      - system_internal
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:' + process.env.COMPARTMENT_EDGE_PORT + '/healthz').then((response) => { process.exit(response.ok ? 0 : 1); }).catch(() => { process.exit(1); });",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - compartment-edge-snapshot:/var/lib/compartment-edge
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m

  builder:
    image: moby/buildkit:v0.30.0
    restart: unless-stopped
    command: ['--addr', 'unix:///run/buildkit/buildkitd.sock', '--group', '${COMPARTMENT_RUNTIME_GID}']
    privileged: true
    volumes:
      - compartment-buildkit-socket:/run/buildkit
      - compartment-buildkit-rootful-state:/var/lib/buildkit
    networks:
      - build_internal
    healthcheck:
      test: ['CMD', 'buildctl', '--addr', 'unix:///run/buildkit/buildkitd.sock', 'debug', 'workers']
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  worker:
    image: ${COMPARTMENT_WORKER_IMAGE}
    user: '${COMPARTMENT_RUNTIME_UID}:${COMPARTMENT_RUNTIME_GID}'
    restart: unless-stopped
    environment:
      BUILDKIT_ADDR: ${BUILDKIT_ADDR}
      COMPARTMENT_API_INTERNAL_HOST: ${COMPARTMENT_API_INTERNAL_HOST}
      COMPARTMENT_API_PORT: ${COMPARTMENT_API_PORT}
      COMPARTMENT_ARTIFACT_REGISTRY_HOST: ${COMPARTMENT_ARTIFACT_REGISTRY_HOST}
      COMPARTMENT_ARTIFACT_REGISTRY_PORT: ${COMPARTMENT_ARTIFACT_REGISTRY_PORT}
      COMPARTMENT_ARTIFACT_REGISTRY_INTERNAL_URL: ${COMPARTMENT_ARTIFACT_REGISTRY_INTERNAL_URL}
      COMPARTMENT_ARTIFACT_REGISTRY_MODE: ${COMPARTMENT_ARTIFACT_REGISTRY_MODE}
      COMPARTMENT_ARTIFACT_REGISTRY_READ_PASSWORD: ${COMPARTMENT_ARTIFACT_REGISTRY_READ_PASSWORD}
      COMPARTMENT_ARTIFACT_REGISTRY_READ_USERNAME: ${COMPARTMENT_ARTIFACT_REGISTRY_READ_USERNAME}
      COMPARTMENT_ARTIFACT_REGISTRY_WRITE_PASSWORD: ${COMPARTMENT_ARTIFACT_REGISTRY_WRITE_PASSWORD}
      COMPARTMENT_ARTIFACT_REGISTRY_WRITE_USERNAME: ${COMPARTMENT_ARTIFACT_REGISTRY_WRITE_USERNAME}
      COMPARTMENT_DOCKER_NAMESPACE: ${COMPARTMENT_DOCKER_NAMESPACE}
      COMPARTMENT_LOG_LEVEL: ${COMPARTMENT_LOG_LEVEL}
      COMPARTMENT_NODE_AGENT_SOCKET: ${COMPARTMENT_NODE_AGENT_SOCKET}
      COMPARTMENT_RUNTIME_CONTROL_TOKEN: ${COMPARTMENT_RUNTIME_CONTROL_TOKEN}
      COMPARTMENT_TRUSTED_OUTBOUND_HOSTS: ${COMPARTMENT_TRUSTED_OUTBOUND_HOSTS}
      COMPARTMENT_WORKER_POLL_INTERVAL_MS: ${COMPARTMENT_WORKER_POLL_INTERVAL_MS}
      DOCKER_CONFIG: /tmp/.docker
      TMPDIR: /compartment/docker-work
    volumes:
      - ${COMPARTMENT_DOCKER_WORK_DIR}:/compartment/docker-work
      - compartment-buildkit-socket:/run/buildkit:ro
      - /var/run/compartment/node:/var/run/compartment/node
    depends_on:
      api:
        condition: service_healthy
      builder:
        condition: service_healthy
      registry-auth:
        condition: service_started
    networks:
      - system_internal
    extra_hosts:
      - host.docker.internal:host-gateway
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=1g

  caddy:
    image: ${COMPARTMENT_CADDY_IMAGE}
    user: '0:${COMPARTMENT_RUNTIME_GID}'
    restart: unless-stopped
    environment:
      COMPARTMENT_ACME_CA_URL: ${COMPARTMENT_ACME_CA_URL}
      COMPARTMENT_ACME_EMAIL: ${COMPARTMENT_ACME_EMAIL}
      COMPARTMENT_API_INTERNAL_HOST: ${COMPARTMENT_API_INTERNAL_HOST}
      COMPARTMENT_API_PORT: ${COMPARTMENT_API_PORT}
      COMPARTMENT_BASE_DOMAIN: ${COMPARTMENT_BASE_DOMAIN}
      COMPARTMENT_CADDY_TLS_MODE: ${COMPARTMENT_CADDY_TLS_MODE}
      COMPARTMENT_CUSTOM_TLS_CERT_FILE: ${COMPARTMENT_CUSTOM_TLS_CERT_FILE}
      COMPARTMENT_CUSTOM_TLS_KEY_FILE: ${COMPARTMENT_CUSTOM_TLS_KEY_FILE}
      COMPARTMENT_EDGE_INTERNAL_HOST: ${COMPARTMENT_EDGE_INTERNAL_HOST}
      COMPARTMENT_EDGE_PORT: ${COMPARTMENT_EDGE_PORT}
      COMPARTMENT_MANAGED_DOMAIN_BROKER_TOKEN: ${COMPARTMENT_MANAGED_DOMAIN_BROKER_TOKEN}
      COMPARTMENT_MANAGED_DOMAIN_BROKER_URL: ${COMPARTMENT_MANAGED_DOMAIN_BROKER_URL}
      COMPARTMENT_PUBLIC_HTTP_PORT: ${COMPARTMENT_PUBLIC_HTTP_PORT}
      COMPARTMENT_PUBLIC_HTTPS_PORT: ${COMPARTMENT_PUBLIC_HTTPS_PORT}
    ports:
      - '${COMPARTMENT_PUBLIC_HTTP_PORT}:${COMPARTMENT_PUBLIC_HTTP_PORT}'
      - '${COMPARTMENT_PUBLIC_HTTPS_PORT}:${COMPARTMENT_PUBLIC_HTTPS_PORT}'
    volumes:
      - compartment-caddy-data:/data
      - ${COMPARTMENT_CUSTOM_TLS_DIR}:${COMPARTMENT_CUSTOM_TLS_DIR}:ro
    depends_on:
      api:
        condition: service_healthy
      edge:
        condition: service_healthy
    networks:
      - system_internal
    extra_hosts:
      - host.docker.internal:host-gateway
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /config:rw,noexec,nosuid,nodev,size=32m
      - /tmp:rw,noexec,nosuid,nodev,size=32m

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${COMPARTMENT_POSTGRES_DB}
      POSTGRES_PASSWORD: ${COMPARTMENT_POSTGRES_PASSWORD}
      POSTGRES_USER: ${COMPARTMENT_POSTGRES_USER}
    volumes:
      - compartment-postgres-data:/var/lib/postgresql/data
    networks:
      - db_internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=8m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

volumes:
  compartment-artifact-registry-data:
  compartment-buildkit-socket:
  compartment-buildkit-rootful-state:
  compartment-caddy-data:
  compartment-edge-snapshot:
  compartment-postgres-data:

networks:
  build_internal:
  db_internal:
  system_internal:
