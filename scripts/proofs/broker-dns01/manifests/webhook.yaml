apiVersion: v1
kind: ServiceAccount
metadata:
  name: broker-dns01-webhook
  namespace: proof
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: broker-dns01-webhook:authentication-reader
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: broker-dns01-webhook
    namespace: proof
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: broker-dns01-webhook:auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: broker-dns01-webhook
    namespace: proof
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: broker-dns01-webhook:solver
rules:
  - apiGroups: [dns01.proof.compartment.test]
    resources: ['*']
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: broker-dns01-webhook:solver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: broker-dns01-webhook:solver
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: broker-dns01-webhook-selfsigned
  namespace: proof
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: broker-dns01-webhook-ca
  namespace: proof
spec:
  secretName: broker-dns01-webhook-ca
  isCA: true
  commonName: broker-dns01-webhook-ca
  issuerRef:
    name: broker-dns01-webhook-selfsigned
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: broker-dns01-webhook-ca
  namespace: proof
spec:
  ca:
    secretName: broker-dns01-webhook-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: broker-dns01-webhook-tls
  namespace: proof
spec:
  secretName: broker-dns01-webhook-tls
  issuerRef:
    name: broker-dns01-webhook-ca
  dnsNames:
    - broker-dns01-webhook
    - broker-dns01-webhook.proof
    - broker-dns01-webhook.proof.svc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broker-dns01-webhook
  namespace: proof
spec:
  replicas: 1
  selector:
    matchLabels: { app: broker-dns01-webhook }
  template:
    metadata:
      labels: { app: broker-dns01-webhook }
    spec:
      serviceAccountName: broker-dns01-webhook
      containers:
        - name: webhook
          image: compartment-proof/broker-dns01-solver:v1.21.0
          imagePullPolicy: Never
          args:
            - --tls-cert-file=/tls/tls.crt
            - --tls-private-key-file=/tls/tls.key
            - --secure-port=8443
          env:
            - { name: GROUP_NAME, value: dns01.proof.compartment.test }
          ports:
            - { name: https, containerPort: 8443 }
          readinessProbe:
            httpGet: { scheme: HTTPS, path: /healthz, port: https }
            periodSeconds: 2
            failureThreshold: 30
          volumeMounts:
            - { name: tls, mountPath: /tls, readOnly: true }
      volumes:
        - name: tls
          secret:
            secretName: broker-dns01-webhook-tls
---
apiVersion: v1
kind: Service
metadata:
  name: broker-dns01-webhook
  namespace: proof
spec:
  selector: { app: broker-dns01-webhook }
  ports:
    - { name: https, port: 443, targetPort: https }
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1alpha1.dns01.proof.compartment.test
  annotations:
    cert-manager.io/inject-ca-from: proof/broker-dns01-webhook-tls
spec:
  group: dns01.proof.compartment.test
  groupPriorityMinimum: 1000
  versionPriority: 15
  service:
    name: broker-dns01-webhook
    namespace: proof
  version: v1alpha1
