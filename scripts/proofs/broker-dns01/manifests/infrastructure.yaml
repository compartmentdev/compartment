apiVersion: apps/v1
kind: Deployment
metadata:
  name: challtestsrv
  namespace: proof
spec:
  replicas: 1
  selector:
    matchLabels: { app: challtestsrv }
  template:
    metadata:
      labels: { app: challtestsrv }
    spec:
      containers:
        - name: challtestsrv
          image: ghcr.io/letsencrypt/pebble-challtestsrv@sha256:12ce21884def456bcf9786542113949e1f19dc7738d2c70e156c2d0c38a1405b
          args: ['-defaultIPv4', '', '-defaultIPv6', '', '-http01', '', '-https01', '', '-tlsalpn01', '']
          ports:
            - { name: dns-tcp, containerPort: 8053, protocol: TCP }
            - { name: dns-udp, containerPort: 8053, protocol: UDP }
            - { name: management, containerPort: 8055 }
          readinessProbe:
            tcpSocket: { port: management }
            periodSeconds: 2
            failureThreshold: 30
        - name: coredns
          image: rancher/mirrored-coredns-coredns@sha256:82979ddf442c593027a57239ad90616deb874e90c365d1a96ad508c2104bdea5
          args: ['-conf', '/etc/coredns/Corefile']
          ports:
            - { name: public-dns, containerPort: 53, protocol: TCP }
            - { name: public-dns-udp, containerPort: 53, protocol: UDP }
          readinessProbe:
            tcpSocket: { port: public-dns }
            periodSeconds: 2
            failureThreshold: 30
          volumeMounts:
            - { name: dns-config, mountPath: /etc/coredns, readOnly: true }
      volumes:
        - name: dns-config
          configMap:
            name: proof-dns-config
---
apiVersion: v1
kind: Service
metadata:
  name: challtestsrv
  namespace: proof
spec:
  selector: { app: challtestsrv }
  ports:
    - { name: public-dns, port: 53, targetPort: public-dns, protocol: TCP }
    - { name: public-dns-udp, port: 53, targetPort: public-dns-udp, protocol: UDP }
    - { name: dns-tcp, port: 8053, targetPort: dns-tcp, protocol: TCP }
    - { name: dns-udp, port: 8053, targetPort: dns-udp, protocol: UDP }
    - { name: management, port: 8055, targetPort: management }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: broker-only-dns-management
  namespace: proof
spec:
  podSelector:
    matchLabels: { app: challtestsrv }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: broker }
      ports:
        - { port: 8055, protocol: TCP }
    - from:
        - namespaceSelector: {}
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - { port: 53, protocol: TCP }
        - { port: 53, protocol: UDP }
---
apiVersion: v1
kind: Service
metadata:
  name: proof-dns
  namespace: proof
spec:
  type: NodePort
  selector: { app: challtestsrv }
  ports:
    - { name: dns-tcp, port: 53, targetPort: public-dns, nodePort: 30053, protocol: TCP }
    - { name: dns-udp, port: 53, targetPort: public-dns-udp, nodePort: 30053, protocol: UDP }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: proof-dns-config
  namespace: proof
data:
  Corefile: |
    .:53 {
      errors
      template IN SOA {
        match ^(?:.*\.)?proof\.test\.$
        answer "proof.test. 60 IN SOA ns.proof.test. hostmaster.proof.test. 1 7200 3600 1209600 60"
      }
      forward . 127.0.0.1:8053
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pebble
  namespace: proof
spec:
  replicas: 1
  selector:
    matchLabels: { app: pebble }
  template:
    metadata:
      labels: { app: pebble }
    spec:
      containers:
        - name: pebble
          image: ghcr.io/letsencrypt/pebble@sha256:ddf230642b1a584f519f32e347de1b05a6e4c1f6c35c1863b33effeab5f78199
          args:
            [
              '-config',
              'test/config/pebble-config.json',
              '-strict',
              '-dnsserver',
              'challtestsrv.proof.svc.cluster.local:53',
            ]
          env:
            - { name: PEBBLE_VA_NOSLEEP, value: '1' }
            - { name: PEBBLE_VA_ALWAYS_VALID, value: '0' }
            - { name: PEBBLE_AUTHZREUSE, value: '0' }
          ports:
            - { name: acme, containerPort: 14000 }
          readinessProbe:
            httpGet: { path: /dir, port: acme, scheme: HTTPS }
            periodSeconds: 2
            failureThreshold: 60
---
apiVersion: v1
kind: Service
metadata:
  name: pebble
  namespace: proof
spec:
  selector: { app: pebble }
  ports:
    - { name: acme, port: 14000, targetPort: acme }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broker
  namespace: proof
spec:
  replicas: 1
  selector:
    matchLabels: { app: broker }
  template:
    metadata:
      labels: { app: broker }
    spec:
      containers:
        - name: broker
          image: public.ecr.aws/docker/library/node@sha256:f22d6a1f082c02f292e86929b5b0442ac2e5eaf438a5dea9b1566601c3e05940
          command: ['node', '/proof/broker.mjs']
          env:
            - { name: TEST_ZONE, value: proof.test }
            - { name: CHALLENGE_SERVER_URL, value: 'http://challtestsrv.proof.svc.cluster.local:8055' }
            - { name: STATE_PATH, value: /state/state.json }
            - { name: RESERVATION_TOKEN, value: proof-reservation-authority }
            - { name: PROOF_CONTROL_TOKEN, value: proof-control-authority }
          ports:
            - { name: http, containerPort: 3000 }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          volumeMounts:
            - { name: source, mountPath: /proof, readOnly: true }
            - { name: state, mountPath: /state }
      volumes:
        - name: source
          configMap:
            name: broker-source
        - name: state
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: broker
  namespace: proof
spec:
  type: NodePort
  selector: { app: broker }
  ports:
    - { name: http, port: 3000, targetPort: http, nodePort: 30090 }
