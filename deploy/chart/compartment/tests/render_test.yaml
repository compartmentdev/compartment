            - apiGroups: [rbac.authorization.k8s.io]
              resources: [rolebindings]
              resourceNames: [compartment-project-bootstrap]
              verbs: [get, delete]
            - apiGroups: [rbac.authorization.k8s.io]
              resources: [clusterroles]
              resourceNames: [compartment-controller]
              verbs: [bind]
            - apiGroups: [rbac.authorization.k8s.io]
              resources: [clusterrolebindings]
              resourceNames: [compartment-project-bootstrap]
              verbs: [delete]
        template: project-provisioner-rbac.yaml
        documentIndex: 3
      - equal:
          path: rules
          value:
            - apiGroups: ['']
              resources: [serviceaccounts, secrets]
              verbs: [get, create, patch, delete]
            - apiGroups: ['']
              resources: [pods]
              verbs: [get, list, watch]
            - apiGroups: ['']
              resources: [pods/log]
              verbs: [get]
            - apiGroups: [batch]
              resources: [jobs]
              verbs: [get, list, watch, create, patch, delete]
        template: project-provisioner-rbac.yaml
        documentIndex: 4
      - equal:
          path: rules
          value:
            - apiGroups: [rbac.authorization.k8s.io]
              resources: [clusterrolebindings]
              verbs: [create]
            - apiGroups: [rbac.authorization.k8s.io]
              resources: [clusterrolebindings]
              resourceNames: [compartment-project-bootstrap]
              verbs: [get, update, patch, delete]
            - apiGroups: [rbac.authorization.k8s.io]
              resources: [clusterroles]
              resourceNames: [compartment-project-bootstrap]
              verbs: [bind]
        template: project-provisioner-rbac.yaml
        documentIndex: 6
      - equal:
          path: metadata.name
          value: compartment-compartment-project-provisioner
        template: project-provisioner-rbac.yaml
        documentIndex: 1
      - isKind:
          of: RoleBinding
        template: project-provisioner-rbac.yaml
        documentIndex: 5
      - equal:
