# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/v1.1.1/schema/helm-testsuite.json
suite: chart render scenarios
templates:
  - templates/*.yaml
release:
  name: compartment
  namespace: default
tests:
  - it: renders only foundation resources during the foundation stage
    set:
      platform:
        startupStage: foundation
      secrets: &stableSecrets
        installToken: test-install-token
        postgresPassword: test-postgres-password
        registryReadPassword: test-registry-read-password
        registryWritePassword: test-registry-write-password
        edgeToken: test-edge-token
        productLogIngestToken: test-product-log-token
        runtimeControlToken: test-runtime-control-token
        sessionSecret: test-session-secret
        systemToken: test-system-token
        variablesMasterKey: test-variables-master-key
        managedDomainBrokerToken: ''
    asserts:
      - notFailedTemplate: {}
      - hasDocuments:
          count: 1
        template: install-state-secret.yaml
      - isKind:
          of: Secret
        template: install-state-secret.yaml
      - hasDocuments:
          count: 1
        template: secret.yaml
      - isKind:
          of: Secret
        template: secret.yaml
      - hasDocuments:
          count: 1
        template: configmap.yaml
      - isKind:
          of: ConfigMap
        template: configmap.yaml
      - hasDocuments:
          count: 2
        template: pvc.yaml
      - isKind:
          of: PersistentVolumeClaim
        template: pvc.yaml
      - hasDocuments:
          count: 1
        template: caddy.yaml
      - isKind:
          of: Service
        template: caddy.yaml
        documentIndex: 0
      - hasDocuments:
          count: 2
        template: postgres.yaml
      - isKind:
          of: Service
        template: postgres.yaml
        documentIndex: 0
      - isKind:
          of: Deployment
        template: postgres.yaml
        documentIndex: 1
      - hasDocuments:
          count: 2
        template: registry.yaml
      - isKind:
          of: Service
        template: registry.yaml
        documentIndex: 0
      - isKind:
          of: Deployment
        template: registry.yaml
        documentIndex: 1
      - hasDocuments:
          count: 0
        template: api.yaml
      - hasDocuments:
          count: 0
        template: worker.yaml
      - hasDocuments:
          count: 0
        template: edge.yaml
      - hasDocuments:
          count: 0
        template: buildkit.yaml
      - hasDocuments:
          count: 0
        template: api-migrate.yaml
      - hasDocuments:
          count: 0
        template: api-migrate-rbac.yaml
      - hasDocuments:
          count: 0
        template: buildkit-network-policy.yaml
      - hasDocuments:
          count: 0
        template: project-provisioner.yaml
      - hasDocuments:
          count: 0
        template: project-provisioner-rbac.yaml
      - hasDocuments:
          count: 0
        template: registry-auth.yaml
      - hasDocuments:
          count: 0
        template: registry-client-secret.yaml
      - hasDocuments:
          count: 0
        template: registry-network-policy.yaml
      - hasDocuments:
          count: 0
        template: product-log-agent.yaml

  - it: renders a full public installation with public ingress and workloads
    set:
      platform:
        startupStage: full
        installationId: test-install
        baseDomain: apps.example.com
        publicProtocol: https
        publicIngressIpv4: 8.8.8.8
        managedDomainBrokerUrl: ''
      secrets: *stableSecrets
    asserts:
      - notFailedTemplate: {}
      - containsDocument:
          apiVersion: apps/v1
          kind: Deployment
          name: compartment-compartment-api
          any: true
        template: api.yaml
      - containsDocument:
          apiVersion: apps/v1
          kind: Deployment
          name: compartment-compartment-worker
          any: true
        template: worker.yaml
      - containsDocument:
          apiVersion: apps/v1
          kind: Deployment
          name: compartment-compartment-edge
          any: true
        template: edge.yaml
      - containsDocument:
          apiVersion: apps/v1
          kind: Deployment
          name: compartment-compartment-caddy
          any: true
        template: caddy.yaml
      - hasDocuments:
          count: 4
        template: api-migrate-rbac.yaml
      - isKind:
          of: ServiceAccount
        template: api-migrate-rbac.yaml
        documentIndex: 0
      - equal:
          path: metadata.name
          value: compartment-compartment-waiter
        template: api-migrate-rbac.yaml
        documentIndex: 0
      - isKind:
          of: RoleBinding
        template: api-migrate-rbac.yaml
        documentIndex: 3
      - hasDocuments:
          count: 5
        template: product-log-agent.yaml
      - isKind:
          of: Namespace
        template: product-log-agent.yaml
        documentIndex: 0
      - isKind:
          of: DaemonSet
        template: product-log-agent.yaml
        documentIndex: 4
      - equal:
          path: metadata.name
          value: compartment-compartment-log-agent
        template: product-log-agent.yaml
        documentIndex: 4
      - hasDocuments:
          count: 5
        template: buildkit.yaml
      - isKind:
          of: Namespace
        template: buildkit.yaml
        documentIndex: 0
      - equal:
          path: metadata.labels["pod-security.kubernetes.io/enforce"]
          value: privileged
        template: buildkit.yaml
        documentIndex: 0
      - equal:
          path: metadata.name
          value: compartment-build
        template: buildkit.yaml
        documentIndex: 0
      - isKind:
          of: Deployment
        template: buildkit.yaml
        documentIndex: 3
      - contains:
          path: spec.template.spec.containers[0].args
          content: --oci-worker-no-process-sandbox
        template: buildkit.yaml
        documentIndex: 3
      - contains:
          path: spec.template.spec.containers[0].args
          content: --oci-worker-gc-keepstorage
        template: buildkit.yaml
        documentIndex: 3
      - equal:
          path: metadata.namespace
          value: compartment-build
        template: buildkit.yaml
        documentIndex: 3
      - isKind:
          of: CronJob
        template: buildkit.yaml
        documentIndex: 4
      - hasDocuments:
          count: 3
        template: buildkit-network-policy.yaml
      - hasDocuments:
          count: 10
        template: project-provisioner-rbac.yaml
      - isKind:
          of: Namespace
        template: project-provisioner-rbac.yaml
        documentIndex: 0
      - equal:
          path: metadata.name
          value: compartment-compartment-project-provisioning
        template: project-provisioner-rbac.yaml
        documentIndex: 0
      - isKind:
          of: ServiceAccount
        template: project-provisioner-rbac.yaml
        documentIndex: 1
      - equal:
          path: metadata.name
          value: compartment-controller
        template: project-provisioner-rbac.yaml
        documentIndex: 2
      - equal:
          path: metadata.name
          value: compartment-project-bootstrap
        template: project-provisioner-rbac.yaml
        documentIndex: 3
      - equal:
          path: metadata.name
          value: compartment-compartment-project-provisioner
        template: project-provisioner-rbac.yaml
        documentIndex: 6
      - equal:
          path: rules
          value:
            - apiGroups: [apps]
              resources: [deployments]
              verbs: [get, list, watch, create, update, patch, delete]
            - apiGroups: [batch]
              resources: [jobs]
              verbs: [get, list, watch, create, update, patch, delete]
            - apiGroups: ['']
              resources: [services, secrets, persistentvolumeclaims]
              verbs: [get, list, watch, create, update, patch, delete]
            - apiGroups: ['']
              resources: [pods]
              verbs: [get, list, watch]
            - apiGroups: ['']
              resources: [pods/log]
              verbs: [get]
            - apiGroups: [metrics.k8s.io]
              resources: [pods]
              verbs: [get, list]
