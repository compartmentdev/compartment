              - secrets
              - persistentvolumeclaims
            verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete
        template: project-provisioner-rbac.yaml
        documentIndex: 2
      - contains:
          path: rules
          content:
            apiGroups:
              - rbac.authorization.k8s.io
            resources:
              - clusterroles
            resourceNames:
              - compartment-project-bootstrap
            verbs:
              - bind
        template: project-provisioner-rbac.yaml
        documentIndex: 6
      - contains:
          path: rules
          content:
            apiGroups:
              - rbac.authorization.k8s.io
            resources:
              - clusterrolebindings
            verbs:
              - create
        template: project-provisioner-rbac.yaml
        documentIndex: 6
      - contains:
          path: rules
          content:
            apiGroups:
              - rbac.authorization.k8s.io
            resources:
              - clusterrolebindings
            resourceNames:
              - compartment-project-bootstrap
            verbs:
              - get
              - update
              - patch
              - delete
        template: project-provisioner-rbac.yaml
        documentIndex: 6
      - contains:
          path: rules
          content:
            apiGroups:
              - rbac.authorization.k8s.io
            resources:
              - rolebindings
            verbs:
              - create
        template: project-provisioner-rbac.yaml
        documentIndex: 3
      - contains:
