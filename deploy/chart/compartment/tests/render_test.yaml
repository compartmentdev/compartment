            verbs:
              - get
              - delete
        template: project-provisioner-rbac.yaml
        documentIndex: 3
      - equal:
          path: metadata.namespace
          value: compartment-compartment-project-provisioning
        template: project-provisioner-rbac.yaml
        documentIndex: 4
      - contains:
          path: rules
          content:
            apiGroups:
              - ''
            resources:
              - serviceaccounts
              - secrets
            verbs:
              - get
              - create
              - patch
              - delete
        template: project-provisioner-rbac.yaml
        documentIndex: 4
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - node
            - dist/project-provisioner-server.js
        template: project-provisioner.yaml
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-api-migrate
        template: worker.yaml
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: wait-for-api-rollout
        template: worker.yaml
      - equal:
          path: spec.template.spec.initContainers[2].name
          value: wait-for-api
        template: worker.yaml
      - contains:
          path: spec.template.spec.initContainers[1].args
          content: rollout
        template: worker.yaml
      - contains:
          path: spec.template.spec.initContainers[1].args
          content: status
        template: worker.yaml
      - contains:
          path: spec.template.spec.initContainers[1].args
          content: deployment/compartment-compartment-api
        template: worker.yaml
      - matchRegex:
          path: spec.template.spec.initContainers[2].args[0]
          pattern: COMPARTMENT_API_INTERNAL_HOST.*COMPARTMENT_API_PORT.*readyz
        template: worker.yaml
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-api-migrate
        template: project-provisioner.yaml
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: wait-for-api-rollout
        template: project-provisioner.yaml
      - equal:
          path: spec.template.spec.initContainers[2].name
