        template: project-provisioner-rbac.yaml
        documentIndex: 8
      - matchRegex:
          path: spec.matchConditions[0].expression
          pattern: system:serviceaccount:compartment-compartment-project-provisioning:cpt-
        template: project-provisioner-rbac.yaml
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: request\.namespace
        template: project-provisioner-rbac.yaml
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: object\.subjects\.size\(\) == 2
        template: project-provisioner-rbac.yaml
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: subject\.name == 'compartment-compartment-worker'
        template: project-provisioner-rbac.yaml
        documentIndex: 8
      - matchRegex:
          path: spec.validations[1].expression
          pattern: request\.userInfo\.username == 'system:serviceaccount:' \+ subject\.namespace
        template: project-provisioner-rbac.yaml
        documentIndex: 8
      - matchRegex:
          path: spec.validations[2].expression
          pattern: system:serviceaccount:default:compartment-compartment-project-provisioner
        template: project-provisioner-rbac.yaml
        documentIndex: 8
      - matchRegex:
          path: spec.validations[2].expression
          pattern: request\.resource\.resource != 'clusterrolebindings'
        template: project-provisioner-rbac.yaml
        documentIndex: 8
      - matchRegex:
          path: spec.validations[2].expression
          pattern: object\.subjects\.size\(\) == 1
        template: project-provisioner-rbac.yaml
        documentIndex: 8
      - contains:
          path: spec.validationActions
          content: Deny
        template: project-provisioner-rbac.yaml
        documentIndex: 9
      - equal:
          path: roleRef.name
          value: compartment-compartment-project-provisioner
        template: project-provisioner-rbac.yaml
        documentIndex: 7
      - equal:
          path: subjects[0].name
          value: compartment-compartment-project-provisioner
        template: project-provisioner-rbac.yaml
        documentIndex: 7
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: compartment-compartment-project-provisioner
              namespace: default
        template: project-provisioner-rbac.yaml
        documentIndex: 7
      - contains:
          path: rules
