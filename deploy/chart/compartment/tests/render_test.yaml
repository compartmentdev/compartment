  - it: maps operator retention and auth throttle overrides
    set:
      platform:
        rollbackRetentionLimit: 17
        authThrottle:
          login:
            route: { window: 2m, limit: 31 }
            source: { window: 6m, limit: 21, cooldown: 16m }
            account: { window: 11m, limit: 11, cooldown: 31m }
            sourceAccount: { window: 3m, limit: 6, cooldown: 12m }
          activation:
            route: { window: 4m, limit: 12 }
            source: { window: 13m, limit: 16, cooldown: 32m }
            subject: { window: 33m, limit: 7, cooldown: 61m }
            sourceSubject: { window: 14m, limit: 4, cooldown: 34m }
          passwordReset:
            route: { window: 5m, limit: 13 }
            source: { window: 15m, limit: 17, cooldown: 35m }
            subject: { window: 36m, limit: 8, cooldown: 62m }
            sourceSubject: { window: 16m, limit: 9, cooldown: 37m }
    asserts:
      - equal:
          path: data.COMPARTMENT_ROLLBACK_RETENTION_LIMIT
          value: '17'
