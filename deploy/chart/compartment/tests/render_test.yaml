  - it: renders persistent edge snapshot storage when enabled
    set:
      platform:
        startupStage: full
        installationId: test-install
        baseDomain: apps.example.com
        publicProtocol: https
      edge:
        replicas: 1
        snapshots:
          enabled: true
      secrets: *stableSecrets
    asserts:
      - notFailedTemplate: {}
      - containsDocument:
          apiVersion: v1
          kind: PersistentVolumeClaim
          name: compartment-edge-snapshots
          any: true
        template: pvc.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: snapshots
            persistentVolumeClaim:
              claimName: compartment-edge-snapshots
          any: true
        template: edge.yaml
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: snapshots
            mountPath: /var/lib/compartment/snapshots
          any: true
        template: edge.yaml
        documentIndex: 1

  - it: wires managed DNS and registry IP TLS state without Caddy certificate mounts
    set:
      platform: &managedPlatform
        startupStage: full
        installationId: test-managed
        domainMode: managed
        baseDomain: managed.compartment.run
        publicProtocol: https
        tlsMode: broker-dns01
        acmeEmail: admin@example.com
      registry:
        hostname: 10.43.250.250
        issuerRef:
          group: cert-manager.io
          kind: Issuer
          name: compartment-platform
      secrets:
        <<: *stableSecrets
        managedDomainAcmeDnsToken: broker-token
    asserts:
      - notFailedTemplate: {}
      - equal:
          path: data.COMPARTMENT_TLS_MODE
          value: broker-dns01
        template: configmap.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: COMPARTMENT_TLS_ISSUER_KIND
            value: Issuer
        template: worker.yaml
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: COMPARTMENT_TLS_ISSUER_NAME
            value: compartment-custom-domains
        template: worker.yaml
        documentIndex: 0
      - hasDocuments:
          count: 3
        template: registry-auth.yaml
      - equal:
          path: spec.template.spec.volumes[1].secret.secretName
          value: compartment-registry-tls
        template: registry-auth.yaml
        documentIndex: 2
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: active-tls
          any: true
        template: api.yaml
        documentIndex: 1

