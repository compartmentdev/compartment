# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/v1.1.1/schema/helm-testsuite.json
suite: chart render scenarios
templates:
  - templates/*.yaml
values:
  - registry-values.yaml
release:
  name: compartment
  namespace: default
tests:
  - it: uses normalized platform names for the default release
    set:
      platform:
        startupStage: full
        installationId: test-install
        baseDomain: apps.example.com
      secrets: &normalizedSecrets
        installToken: test-install-token
        postgresPassword: test-postgres-password
        registryCredentialSigningKey: test-registry-signing-key-with-at-least-32-characters
        edgeToken: test-edge-token
        productLogIngestToken: test-product-log-token
        runtimeControlToken: test-runtime-control-token
        sessionSecret: test-session-secret
        systemToken: test-system-token
        tenantSecretsKek: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        variablesMasterKey: test-variables-master-key
        managedDomainAcmeDnsToken: ''
    asserts:
      - containsDocument:
          apiVersion: apps/v1
          kind: Deployment
          name: compartment-api
          any: true
        template: api.yaml
      - containsDocument:
          apiVersion: apps/v1
          kind: Deployment
          name: compartment-postgres
          any: true
        template: postgres.yaml
      - containsDocument:
          apiVersion: v1
          kind: Namespace
          name: compartment-build
          any: true
        template: buildkit.yaml
      - containsDocument:
          apiVersion: v1
          kind: Namespace
          name: compartment-observability
          any: true
        template: product-log-agent.yaml
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests: { cpu: 50m, memory: 256Mi, ephemeral-storage: 320Mi }
            limits: { cpu: '1', memory: 256Mi, ephemeral-storage: 384Mi }
        template: product-log-agent.yaml
        documentIndex: 4
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: 500m, memory: 256Mi }
        template: registry-auth.yaml
        documentIndex: 2
      - containsDocument:
          apiVersion: v1
          kind: Namespace
          name: compartment-project-provisioning
          any: true
        template: project-provisioner-rbac.yaml

      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: COMPARTMENT_DEPLOYMENT_INFRASTRUCTURE_TIMEOUT_MS
            value: '600000'
          any: true
        template: worker.yaml
      - equal:
          path: data.COMPARTMENT_PROJECT_CONTAINER_DEFAULTS
          value: '{"limit":{"cpu":"1","memory":"512Mi"},"request":{"cpu":"50m","memory":"512Mi"}}'
        template: configmap.yaml
      - equal:
          path: data.COMPARTMENT_PROJECT_QUOTA
          value: '{"limitsCpu":"8","limitsMemory":"8Gi","requestsCpu":"2","requestsMemory":"8Gi","requestsStorage":"20Gi"}'
        template: configmap.yaml
      - equal:
          path: data.COMPARTMENT_ORGANIZATION_QUOTA
          value: '{"limitsCpu":"8","limitsMemory":"8Gi","requestsCpu":"2","requestsMemory":"8Gi","requestsStorage":"20Gi"}'
        template: configmap.yaml

  - it: normalizes a Mi BuildKit data limit for the exact gVisor admission contract
    set:
      platform:
        startupStage: full
        installationId: test-buildkit-mi-limit
        baseDomain: apps.example.com
      secrets: *normalizedSecrets
      buildkit:
        dataSizeLimit: 2048Mi
      resources:
        buildkit:
          requests: { cpu: 250m, memory: 3Gi }
          limits: { cpu: 1750m, memory: 3Gi }
    asserts:
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "buildkit-data.options'\\] == 'rw,rprivate,size=2048m'"
        template: buildkit.yaml
        documentIndex: 4

  - it: configures the service Deployment infrastructure timeout for the worker
    set:
      platform:
        startupStage: full
        installationId: test-worker-timeout
        baseDomain: apps.example.com
      worker:
        deploymentInfrastructureTimeoutMs: 123456
      secrets: *normalizedSecrets
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: COMPARTMENT_DEPLOYMENT_INFRASTRUCTURE_TIMEOUT_MS
            value: '123456'
          any: true
        template: worker.yaml

  - it: retains coherent control-plane state across uninstall
    set:
      platform:
        startupStage: full
        installationId: test-install
        baseDomain: apps.example.com
      edge:
        replicas: 1
        snapshots:
          enabled: true
      api:
        replicas: 1
      secrets: *normalizedSecrets
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
        template: secret.yaml
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
        template: pvc.yaml
        documentIndex: 0
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
        template: pvc.yaml
        documentIndex: 1
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
        template: pvc.yaml
        documentIndex: 2
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
        template: pvc.yaml
        documentIndex: 3

  - it: creates a revision-scoped migration Job for every Helm update
    release:
      revision: 7
    set:
      platform:
        startupStage: full
        installationId: test-installation
      secrets:
        installToken: test-install-token
        postgresPassword: test-postgres-password
        registryCredentialSigningKey: test-registry-signing-key-with-at-least-32-characters
        edgeToken: test-edge-token
        productLogIngestToken: test-product-log-token
        runtimeControlToken: test-runtime-control-token
        sessionSecret: test-session-secret
        systemToken: test-system-token
        tenantSecretsKek: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        variablesMasterKey: test-variables-master-key
        managedDomainAcmeDnsToken: ''
    asserts:
      - equal:
          path: metadata.name
          value: compartment-api-migrate-7
        template: api-migrate.yaml
      - equal:
          path: spec.template.spec.containers[0].command
          value: ['node', 'dist/db/migrate.js']
        template: api-migrate.yaml
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests: { cpu: 50m, memory: 512Mi }
            limits: { cpu: 500m, memory: 512Mi }
        template: api-migrate.yaml
  - it: renders only foundation resources during the foundation stage
    set:
      platform:
        startupStage: foundation
      secrets: &stableSecrets
        installToken: test-install-token
        postgresPassword: test-postgres-password
        registryCredentialSigningKey: test-registry-signing-key-with-at-least-32-characters
        edgeToken: test-edge-token
        productLogIngestToken: test-product-log-token
        runtimeControlToken: test-runtime-control-token
        sessionSecret: test-session-secret
        systemToken: test-system-token
        tenantSecretsKek: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        variablesMasterKey: test-variables-master-key
        managedDomainAcmeDnsToken: ''
    asserts:
      - notFailedTemplate: {}
      - hasDocuments:
          count: 1
        template: install-state-secret.yaml
      - isKind:
          of: Secret
        template: install-state-secret.yaml
      - hasDocuments:
          count: 1
        template: secret.yaml
      - isKind:
          of: Secret
        template: secret.yaml
      - hasDocuments:
          count: 1
        template: configmap.yaml
      - isKind:
          of: ConfigMap
        template: configmap.yaml
      - equal:
          path: data.COMPARTMENT_MAX_CONCURRENT_BUILDS
          value: '100'
        template: configmap.yaml
      - equal:
          path: data.COMPARTMENT_NEW_PROJECTS_PRIVATE_BY_DEFAULT
          value: 'true'
        template: configmap.yaml
      - equal:
          path: data.COMPARTMENT_MAX_CONCURRENT_BUILDS_PER_ORGANIZATION
          value: '2'
        template: configmap.yaml
      - equal:
          path: data.COMPARTMENT_BUILDKIT_RESOURCES
          value: '{"limits":{"cpu":"4","memory":"5Gi"},"requests":{"cpu":"2","memory":"5Gi"}}'
        template: configmap.yaml
      - equal:
          path: data.COMPARTMENT_PROJECT_CONTAINER_DEFAULTS
          value: '{"limit":{"cpu":"1","memory":"512Mi"},"request":{"cpu":"50m","memory":"512Mi"}}'
        template: configmap.yaml
      - equal:
          path: data.COMPARTMENT_PROJECT_QUOTA
          value: '{"limitsCpu":"8","limitsMemory":"8Gi","requestsCpu":"2","requestsMemory":"8Gi","requestsStorage":"20Gi"}'
        template: configmap.yaml
      - equal:
          path: data.COMPARTMENT_ORGANIZATION_QUOTA
          value: '{"limitsCpu":"8","limitsMemory":"8Gi","requestsCpu":"2","requestsMemory":"8Gi","requestsStorage":"20Gi"}'
        template: configmap.yaml
      - equal:
          path: data.COMPARTMENT_BUILD_RUNNER_RESOURCES
          value: '{"limits":{"cpu":"250m","memory":"1Gi"},"requests":{"cpu":"100m","memory":"1Gi"}}'
        template: configmap.yaml
      - equal:
          path: data.COMPARTMENT_BUILDKIT_DATA_SIZE_LIMIT
          value: '4Gi'
        template: configmap.yaml
      - equal:
          path: data.COMPARTMENT_BUILDKIT_GC_KEEP_STORAGE_MB
          value: '3072'
        template: configmap.yaml
      - hasDocuments:
          count: 2
        template: pvc.yaml

      - isKind:
          of: PersistentVolumeClaim
        template: pvc.yaml
      - hasDocuments:
          count: 1
        template: caddy.yaml
      - isKind:
          of: Service
        template: caddy.yaml
        documentIndex: 0
      - hasDocuments:
          count: 2
        template: postgres.yaml
      - isKind:
          of: Service
        template: postgres.yaml
        documentIndex: 0
      - isKind:
          of: Deployment
        template: postgres.yaml
        documentIndex: 1
      - hasDocuments:
          count: 2
        template: registry.yaml
      - isKind:
          of: Service
        template: registry.yaml
        documentIndex: 0
      - isKind:
          of: Deployment
        template: registry.yaml
        documentIndex: 1
      - hasDocuments:
          count: 0
        template: api.yaml
      - hasDocuments:
          count: 0
        template: worker.yaml
      - hasDocuments:
          count: 0
        template: edge.yaml
      - hasDocuments:
          count: 0
        template: buildkit.yaml
      - hasDocuments:
          count: 0
        template: api-migrate.yaml
      - hasDocuments:
          count: 0
        template: api-migrate-rbac.yaml
      - hasDocuments:
          count: 0
        template: buildkit-network-policy.yaml
      - hasDocuments:
          count: 0
        template: project-provisioner.yaml
      - hasDocuments:
          count: 0
        template: project-provisioner-rbac.yaml
      - hasDocuments:
          count: 1
        template: registry-auth.yaml
      - isKind:
          of: Service
        template: registry-auth.yaml
      - hasDocuments:
          count: 0
        template: registry-network-policy.yaml
      - hasDocuments:
          count: 0
        template: product-log-agent.yaml

  - it: propagates tenant resource overrides to worker and project-provisioner
    set:
      platform:
        startupStage: full
        installationId: test-resource-overrides
        baseDomain: apps.example.com
      resources:
        projectContainerDefaults:
          request: { cpu: +75m, memory: +384Mi }
          limit: { cpu: 750m, memory: 384Mi }
        projectQuota:
          requestsCpu: '3'
          requestsMemory: 3Gi
          limitsCpu: '12'
          limitsMemory: 12Gi
          requestsStorage: 30Gi
        organizationQuota:
          requestsCpu: '4'
          requestsMemory: 4Gi
          limitsCpu: '16'
          limitsMemory: 16Gi
          requestsStorage: 40Gi
      secrets: *normalizedSecrets
    asserts:
      - equal:
          path: data.COMPARTMENT_PROJECT_CONTAINER_DEFAULTS
          value: '{"limit":{"cpu":"750m","memory":"384Mi"},"request":{"cpu":"+75m","memory":"+384Mi"}}'
        template: configmap.yaml
      - equal:
          path: data.COMPARTMENT_PROJECT_QUOTA
          value: '{"limitsCpu":"12","limitsMemory":"12Gi","requestsCpu":"3","requestsMemory":"3Gi","requestsStorage":"30Gi"}'
        template: configmap.yaml
      - equal:
          path: data.COMPARTMENT_ORGANIZATION_QUOTA
          value: '{"limitsCpu":"16","limitsMemory":"16Gi","requestsCpu":"4","requestsMemory":"4Gi","requestsStorage":"40Gi"}'
        template: configmap.yaml
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].configMapRef.name
          value: compartment
        template: worker.yaml
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].configMapRef.name
          value: compartment
        template: project-provisioner.yaml

  - it: projects the public new-project hosted-route default
    set:
      platform:
        startupStage: full
        installationId: test-public-project-default
        baseDomain: apps.example.com
        newProjectsPrivateByDefault: false
      secrets: *normalizedSecrets
    asserts:
      - equal:
          path: data.COMPARTMENT_NEW_PROJECTS_PRIVATE_BY_DEFAULT
          value: 'false'
        template: configmap.yaml

  - it: pins default third-party runtime images by digest
    set:
      platform:
        startupStage: full
        installationId: test-third-party-digests
        baseDomain: compartment.localhost
        publicProtocol: http
        tlsMode: issuer
      secrets: *stableSecrets
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^postgres@sha256:[a-f0-9]{64}$'
        template: postgres.yaml
        documentIndex: 1
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^registry@sha256:[a-f0-9]{64}$'
        template: registry.yaml
        documentIndex: 1
      - matchRegex:
          path: spec.template.spec.initContainers[0].image
          pattern: '^registry.k8s.io/kubectl@sha256:[a-f0-9]{64}$'
        template: api.yaml
        documentIndex: 1
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^timberio/vector@sha256:[a-f0-9]{64}$'
        template: product-log-agent.yaml
        documentIndex: 4

  - it: renders an operator-domain installation with the derived private registry address
    set:
      registry:
        clusterIP: 10.43.250.250
        hostname: 10.43.250.250
        issuerRef:
          name: platform-issuer
      platform:
        startupStage: full
        installationId: test-install
        baseDomain: apps.example.com
        publicProtocol: https
        managedDomainBrokerUrl: ''
      secrets: *stableSecrets
    asserts:
      - notFailedTemplate: {}
      - equal:
          path: data.COMPARTMENT_API_INTERNAL_HOST
          value: compartment-api.default.svc
        template: configmap.yaml
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
        template: registry-auth.yaml
        documentIndex: 0
      - equal:
          path: metadata.annotations["meta.helm.sh/release-name"]
          value: compartment
        template: registry-auth.yaml
        documentIndex: 0
      - equal:
          path: metadata.annotations["meta.helm.sh/release-namespace"]
          value: default
        template: registry-auth.yaml
        documentIndex: 0
      - equal:
          path: spec.clusterIP
          value: 10.43.250.250
        template: registry-auth.yaml
        documentIndex: 0
      - equal:
          path: spec.ports[0].port
          value: 443
        template: registry-auth.yaml
        documentIndex: 0
      - equal:
          path: spec.ipAddresses[0]
          value: 10.43.250.250
        template: registry-auth.yaml
        documentIndex: 1
      - equal:
          path: spec.issuerRef.name
          value: platform-issuer
        template: registry-auth.yaml
        documentIndex: 1
      - equal:
          path: spec.rules[0].host
          value: console.apps.example.com
        template: ingress.yaml
      - equal:
          path: spec.rules[1].host
          value: '*.apps.example.com'
        template: ingress.yaml
      - notContains:
          path: spec.rules
          content:
            host: registry.apps.example.com
          template: ingress.yaml
      - containsDocument:
          apiVersion: apps/v1
          kind: Deployment
          name: compartment-api
          any: true
        template: api.yaml
      - containsDocument:
          apiVersion: apps/v1
          kind: Deployment
          name: compartment-worker
          any: true
        template: worker.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: COMPARTMENT_EDGE_NAMESPACE
            value: default
        template: worker.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: COMPARTMENT_KUBE_POD_CIDR
            value: 10.42.0.0/16
        template: worker.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: COMPARTMENT_KUBE_SERVICE_CIDR
            value: 10.43.0.0/16
        template: worker.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: COMPARTMENT_CADDY_SERVICE_NAME
            value: compartment-caddy
        template: worker.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: COMPARTMENT_INGRESS_CLASS_NAME
            value: traefik
        template: worker.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: COMPARTMENT_TLS_ISSUER_NAME
            value: compartment-platform
        template: worker.yaml
      - containsDocument:
          apiVersion: apps/v1
          kind: Deployment
          name: compartment-edge
          any: true
        template: edge.yaml
      - containsDocument:
          apiVersion: apps/v1
          kind: Deployment
          name: compartment-caddy
          any: true
        template: caddy.yaml
      - hasDocuments:
          count: 6
        template: api-migrate-rbac.yaml
      - isKind:
          of: ServiceAccount
        template: api-migrate-rbac.yaml
        documentIndex: 0
      - equal:
          path: metadata.name
          value: compartment-waiter
        template: api-migrate-rbac.yaml
        documentIndex: 0
      - isKind:
          of: RoleBinding
        template: api-migrate-rbac.yaml
        documentIndex: 3
      - isKind:
          of: Role
        template: api-migrate-rbac.yaml
        documentIndex: 4
      - equal:
          path: metadata.name
          value: compartment-custom-domain-controller
        template: api-migrate-rbac.yaml
        documentIndex: 4
      - isKind:
          of: RoleBinding
        template: api-migrate-rbac.yaml
        documentIndex: 5
      - equal:
          path: subjects[0].name
          value: compartment-worker
        template: api-migrate-rbac.yaml
        documentIndex: 5
      - contains:
          path: rules
          content:
            apiGroups:
              - networking.k8s.io
            resources:
              - ingresses
            verbs:
              - get
              - create
              - update
              - patch
              - delete
        template: api-migrate-rbac.yaml
        documentIndex: 4
      - hasDocuments:
          count: 5
        template: product-log-agent.yaml
      - isKind:
          of: Namespace
        template: product-log-agent.yaml
        documentIndex: 0
      - isKind:
          of: DaemonSet
        template: product-log-agent.yaml
        documentIndex: 4
      - equal:
          path: metadata.name
          value: compartment-log-agent
        template: product-log-agent.yaml
        documentIndex: 4
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - --config
            - /etc/vector/vector.yaml
            - --watch-config
            - --watch-config-method
            - poll
            - --watch-config-poll-interval-seconds
            - '1'
        template: product-log-agent.yaml
        documentIndex: 4
      - equal:
          path: spec.template.spec.volumes[2].hostPath.path
          value: /var/lib/compartment/compartment-log-agent
        template: product-log-agent.yaml
        documentIndex: 4
      - equal:
          path: spec.template.spec.containers[0].resources.limits["ephemeral-storage"]
          value: 384Mi
        template: product-log-agent.yaml
        documentIndex: 4
      - matchRegex:
          path: data["vector.yaml"]
          pattern: 'uri: \$\{COMPARTMENT_LOG_INGEST_URL\}'
        template: product-log-agent.yaml
        documentIndex: 1
      - hasDocuments:
          count: 6
        template: buildkit.yaml
      - isKind:
          of: Namespace
        template: buildkit.yaml
        documentIndex: 0
      - equal:
          path: metadata.labels["pod-security.kubernetes.io/enforce"]
          value: privileged
        template: buildkit.yaml
        documentIndex: 0
      - equal:
          path: metadata.name
          value: compartment-build
        template: buildkit.yaml
        documentIndex: 0
      - isKind:
          of: ResourceQuota
        template: buildkit.yaml
        documentIndex: 1
      - equal:
          path: metadata.namespace
          value: compartment-build
        template: buildkit.yaml
        documentIndex: 1
      - equal:
          path: spec.hard
          value:
            limits.cpu: '48'
            limits.memory: 64Gi
        template: buildkit.yaml
        documentIndex: 1
      - isKind:
          of: RoleBinding
        template: buildkit.yaml
        documentIndex: 3
      - equal:
          path: metadata.namespace
          value: compartment-build
        template: buildkit.yaml
        documentIndex: 3
      - isKind:
          of: ValidatingAdmissionPolicy
        template: buildkit.yaml
        documentIndex: 4
      - equal:
          path: spec.failurePolicy
          value: Fail
        template: buildkit.yaml
        documentIndex: 4
      - matchRegex:
          path: spec.validations[0].expression
          pattern: "runtimeClassName == 'gvisor-build'"
        template: buildkit.yaml
        documentIndex: 4
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "'compartment.dev/secret-checksum' in"
        template: buildkit.yaml
        documentIndex: 4
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "all\\(key, key == 'compartment.dev/secret-checksum' \\|\\| key in"
        template: buildkit.yaml
        documentIndex: 4
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "buildkit-data.options'\\] == 'rw,rprivate,size=4g'.*buildkit-run.options'\\] == 'rw,rprivate,size=128m'.*buildkit-tmp.options'\\] == 'rw,rprivate,size=512m'.*tmp.options'\\] == 'rw,rprivate,size=384m'"
        template: buildkit.yaml
        documentIndex: 4
      - matchRegex:
          path: spec.validations[6].expression
          pattern: "volume.name == 'buildkit-data' && quantity\\(volume.emptyDir.sizeLimit\\).compareTo\\(quantity\\('4Gi'\\)\\) == 0"
        template: buildkit.yaml
        documentIndex: 4
      - matchRegex:
          path: spec.validations[5].expression
          pattern: "volume.name == 'buildkit-seed'.*volume.image.reference == 'ghcr.io/compartmentdev/compartment-buildkit-seed:latest'.*volume.image.pullPolicy == 'IfNotPresent'"
        template: buildkit.yaml
        documentIndex: 4
      - matchRegex:
          path: spec.validations[7].expression
          pattern: "volume.name == 'buildkit-run' && quantity\\(volume.emptyDir.sizeLimit\\).compareTo\\(quantity\\('128Mi'\\)\\) == 0"
        template: buildkit.yaml
        documentIndex: 4
      - matchRegex:
          path: spec.validations[8].expression
          pattern: "volume.name == 'buildkit-tmp' && quantity\\(volume.emptyDir.sizeLimit\\).compareTo\\(quantity\\('512Mi'\\)\\) == 0"
        template: buildkit.yaml
        documentIndex: 4
      - matchRegex:
          path: spec.validations[9].expression
          pattern: "volume.name == 'tmp' && quantity\\(volume.emptyDir.sizeLimit\\).compareTo\\(quantity\\('384Mi'\\)\\) == 0"
        template: buildkit.yaml
        documentIndex: 4
      - matchRegex:
          path: spec.validations[10].expression
          pattern: "container.image == 'ghcr.io/compartmentdev/compartment-worker:latest'.*container.command == \\['node', 'dist/build-job.js'\\].*!has\\(container.ports\\).*!has\\(container.securityContext.procMount\\).*!has\\(container.securityContext.appArmorProfile\\)"
        template: buildkit.yaml
        documentIndex: 4
      - matchRegex:
          path: spec.validations[11].expression
          pattern: "!has\\(container.envFrom\\).*container.env.all\\(env, env.name in \\['BUILDKIT_ADDR', 'COMPARTMENT_BUILD_JOB_INPUT', 'COMPARTMENT_BUILD_JOB_SOURCE_ARCHIVE_CREDENTIAL', 'COMPARTMENT_RAILPACK_BUILDER_IMAGE', 'COMPARTMENT_RAILPACK_RUNTIME_IMAGE', 'TMPDIR'\\] && !has\\(env.value\\) && has\\(env.valueFrom\\) && has\\(env.valueFrom.secretKeyRef\\)\\)"
        template: buildkit.yaml
        documentIndex: 4
