# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/v1.1.1/schema/helm-testsuite.json
suite: platform TLS ownership
templates:
  - templates/ingress.yaml
  - templates/managed-domain-dns01.yaml
  - templates/platform-certificates.yaml
release:
  name: compartment
  namespace: platform
tests:
  - it: references an operator Issuer without creating a ClusterIssuer
    set:
      platform:
        startupStage: full
        publicProtocol: https
        domainMode: custom
        baseDomain: apps.example.com
        tlsMode: issuer
      tls:
        issuerRef:
          name: customer-platform
          kind: ClusterIssuer
    asserts:
      - hasDocuments:
          count: 0
        template: managed-domain-dns01.yaml
      - hasDocuments:
          count: 2
        template: platform-certificates.yaml
      - isKind:
          of: Certificate
        template: platform-certificates.yaml
        documentIndex: 0
      - equal:
          path: spec.issuerRef
          value:
            name: customer-platform
            kind: ClusterIssuer
        template: platform-certificates.yaml
        documentIndex: 0

  - it: references an operator TLS Secret without creating Certificates or issuers
    set:
      platform:
        startupStage: full
        publicProtocol: https
        domainMode: custom
        baseDomain: apps.example.com
      tls:
        existingSecret: operator-platform-tls
    asserts:
      - hasDocuments:
          count: 0
        template: managed-domain-dns01.yaml
      - hasDocuments:
          count: 0
        template: platform-certificates.yaml
      - equal:
          path: spec.tls[0].secretName
          value: operator-platform-tls
        template: ingress.yaml
      - equal:
          path: spec.tls[1].secretName
          value: operator-platform-tls
        template: ingress.yaml

  - it: uses one wildcard Certificate for managed platform and default registry hosts
    set:
      platform:
        startupStage: full
        installationId: managed-install
        publicProtocol: https
        domainMode: managed
        baseDomain: managed.example.com
        acmeEmail: admin@example.com
      secrets:
        managedDomainAcmeDnsToken: acme-dns-token
      nodePools:
        system:
          nodeSelector: { compartment.dev/node-pool: system }
          tolerations:
            - { key: compartment.dev/node-pool, operator: Exists, effect: NoSchedule }
    asserts:
      - hasDocuments:
          count: 1
        template: platform-certificates.yaml
      - isKind:
          of: Issuer
        template: managed-domain-dns01.yaml
        documentIndex: 14
      - equal:
          path: spec.dnsNames[0]
          value: '*.managed.example.com'
        template: platform-certificates.yaml
        documentIndex: 0
      - equal:
          path: spec.tls[0].secretName
          value: compartment-compartment-wildcard-tls
        template: ingress.yaml
      - equal:
          path: spec.tls[1].secretName
          value: compartment-compartment-wildcard-tls
        template: ingress.yaml
      - equal:
          path: spec.group
          value: compartment-compartment.platform.dns01.compartment.dev
        template: managed-domain-dns01.yaml
        documentIndex: 13
      - equal:
          path: spec.acme.solvers[0].dns01.webhook.groupName
          value: compartment-compartment.platform.dns01.compartment.dev
        template: managed-domain-dns01.yaml
        documentIndex: 14
      - equal:
          path: spec.acme.solvers[0].dns01.webhook.config
          value: {}
        template: managed-domain-dns01.yaml
        documentIndex: 14
      - equal:
          path: metadata.name
          value: compartment-compartment-custom-domains
        template: managed-domain-dns01.yaml
        documentIndex: 15
      - equal:
          path: spec.acme.solvers[0].http01.ingress.ingressClassName
          value: traefik
        template: managed-domain-dns01.yaml
        documentIndex: 15
      - equal:
          path: spec.template.spec.priorityClassName
          value: compartment-platform
        template: managed-domain-dns01.yaml
        documentIndex: 11
      - equal:
          path: spec.template.spec.nodeSelector
          value: { compartment.dev/node-pool: system }
        template: managed-domain-dns01.yaml
        documentIndex: 11
      - equal:
          path: spec.template.spec.tolerations
          value:
            - { key: compartment.dev/node-pool, operator: Exists, effect: NoSchedule }
        template: managed-domain-dns01.yaml
        documentIndex: 11
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BROKER_URL
            value: https://broker.compartment.run
        template: managed-domain-dns01.yaml
        documentIndex: 11
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TOKEN_SECRET_KEY
            value: managed-domain-acme-dns-token
        template: managed-domain-dns01.yaml
        documentIndex: 11
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TOKEN_SECRET_NAMESPACE
            value: platform
        template: managed-domain-dns01.yaml
        documentIndex: 11
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TOKEN_SECRET_NAME
            value: compartment-install-state
        template: managed-domain-dns01.yaml
        documentIndex: 11

  - it: reuses an existing wildcard Secret throughout managed mode
    set:
      platform:
        startupStage: full
        installationId: managed-existing-tls
        publicProtocol: https
        domainMode: managed
        baseDomain: managed.example.com
        acmeEmail: admin@example.com
      tls:
        existingSecret: managed-wildcard-tls
      registry:
        hostname: registry.managed.example.com
        issuerRef:
          group: cert-manager.io
          kind: Issuer
          name: compartment-platform
      secrets:
        managedDomainAcmeDnsToken: acme-dns-token
    asserts:
      - hasDocuments:
          count: 0
        template: platform-certificates.yaml
      - equal:
          path: spec.tls[0].secretName
          value: managed-wildcard-tls
        template: ingress.yaml
      - equal:
          path: spec.tls[1].secretName
          value: managed-wildcard-tls
        template: ingress.yaml
