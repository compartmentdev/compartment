# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/v1.1.1/schema/helm-testsuite.json
suite: install value validation
templates:
  - templates/configmap.yaml
values:
  - registry-values.yaml
release:
  name: compartment
tests:
  - it: rejects a BuildKit data size above the exact arithmetic range
    set:
      buildkit.dataSizeLimit: 8192Ti
    asserts:
      - failedTemplate:
          errorPattern: buildkit.dataSizeLimit.*pattern

  - it: rejects a zero BuildKit data size
    set:
      buildkit.dataSizeLimit: 0Gi
    asserts:
      - failedTemplate:
          errorPattern: buildkit.dataSizeLimit.*pattern

  - it: rejects a BuildKit data size that gVisor cannot parse
    set:
      buildkit.dataSizeLimit: 2G
    asserts:
      - failedTemplate:
          errorPattern: buildkit.dataSizeLimit.*pattern

  - it: rejects a sub-page BuildKit data size
    set:
      buildkit.dataSizeLimit: 1Ki
    asserts:
      - failedTemplate:
          errorPattern: buildkit.dataSizeLimit.*pattern

  - it: rejects malformed enabled Docker Hub cache storage
    set:
      dockerHubCache.enabled: true
      storage.dockerHubCache: unbounded
    asserts:
      - failedTemplate:
          errorPattern: storage/dockerHubCache.*pattern

  - it: rejects a malformed Docker Hub credential Secret name
    set:
      dockerHubCache.enabled: true
      dockerHubCache.credentials.existingSecret: Invalid_Secret
    asserts:
      - failedTemplate:
          errorPattern: dockerHubCache/credentials/existingSecret

  - it: rejects a Docker Hub credential Secret name longer than 253 characters
    set:
      dockerHubCache.enabled: true
      dockerHubCache.credentials.existingSecret: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb.ccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc.dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
    asserts:
      - failedTemplate:
          errorPattern: dockerHubCache/credentials/existingSecret

  - it: rejects a non-boolean new-project privacy default
    set:
      platform:
        newProjectsPrivateByDefault: invalid
    asserts:
      - failedTemplate: {}

  - it: requires a managed broker token
    set:
      platform: &managedPlatform
        startupStage: full
        installationId: test-managed
        domainMode: managed
        baseDomain: managed.compartment.run
        publicProtocol: https
        tlsMode: broker-dns01
        acmeEmail: admin@example.com
    asserts:
      - failedTemplate:
          errorMessage: secrets.managedDomainAcmeDnsToken is required for managed TLS

  - it: requires managed domain mode for managed TLS
    set:
      platform:
        <<: *managedPlatform
        domainMode: custom
      secrets:
        managedDomainAcmeDnsToken: broker-token
    asserts:
      - failedTemplate:
          errorMessage: platform.domainMode must be managed when platform.tlsMode is broker-dns01

  - it: rejects a ClusterIssuer reference for managed TLS
    set:
      platform:
        <<: *managedPlatform
      secrets:
        managedDomainAcmeDnsToken: broker-token
      tls:
        issuerRef:
          name: customer-wide
          kind: ClusterIssuer
    asserts:
      - failedTemplate:
          errorPattern: tls.issuerRef.kind.*Issuer

  - it: requires a managed broker URL
    set:
      platform:
        <<: *managedPlatform
        managedDomainBrokerUrl: ''
      secrets:
        managedDomainAcmeDnsToken: broker-token
    asserts:
      - failedTemplate:
          errorMessage: platform.managedDomainBrokerUrl is required when secrets.managedDomainAcmeDnsToken is configured

  - it: requires the canonical broker URL when a broker token is configured
    set:
      platform:
        startupStage: full
        installationId: test-custom-broker
        baseDomain: compartment.localhost
        publicProtocol: http
        tlsMode: issuer
        managedDomainBrokerUrl: ''
      secrets:
        managedDomainAcmeDnsToken: retained-token
    asserts:
      - failedTemplate:
          errorMessage: platform.managedDomainBrokerUrl is required when secrets.managedDomainAcmeDnsToken is configured

  - it: rejects an endpoint type that does not match its value
    set:
      ingress:
        endpoint:
          type: A
          value: ingress.example.com
    asserts:
      - failedTemplate:
          errorPattern: ingress.endpoint.value.*ipv4

  - it: rejects removed public Caddy Service options
    set:
      service:
        caddy:
          type: LoadBalancer
    asserts:
      - failedTemplate:
          errorPattern: "at '': additional properties 'service' not allowed"

  - it: rejects the removed Caddy HTTPS port
    set:
      ports:
        https: 8443
    asserts:
      - failedTemplate:
          errorPattern: ports.*additional properties.*https

  - it: rejects the removed Caddy ACME issuer value
    set:
      platform:
        acmeIssuer: acme
    asserts:
      - failedTemplate:
          errorPattern: "at '/platform': additional properties 'acmeIssuer' not allowed"

  - it: rejects the removed Caddy ACME CA URL value
    set:
      platform:
        acmeCaUrl: https://acme.example.com/directory
    asserts:
      - failedTemplate:
          errorPattern: "at '/platform': additional properties 'acmeCaUrl' not allowed"

  - it: rejects a malformed broker URL through the values schema
    set:
      platform:
        managedDomainBrokerUrl: not-a-url
    asserts:
      - failedTemplate:
          errorPattern: managedDomainBrokerUrl.*oneOf

  - it: rejects a malformed ACME email through the values schema
    set:
      platform:
        acmeEmail: not-an-email
    asserts:
      - failedTemplate:
          errorPattern: acmeEmail.*oneOf

  - it: rejects a non-positive rollback retention limit through the values schema
    set:
      platform:
        rollbackRetentionLimit: 0
    asserts:
      - failedTemplate:
          errorPattern: rollbackRetentionLimit.*oneOf

  - it: rejects a non-positive service Deployment infrastructure timeout through the values schema
    set:
      worker:
        deploymentInfrastructureTimeoutMs: 0
    asserts:
      - failedTemplate:
          errorPattern: deploymentInfrastructureTimeoutMs.*minimum

  - it: rejects a non-positive auth throttle limit through the values schema
    set:
      platform:
        authThrottle:
          login:
            route:
              limit: 0
    asserts:
      - failedTemplate:
          errorPattern: authThrottle.login.route.limit.*minimum

  - it: rejects an empty auth throttle duration through the values schema
    set:
      platform:
        authThrottle:
          login:
            source:
              cooldown: ''
    asserts:
      - failedTemplate:
          errorPattern: authThrottle.login.source.cooldown.*minLength

  - it: rejects an unknown auth throttle field through the values schema
    set:
      platform:
        authThrottle:
          login:
            route:
              maxRequests: 30
    asserts:
      - failedTemplate:
          errorPattern: authThrottle/login/route.*additional properties

  - it: rejects a mutable platform image digest through the values schema
    set:
      images:
        api:
          digest: sha256:not-a-digest
    asserts:
      - failedTemplate:
          errorPattern: images.api.digest.*pattern

  - it: rejects a malformed build CPU quota through the values schema
    set:
      buildkit:
        resourceQuota:
          limits:
            cpu: forty-eight
    asserts:
      - failedTemplate:
          errorPattern: buildkit.resourceQuota.limits.cpu.*pattern

  - it: accepts an exabyte build CPU quota through the values schema
    set:
      buildkit:
        resourceQuota:
          limits:
            cpu: '1E'
    asserts:
      - hasDocuments:
          count: 1

  - it: rejects an uppercase kilo build CPU quota through the values schema
    set:
      buildkit:
        resourceQuota:
          limits:
            cpu: '1K'
    asserts:
      - failedTemplate:
          errorPattern: buildkit.resourceQuota.limits.cpu.*pattern

  - it: rejects a malformed build memory quota through the values schema
    set:
      buildkit:
        resourceQuota:
          limits:
            memory: 64-gibibytes
    asserts:
      - failedTemplate:
          errorPattern: buildkit.resourceQuota.limits.memory.*pattern

  - it: rejects a malformed build container memory limit through the values schema
    set:
      resources:
        buildkit:
          limits:
            cpu: 1750m
            memory: three-gibibytes
    asserts:
      - failedTemplate:
          errorPattern: resources.buildkit.limits.memory.*pattern

  - it: rejects a malformed build runner memory limit through the values schema
    set:
      resources:
        buildRunner:
          limits:
            memory: 1-gibibyte
    asserts:
      - failedTemplate:
          errorPattern: resources.buildRunner.limits.memory.*pattern

  - it: rejects malformed project ephemeral-storage values through the split schema
    set:
      resources:
        projectQuota:
          limitsEphemeralStorage: eight-gibibytes
    asserts:
      - failedTemplate:
          errorPattern: resources.projectQuota.limitsEphemeralStorage.*pattern

  - it: rejects an unbounded project ephemeral-storage exponent through the values schema
    set:
      resources:
        projectQuota:
          limitsEphemeralStorage: 1e999999999
    asserts:
      - failedTemplate:
          errorPattern: resources.projectQuota.limitsEphemeralStorage.*pattern

  - it: rejects a project ephemeral-storage quantity above the worker arithmetic range
    set:
      resources:
        projectQuota:
          limitsEphemeralStorage: '9223372036854775808'
    asserts:
      - failedTemplate:
          errorPattern: resources.projectQuota.limitsEphemeralStorage.*allOf

  - it: rejects an overflowing binary project ephemeral-storage quantity
    set:
      resources:
        projectQuota:
          limitsEphemeralStorage: 8Ei
    asserts:
      - failedTemplate:
          errorPattern: resources.projectQuota.limitsEphemeralStorage.*allOf

  - it: accepts the maximum project ephemeral-storage quantity
    set:
      resources:
        projectQuota:
          limitsEphemeralStorage: '9223372036854775807'
    asserts:
      - notFailedTemplate: {}

  - it: keeps project ephemeral storage out of organization quota
    set:
      resources:
        organizationQuota:
          limitsEphemeralStorage: 8Gi
    asserts:
      - failedTemplate:
          errorPattern: resources.organizationQuota.*additional properties

  - it: accepts a platform memory request below its limit
    set:
      resources:
        api:
          requests:
            memory: 256Mi
          limits:
            memory: 384Mi
    asserts:
      - notFailedTemplate: {}

  - it: rejects Capsule cluster-admin RBAC generation
    set:
      capsule:
        manager:
          rbac:
            create: true
            strict: false
    asserts:
      - failedTemplate:
          errorPattern: capsule/manager/rbac/create.*value must be false

  - it: rejects enabling the write-capable Capsule CRD lifecycle hook
    set:
      capsule:
        crds:
          install: true
    asserts:
      - failedTemplate:
          errorPattern: capsule/crds/install.*value must be false

  - it: rejects disabling the canonical Capsule configuration
    set:
      capsule:
        manager:
          options:
            createConfiguration: false
    asserts:
      - failedTemplate:
          errorPattern: capsule/manager/options/createConfiguration.*value must be true

  - it: rejects disabling Capsule webhook certificates
    set:
      capsule:
        certManager:
          generateCertificates: false
    asserts:
      - failedTemplate:
          errorPattern: capsule/certManager/generateCertificates.*value must be true

  - it: rejects enabling an unmanaged Capsule webhook
    set:
      capsule:
        webhooks:
          hooks:
            pods:
              enabled: true
    asserts:
      - failedTemplate:
          errorPattern: capsule/webhooks/hooks/pods/enabled.*value must be false

  - it: rejects making the organization quota webhook fail open
    set:
      capsule:
        webhooks:
          hooks:
            calculations:
              failurePolicy: Ignore
    asserts:
      - failedTemplate:
          errorPattern: capsule/webhooks/hooks/calculations/failurePolicy.*value must be 'Fail'

  - it: rejects bypassing organization quota admission with a match condition
    set:
      capsule:
        webhooks:
          hooks:
            calculations:
              matchConditions:
                - name: bypass
                  expression: 'false'
    asserts:
      - failedTemplate:
          errorPattern: capsule.webhooks.hooks.calculations.matchConditions.*maxItems

  - it: rejects redirecting Capsule admission to an external service
    set:
      capsule:
        webhooks:
          service:
            url: https://attacker.example
    asserts:
      - failedTemplate:
          errorPattern: capsule/webhooks/service/url.*value must be ''

  - it: rejects arbitrary Capsule manifests
    set:
      capsule:
        extraManifests:
          - apiVersion: v1
            kind: ConfigMap
            metadata:
              name: injected
    asserts:
      - failedTemplate:
          errorPattern: capsule.extraManifests.*maxItems

  - it: rejects Capsule users outside the canonical integration
    set:
      capsule:
        manager:
          options:
            users:
              - kind: Group
                name: administrators
    asserts:
      - failedTemplate:
          errorPattern: capsule.manager.options.users.*maxItems

  - it: rejects enabling Capsule tracing and external Secret injection
    set:
      capsule:
        manager:
          options:
            tracing:
              enabled: true
              endpoint: attacker.example:4317
              basicAuth:
                existingSecret:
                  name: compartment-internal
    asserts:
      - failedTemplate:
          errorPattern: capsule.manager.options.tracing.enabled

  - it: rejects global annotations on the Capsule ServiceAccount
    set:
      capsule:
        customAnnotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/admin
    asserts:
      - failedTemplate:
          errorPattern: capsule.customAnnotations

  - it: rejects global labels that can trigger admission sidecars
    set:
      capsule:
        customLabels:
          sidecar.istio.io/inject: 'true'
    asserts:
      - failedTemplate:
          errorPattern: capsule.customLabels

  - it: rejects replacing the verified Capsule manager image
    set:
      capsule:
        manager:
          image:
            repository: example/capsule
    asserts:
      - failedTemplate:
          errorPattern: capsule/manager/image/repository.*value must be 'projectcapsule/capsule'

  - it: rejects the deprecated Capsule hook image override
    set:
      capsule:
        jobs:
          image:
            registry: docker.io
            repository: library/busybox
            tag: latest
    asserts:
      - failedTemplate:
          errorPattern: capsule.jobs.*const

  - it: rejects optional Capsule API priority and fairness resources
    set:
      capsule:
        manager:
          apiPriorityAndFairness:
            enabled: true
    asserts:
      - failedTemplate:
          errorPattern: capsule/manager/apiPriorityAndFairness/enabled.*value must be false

  - it: rejects deprecated Capsule webhook aliases
    set:
      capsule:
        webhooks:
          hooks:
            defaults:
              pods:
                enabled: true
    asserts:
      - failedTemplate:
          errorPattern: capsule.webhooks.hooks.defaults.*const
