# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/v1.1.1/schema/helm-testsuite.json
suite: Caddy ingress peer labels
templates:
  - templates/caddy.yaml
  - templates/configmap.yaml
  - templates/install-state-secret.yaml
  - templates/project-provisioner.yaml
  - templates/secret.yaml
  - templates/worker.yaml
values:
  - registry-values.yaml
release:
  name: compartment
  namespace: default
tests:
  # The tenant ingress NetworkPolicy peer the worker projects must select the Caddy Pods this chart
  # labels. Both sides render from "compartment.caddyPodLabels", and "compartment.caddyPodLabelsJson"
  # reads the rendered Caddy Deployment back before it hands the value to the worker: a Caddy Pod
  # labelled past the shared template fails these renders instead of reaching the assertions below.
  - it: hands the worker and the provisioner the labels the Caddy Pods carry
    set:
      platform:
        startupStage: full
        installationId: test-install
        baseDomain: apps.example.com
      secrets:
        installToken: test-install-token
        postgresPassword: test-postgres-password
        registryCredentialSigningKey: test-registry-signing-key-with-at-least-32-characters
        edgeToken: test-edge-token
        productLogIngestToken: test-product-log-token
        runtimeControlToken: test-runtime-control-token
        sessionSecret: test-session-secret
        systemToken: test-system-token
        tenantSecretsKek: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        variablesMasterKey: test-variables-master-key
        managedDomainAcmeDnsToken: ''
    asserts:
      - equal:
          path: spec.template.metadata.labels
          value:
            app.kubernetes.io/component: caddy
            app.kubernetes.io/instance: compartment
            app.kubernetes.io/name: compartment
        template: caddy.yaml
        documentIndex: 1
      - contains: &edgePodLabelsEnv
          path: spec.template.spec.containers[0].env
          content:
            name: COMPARTMENT_EDGE_POD_LABELS
            value: >-
              {"app.kubernetes.io/component":"caddy","app.kubernetes.io/instance":"compartment","app.kubernetes.io/name":"compartment"}
        template: worker.yaml
      - contains: *edgePodLabelsEnv
        template: project-provisioner.yaml

  - it: keeps the peer labels tracking the release the Caddy Pods belong to
    release:
      name: staging
      namespace: default
    set:
      platform:
        startupStage: full
        installationId: test-install
        baseDomain: apps.example.com
      secrets:
        installToken: test-install-token
        postgresPassword: test-postgres-password
        registryCredentialSigningKey: test-registry-signing-key-with-at-least-32-characters
        edgeToken: test-edge-token
        productLogIngestToken: test-product-log-token
        runtimeControlToken: test-runtime-control-token
        sessionSecret: test-session-secret
        systemToken: test-system-token
        tenantSecretsKek: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        variablesMasterKey: test-variables-master-key
        managedDomainAcmeDnsToken: ''
    asserts:
      - equal:
          path: spec.template.metadata.labels
          value:
            app.kubernetes.io/component: caddy
            app.kubernetes.io/instance: staging
            app.kubernetes.io/name: compartment
        template: caddy.yaml
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: COMPARTMENT_EDGE_POD_LABELS
            value: >-
              {"app.kubernetes.io/component":"caddy","app.kubernetes.io/instance":"staging","app.kubernetes.io/name":"compartment"}
        template: worker.yaml
