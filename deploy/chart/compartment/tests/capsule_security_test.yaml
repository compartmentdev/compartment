# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/v1.1.1/schema/helm-testsuite.json
suite: Capsule security and availability
templates:
  - templates/capsule-manager-rbac.yaml
  - templates/capsule-pdb.yaml
release:
  name: compartment
  namespace: compartment
tests:
  - it: grants no wildcard, Secret, or unrestricted RBAC authority
    template: templates/capsule-manager-rbac.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: ['']
              resources:
                - limitranges
                - namespaces
                - persistentvolumeclaims
                - persistentvolumes
                - pods
                - resourcequotas
                - serviceaccounts
                - services
              verbs: [get, list, watch]
            - apiGroups: [admissionregistration.k8s.io]
              resources: [mutatingwebhookconfigurations]
              verbs: [get, list, watch]
            - apiGroups: [apiextensions.k8s.io]
              resources: [customresourcedefinitions]
              verbs: [get, list, watch]
            - apiGroups: [capsule.clastix.io]
              resources:
                - capsuleconfigurations
                - customquotas
                - globalcustomquotas
                - globaltenantresources
                - quantityledgers
                - resourcepoolclaims
                - resourcepools
                - rulestatuses
                - tenantowners
                - tenantresources
                - tenants
              verbs: [get, list, watch]
            - apiGroups: [networking.k8s.io]
              resources: [ingresses, networkpolicies]
              verbs: [get, list, watch]
            - apiGroups: [discovery.k8s.io]
              resources: [endpointslices]
              verbs: [get, list, watch]
            - apiGroups: [gateway.networking.k8s.io]
              resources: [gatewayclasses]
              verbs: [get, list, watch]
            - apiGroups: [node.k8s.io]
              resources: [runtimeclasses]
              verbs: [get, list, watch]
            - apiGroups: [resource.k8s.io]
              resources: [deviceclasses]
              verbs: [get, list, watch]
            - apiGroups: [scheduling.k8s.io]
              resources: [priorityclasses]
              verbs: [get, list, watch]
            - apiGroups: [storage.k8s.io]
              resources: [storageclasses]
              verbs: [get, list, watch]
            - apiGroups: [capsule.clastix.io]
              resources: [capsuleconfigurations/status, globalcustomquotas/status, quantityledgers/status]
              verbs: [get, patch, update]
            - apiGroups: [capsule.clastix.io]
              resources: [quantityledgers]
              verbs: [create, patch, update, delete]
            - apiGroups: [events.k8s.io]
              resources: [events]
              verbs: [create, patch]
            - apiGroups: [admissionregistration.k8s.io]
              resources: [validatingwebhookconfigurations]
              verbs: [list, watch]
            - apiGroups: [admissionregistration.k8s.io]
              resourceNames: [compartment-capsule-dynamic-webhook]
              resources: [validatingwebhookconfigurations]
              verbs: [get, patch, update]
            - apiGroups: [rbac.authorization.k8s.io]
              resources: [clusterroles, clusterrolebindings, rolebindings]
              verbs: [list, watch]
            - apiGroups: [rbac.authorization.k8s.io]
              resourceNames: [capsule-namespace-deleter, capsule-namespace-provisioner]
              resources: [clusterroles]
              verbs: [get, patch, update]
            - apiGroups: [rbac.authorization.k8s.io]
              resourceNames: [capsule-namespace-provisioner]
              resources: [clusterrolebindings]
              verbs: [get, patch, update]
  - it: grants leader election without Secret API access
    template: templates/capsule-manager-rbac.yaml
    documentIndex: 2
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [coordination.k8s.io]
              resources: [leases]
              verbs: [get, list, watch, create, patch, update]
            - apiGroups: ['']
              resources: [events]
              verbs: [create, patch]
  - it: precreates only the canonical Capsule aggregate RBAC objects
    template: templates/capsule-manager-rbac.yaml
    documentIndex: 6
    asserts:
      - equal:
          path: metadata.name
          value: capsule-namespace-provisioner
      - equal:
          path: roleRef.name
          value: capsule-namespace-provisioner
      - isNull:
          path: subjects
      - equal:
          path: metadata.labels["projectcapsule.dev/created-by"]
          value: rbac-controller
  - it: precreates the calculation-only validating webhook
    template: templates/capsule-manager-rbac.yaml
    documentIndex: 7
    asserts:
      - equal:
          path: webhooks[0].clientConfig.service
          value:
            name: compartment-capsule-webhook-service
            namespace: compartment
            path: /custom-quotas/calculations
            port: 9443
      - equal:
          path: webhooks[0].rules
          value:
            - apiGroups: ['']
              apiVersions: [v1]
              operations: [CREATE, UPDATE, DELETE]
              resources: [pods, persistentvolumeclaims]
              scope: Namespaced
  - it: binds the Capsule manager only to the parent-owned role
    template: templates/capsule-manager-rbac.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: compartment-capsule-manager
      - notEqual:
          path: roleRef.name
          value: cluster-admin
  - it: protects one Capsule replica during voluntary disruption
    template: templates/capsule-pdb.yaml
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 1

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/v1.1.1/schema/helm-testsuite.json
suite: Capsule hook image policy
templates:
  - templates/capsule-admission-cleanup.yaml
  - charts/capsule/templates/hooks/crd-lifecycle/job.yaml
  - charts/capsule/templates/hooks/crd-lifecycle/rbac.yaml
  - charts/capsule/templates/hooks/pre-delete/job.yaml
  - charts/capsule/templates/hooks/post-install/job.yaml
release:
  name: compartment
  namespace: compartment
tests:
  - it: renders no unrelated Capsule lifecycle hooks
    template: charts/capsule/templates/hooks/pre-delete/job.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: installs and upgrades Capsule CRDs with the pinned kubectl image
    template: charts/capsule/templates/hooks/crd-lifecycle/job.yaml
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/clastix/kubectl:v1.35.1@sha256:eba976b9c2e9208c7e72a19e89fb8f84519e3b749235efbc0ea0fee6cdfc2ff2
  - it: limits CRD lifecycle mutation to Capsule CRDs
    template: charts/capsule/templates/hooks/crd-lifecycle/rbac.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: rules[1].apiGroups
          value: [apiextensions.k8s.io]
      - equal:
          path: rules[1].resources
          value: [customresourcedefinitions]
      - equal:
          path: rules[1].resourceNames
          value:
            - capsuleconfigurations.capsule.clastix.io
            - resourcepoolclaims.capsule.clastix.io
            - resourcepools.capsule.clastix.io
            - tenantresources.capsule.clastix.io
            - globaltenantresources.capsule.clastix.io
            - tenants.capsule.clastix.io
            - tenantowners.capsule.clastix.io
            - rulestatuses.capsule.clastix.io
            - customquotas.capsule.clastix.io
            - globalcustomquotas.capsule.clastix.io
            - quantityledgers.capsule.clastix.io
      - equal:
          path: rules[1].verbs
          value: [create, delete, get, patch, update]
  - it: grants cleanup only for named admission and CRD hook resources
    template: templates/capsule-admission-cleanup.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [admissionregistration.k8s.io]
              resourceNames: [compartment-capsule-dynamic-webhook]
              resources: [mutatingwebhookconfigurations, validatingwebhookconfigurations]
              verbs: [delete]
            - apiGroups: [rbac.authorization.k8s.io]
              resourceNames: ['capsule:compartment:crds']
              resources: [clusterroles, clusterrolebindings]
              verbs: [delete]
            - apiGroups: ['']
              resourceNames: [capsule-crds]
              resources: [serviceaccounts]
              verbs: [delete]
            - apiGroups: ['']
              resourceNames:
                - capsule-crds-capsuleconfigurations
                - capsule-crds-customquotas
                - capsule-crds-globalcustomquotas
                - capsule-crds-globaltenantresources
                - capsule-crds-quantityledgers
                - capsule-crds-resourcepoolclaims
                - capsule-crds-resourcepools
                - capsule-crds-rulestatuses
                - capsule-crds-tenantowners
                - capsule-crds-tenantresources
                - capsule-crds-tenants
              resources: [configmaps]
              verbs: [delete]
            - apiGroups: [batch]
              resourceNames: [capsule-crds]
              resources: [jobs]
              verbs: [delete]
  - it: uses the chart-owned pinned kubectl image for admission cleanup
    template: templates/capsule-admission-cleanup.yaml
    documentIndex: 3
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^registry.k8s.io/kubectl@sha256:[a-f0-9]{64}$'
      - equal:
          path: spec.template.spec.containers[0].args[18]
          value: --namespace
      - equal:
          path: spec.template.spec.containers[0].args[19]
          value: compartment
