suite: shared ingress topology
templates:
  - templates/caddy.yaml
  - templates/caddy-network-policy.yaml
  - templates/configmap.yaml
  - templates/ingress.yaml
  - templates/install-state-secret.yaml
  - templates/secret.yaml
values:
  - registry-values.yaml
tests:
  - it: exposes Caddy only as one-port ClusterIP
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
        template: caddy.yaml
        documentIndex: 0
      - lengthEqual:
          path: spec.ports
          count: 1
        template: caddy.yaml
        documentIndex: 0
      - equal:
          path: spec.ports[0].name
          value: http
        template: caddy.yaml
        documentIndex: 0
      - notExists:
          path: spec.ports[0].nodePort
        template: caddy.yaml
        documentIndex: 0

  - it: configures default hosted application traffic limits
    set:
      platform:
        startupStage: full
        installationId: test-edge-traffic-limits
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: COMPARTMENT_EDGE_APP_REQUESTS_PER_SECOND, value: '300' }
          any: true
        template: caddy.yaml
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: COMPARTMENT_EDGE_APP_BURST, value: '600' }
          any: true
        template: caddy.yaml
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: COMPARTMENT_EDGE_APP_IN_FLIGHT, value: '512' }
          any: true
        template: caddy.yaml
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: COMPARTMENT_EDGE_CLIENT_REQUESTS_PER_SECOND, value: '60' }
          any: true
        template: caddy.yaml
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: COMPARTMENT_EDGE_CLIENT_BURST, value: '120' }
          any: true
        template: caddy.yaml
        documentIndex: 1

  - it: maps hosted application traffic limit overrides
    set:
      platform:
        startupStage: full
        installationId: test-overridden-edge-traffic-limits
        edgeTrafficLimits:
          app: { requestsPerSecond: 450, burst: 900, inFlight: 640 }
          client: { requestsPerSecond: 75, burst: 150 }
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: COMPARTMENT_EDGE_APP_REQUESTS_PER_SECOND, value: '450' }
          any: true
        template: caddy.yaml
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: COMPARTMENT_EDGE_APP_BURST, value: '900' }
          any: true
        template: caddy.yaml
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: COMPARTMENT_EDGE_APP_IN_FLIGHT, value: '640' }
          any: true
        template: caddy.yaml
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: COMPARTMENT_EDGE_CLIENT_REQUESTS_PER_SECOND, value: '75' }
          any: true
        template: caddy.yaml
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: COMPARTMENT_EDGE_CLIENT_BURST, value: '150' }
          any: true
        template: caddy.yaml
        documentIndex: 1

  - it: accepts disabled hosted application traffic limits
    set:
      platform:
        startupStage: full
        installationId: test-disabled-edge-traffic-limits
        edgeTrafficLimits:
          app: { requestsPerSecond: 0, burst: 0, inFlight: 0 }
          client: { requestsPerSecond: 0, burst: 0 }
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: COMPARTMENT_EDGE_APP_REQUESTS_PER_SECOND, value: '0' }
          any: true
        template: caddy.yaml
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: COMPARTMENT_EDGE_APP_BURST, value: '0' }
          any: true
        template: caddy.yaml
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: COMPARTMENT_EDGE_APP_IN_FLIGHT, value: '0' }
          any: true
        template: caddy.yaml
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: COMPARTMENT_EDGE_CLIENT_REQUESTS_PER_SECOND, value: '0' }
          any: true
        template: caddy.yaml
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: COMPARTMENT_EDGE_CLIENT_BURST, value: '0' }
          any: true
        template: caddy.yaml
        documentIndex: 1

  - it: renders exact console and canonical wildcard hosts with an explicit class
    set:
      ingress:
        className: ingress-nginx
      platform:
        baseDomain: apps.example.com
    asserts:
      - equal:
          path: spec.ingressClassName
          value: ingress-nginx
        template: ingress.yaml
      - equal:
          path: spec.rules[0].host
          value: console.apps.example.com
        template: ingress.yaml
      - equal:
          path: spec.rules[1].host
          value: '*.apps.example.com'
        template: ingress.yaml
      - lengthEqual:
          path: spec.rules
          count: 2
        template: ingress.yaml
      - notExists:
          path: metadata.annotations
        template: ingress.yaml
      - notExists:
          path: spec.defaultBackend
        template: ingress.yaml
      - notEqual:
          path: spec.rules[0].host
          value: ''
        template: ingress.yaml
      - notEqual:
          path: spec.rules[1].host
          value: ''
        template: ingress.yaml
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: RELEASE-NAME-compartment-caddy
        template: ingress.yaml
      - equal:
          path: spec.rules[1].http.paths[0].backend.service.name
          value: RELEASE-NAME-compartment-caddy
        template: ingress.yaml

  - it: accepts Caddy traffic from an existing cluster ingress controller
    asserts:
      - equal:
          path: spec.policyTypes
          value: [Ingress]
        template: caddy-network-policy.yaml
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/name: compartment
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/component: caddy
        template: caddy-network-policy.yaml
      - equal:
          path: spec.ingress
          value:
            - from:
                - namespaceSelector: {}
              ports:
                - protocol: TCP
                  port: 8080
        template: caddy-network-policy.yaml
