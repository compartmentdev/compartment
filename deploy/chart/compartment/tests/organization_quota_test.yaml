# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/v1.1.1/schema/helm-testsuite.json
suite: organization quota reconciliation authority
templates:
  - templates/organization-quota-rbac.yaml
release:
  name: compartment
  namespace: compartment
tests:
  - it: grants quota reconciliation and constrained namespace backfill to the leader worker
    set:
      platform.startupStage: full
    asserts:
      - hasDocuments:
          count: 4
      - isKind:
          of: ClusterRole
        documentIndex: 0
      - equal:
          path: rules
          value:
            - apiGroups: [capsule.clastix.io]
              resources: [globalcustomquotas]
              verbs: [get, create, update, patch]
            - apiGroups: ['']
              resources: [namespaces]
              verbs: [get, patch]
        documentIndex: 0
      - isKind:
          of: ClusterRoleBinding
        documentIndex: 1
      - isKind:
          of: ValidatingAdmissionPolicy
        documentIndex: 2
      - equal:
          path: spec.failurePolicy
          value: Fail
        documentIndex: 2
      - matchRegex:
          path: spec.matchConditions[0].expression
          pattern: system:serviceaccount:compartment:compartment-worker
        documentIndex: 2
      - matchRegex:
          path: spec.validations[0].expression
          pattern: oldObject.metadata.labels
        documentIndex: 2
      - isKind:
          of: ValidatingAdmissionPolicyBinding
        documentIndex: 3
      - equal:
          path: spec.validationActions
          value: [Deny]
        documentIndex: 3
      - equal:
          path: subjects[0]
          value:
            kind: ServiceAccount
            name: compartment-worker
            namespace: compartment
        documentIndex: 1

  - it: emits no quota authority before the full startup stage
    set:
      platform.startupStage: foundation
    asserts:
      - hasDocuments:
          count: 0
