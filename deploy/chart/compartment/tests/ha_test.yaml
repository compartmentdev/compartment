# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/v1.1.1/schema/helm-testsuite.json
suite: minimal control-plane availability
templates:
  - templates/*.yaml
values:
  - registry-values.yaml
  - node-pools-values.yaml
release:
  name: compartment
  namespace: default
tests:
  - it: renders one replica and preserves the Caddy disruption budget by default
    set:
      platform: &fullPlatform
        startupStage: full
        installationId: test-ha
        baseDomain: apps.example.com
        usageMeteringIntervalMs: 45000
    asserts:
      - equal:
          path: spec.replicas
          value: 1
        template: api.yaml
        documentIndex: 1
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 0
        template: api.yaml
        documentIndex: 1
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].whenUnsatisfiable
          value: ScheduleAnyway
        template: api.yaml
        documentIndex: 1
      - equal:
          path: spec.replicas
          value: 1
        template: edge.yaml
        documentIndex: 1
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 0
        template: edge.yaml
        documentIndex: 1
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: kubernetes.io/hostname
        template: edge.yaml
        documentIndex: 1
      - equal:
          path: spec.replicas
          value: 1
        template: caddy.yaml
        documentIndex: 1
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 0
        template: caddy.yaml
        documentIndex: 1
      - equal:
          path: spec.strategy.rollingUpdate.maxSurge
          value: 1
        template: caddy.yaml
        documentIndex: 1
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].maxSkew
          value: 1
        template: caddy.yaml
        documentIndex: 1
      - equal:
          path: spec.replicas
          value: 1
        template: worker.yaml
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 0
        template: worker.yaml
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: kubernetes.io/hostname
        template: worker.yaml
      - equal:
          path: spec.replicas
          value: 1
        template: project-provisioner.yaml
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 0
        template: project-provisioner.yaml
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].whenUnsatisfiable
          value: ScheduleAnyway
        template: project-provisioner.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: COMPARTMENT_USAGE_METERING_INTERVAL_MS
            value: '45000'
        template: caddy.yaml
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: COMPARTMENT_EDGE_TOKEN
            valueFrom:
              secretKeyRef:
                name: compartment
                key: edge-token
        template: caddy.yaml
        documentIndex: 1
      - hasDocuments:
          count: 1
        template: pdb.yaml
      - equal:
          path: metadata.name
          value: compartment-caddy
        template: pdb.yaml
        documentIndex: 0
      - equal:
          path: spec.minAvailable
          value: 1
        template: pdb.yaml
        documentIndex: 0

  - it: renders disruption budgets when high availability is enabled
    set:
      platform:
        <<: *fullPlatform
      api:
        replicas: 2
      edge:
        replicas: 2
      caddy:
        replicas: 2
      worker:
        replicas: 2
      projectProvisioner:
        replicas: 2
    asserts:
      - hasDocuments:
          count: 5
        template: pdb.yaml
      - equal:
          path: spec.minAvailable
          value: 1
        template: pdb.yaml
        documentIndex: 0

  - it: grants only namespaced Lease coordination to worker controllers
    set:
      platform:
        <<: *fullPlatform
    asserts:
      - equal:
          path: rules[0]
          value:
            apiGroups: [coordination.k8s.io]
            resources: [leases]
            verbs: [get, create, update]
        template: leader-election-rbac.yaml
        documentIndex: 0
      - contains:
          path: subjects
          content:
            kind: ServiceAccount
            name: compartment-worker
            namespace: default
        template: leader-election-rbac.yaml
        documentIndex: 1
      - contains:
          path: subjects
          content:
            kind: ServiceAccount
            name: compartment-project-provisioner
            namespace: default
        template: leader-election-rbac.yaml
        documentIndex: 1

  - it: rejects an unsafe leader election timing order
    set:
      platform:
        <<: *fullPlatform
      leaderElection:
        leaseDurationMs: 10000
        renewDeadlineMs: 10000
        retryPeriodMs: 2000
    asserts:
      - failedTemplate:
          errorMessage: leaderElection.renewDeadlineMs must be less than leaderElection.leaseDurationMs

  - it: uses an existing external database secret and omits bundled PostgreSQL
    set:
      platform:
        <<: *fullPlatform
      postgres:
        external:
          enabled: true
          existingSecret: production-postgres
          databaseUrlKey: dsn
          passwordKey: password
    asserts:
      - hasDocuments:
          count: 0
        template: postgres.yaml
      - notExists:
          path: stringData.database-url
        template: secret.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: COMPARTMENT_DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: production-postgres
                key: dsn
          any: true
        template: api.yaml
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: COMPARTMENT_DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: production-postgres
                key: dsn
          any: true
        template: api-migrate.yaml
        documentIndex: 0
      - hasDocuments:
          count: 3
        template: pvc.yaml
