# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/v1.1.1/schema/helm-testsuite.json
suite: node pools and workload priority
templates:
  - templates/priority-class.yaml
  - templates/configmap.yaml
  - templates/secret.yaml
  - templates/install-state-secret.yaml
  - templates/api.yaml
  - templates/worker.yaml
  - templates/edge.yaml
  - templates/caddy.yaml
  - templates/postgres.yaml
  - templates/registry.yaml
  - templates/registry-auth.yaml
  - templates/project-provisioner.yaml
  - templates/api-migrate.yaml
  - templates/product-log-agent.yaml
  - templates/buildkit.yaml
values:
  - registry-values.yaml
  - node-pools-values.yaml
tests:
  - it: renders priority classes while omitting empty node pools
    asserts:
      - hasDocuments:
          count: 2
        template: priority-class.yaml
      - equal:
          path: metadata.name
          value: compartment-platform
        template: priority-class.yaml
        documentIndex: 0
      - equal:
          path: value
          value: 1000000
        template: priority-class.yaml
        documentIndex: 0
      - equal:
          path: globalDefault
          value: false
        template: priority-class.yaml
        documentIndex: 0
      - equal:
          path: preemptionPolicy
          value: PreemptLowerPriority
        template: priority-class.yaml
        documentIndex: 0
      - equal:
          path: metadata.name
          value: compartment-tenant
        template: priority-class.yaml
        documentIndex: 1
      - equal:
          path: value
          value: 0
        template: priority-class.yaml
        documentIndex: 1
      - equal:
          path: globalDefault
          value: false
        template: priority-class.yaml
        documentIndex: 1
      - equal: &platformPriority
          path: spec.template.spec.priorityClassName
          value: compartment-platform
        template: api.yaml
        documentIndex: 1
      - notExists: &noNodeSelector
          path: spec.template.spec.nodeSelector
        template: api.yaml
        documentIndex: 1
      - notExists: &noTolerations
          path: spec.template.spec.tolerations
        template: api.yaml
        documentIndex: 1
      - equal: *platformPriority
        template: worker.yaml
      - notExists: *noNodeSelector
        template: worker.yaml
      - notExists: *noTolerations
        template: worker.yaml
      - equal: *platformPriority
        template: edge.yaml
        documentIndex: 1
      - notExists: *noNodeSelector
        template: edge.yaml
        documentIndex: 1
      - notExists: *noTolerations
        template: edge.yaml
        documentIndex: 1
      - equal: *platformPriority
        template: caddy.yaml
        documentIndex: 1
      - notExists: *noNodeSelector
        template: caddy.yaml
        documentIndex: 1
      - notExists: *noTolerations
        template: caddy.yaml
        documentIndex: 1
      - equal: *platformPriority
        template: postgres.yaml
        documentIndex: 1
      - notExists: *noNodeSelector
        template: postgres.yaml
        documentIndex: 1
      - notExists: *noTolerations
        template: postgres.yaml
        documentIndex: 1
      - equal: *platformPriority
        template: registry.yaml
        documentIndex: 1
      - notExists: *noNodeSelector
        template: registry.yaml
        documentIndex: 1
      - notExists: *noTolerations
        template: registry.yaml
        documentIndex: 1
      - equal: *platformPriority
        template: registry-auth.yaml
        documentIndex: 2
      - notExists: *noNodeSelector
        template: registry-auth.yaml
        documentIndex: 2
      - notExists: *noTolerations
        template: registry-auth.yaml
        documentIndex: 2
      - equal: *platformPriority
        template: project-provisioner.yaml
      - notExists: *noNodeSelector
        template: project-provisioner.yaml
      - notExists: *noTolerations
        template: project-provisioner.yaml
      - equal: *platformPriority
        template: api-migrate.yaml
      - notExists: *noNodeSelector
        template: api-migrate.yaml
      - notExists: *noTolerations
        template: api-migrate.yaml
      - equal: *platformPriority
        template: product-log-agent.yaml
        documentIndex: 4
      - notExists: *noNodeSelector
        template: product-log-agent.yaml
        documentIndex: 4
      - notExists: *noTolerations
        template: product-log-agent.yaml
        documentIndex: 4
      - equal:
          path: data.COMPARTMENT_KUBE_BUILD_SCHEDULING
          value: '{"nodeSelector":{},"runtimeClassName":"gvisor","tolerations":[]}'
        template: configmap.yaml

  - it: routes platform, build, and tenant workloads to their configured pools
    set:
      nodePools:
        system: &systemPool
          nodeSelector: { compartment.dev/node-pool: system }
          tolerations:
            - { key: compartment.dev/node-pool, operator: Equal, value: system, effect: NoSchedule }
        build:
          nodeSelector: { compartment.dev/node-pool: build }
          tolerations:
            - { key: compartment.dev/node-pool, operator: Equal, value: build, effect: NoSchedule }
        tenant:
          nodeSelector: { compartment.dev/node-pool: tenant }
          tolerations:
            - { key: compartment.dev/node-pool, operator: Equal, value: tenant, effect: NoSchedule }
    asserts:
      - equal: &systemSelector
          path: spec.template.spec.nodeSelector
          value: { compartment.dev/node-pool: system }
        template: api.yaml
        documentIndex: 1
      - equal:
          path: spec.template.spec.tolerations
          value:
            - { key: compartment.dev/node-pool, operator: Equal, value: system, effect: NoSchedule }
        template: api.yaml
        documentIndex: 1
      - equal: *systemSelector
        template: worker.yaml
      - equal: *systemSelector
        template: edge.yaml
        documentIndex: 1
      - equal: *systemSelector
        template: caddy.yaml
        documentIndex: 1
      - equal: *systemSelector
        template: postgres.yaml
        documentIndex: 1
      - equal: *systemSelector
        template: registry.yaml
        documentIndex: 1
      - equal: *systemSelector
        template: registry-auth.yaml
        documentIndex: 2
      - equal: *systemSelector
        template: project-provisioner.yaml
      - equal: *systemSelector
        template: api-migrate.yaml
      - equal: *systemSelector
        template: product-log-agent.yaml
        documentIndex: 4
      - equal:
          path: data.COMPARTMENT_KUBE_BUILD_SCHEDULING
          value: '{"nodeSelector":{"compartment.dev/node-pool":"build"},"runtimeClassName":"gvisor","tolerations":[{"effect":"NoSchedule","key":"compartment.dev/node-pool","operator":"Equal","value":"build"}]}'
        template: configmap.yaml
      - contains: &tenantSchedulingEnv
          path: spec.template.spec.containers[0].env
          content:
            name: COMPARTMENT_KUBE_TENANT_SCHEDULING
            value: '{"nodeSelector":{"compartment.dev/node-pool":"tenant"},"runtimeClassName":"gvisor","tolerations":[{"effect":"NoSchedule","key":"compartment.dev/node-pool","operator":"Equal","value":"tenant"}]}'
        template: worker.yaml
      - contains: *tenantSchedulingEnv
        template: project-provisioner.yaml

  - it: falls back from an empty build pool to the system pool
    set:
      nodePools:
        system: *systemPool
    asserts:
      - equal:
          path: data.COMPARTMENT_KUBE_BUILD_SCHEDULING
          value: '{"nodeSelector":{"compartment.dev/node-pool":"system"},"runtimeClassName":"gvisor","tolerations":[{"effect":"NoSchedule","key":"compartment.dev/node-pool","operator":"Equal","value":"system"}]}'
        template: configmap.yaml

  - it: includes one custom sandbox RuntimeClass with the build pool
    set:
      sandboxRuntime:
        runtimeClassName: gke-gvisor
      nodePools:
        build:
          nodeSelector: { compartment.dev/node-pool: build }
          tolerations:
            - { key: compartment.dev/node-pool, operator: Equal, value: build, effect: NoSchedule }
    asserts:
      - equal:
          path: data.COMPARTMENT_KUBE_BUILD_SCHEDULING
          value: '{"nodeSelector":{"compartment.dev/node-pool":"build"},"runtimeClassName":"gke-gvisor","tolerations":[{"effect":"NoSchedule","key":"compartment.dev/node-pool","operator":"Equal","value":"build"}]}'
        template: configmap.yaml

  - it: includes the required sandbox RuntimeClass with the system pool fallback
    set:
      nodePools:
        system: *systemPool
    asserts:
      - equal:
          path: data.COMPARTMENT_KUBE_BUILD_SCHEDULING
          value: '{"nodeSelector":{"compartment.dev/node-pool":"system"},"runtimeClassName":"gvisor","tolerations":[{"effect":"NoSchedule","key":"compartment.dev/node-pool","operator":"Equal","value":"system"}]}'
        template: configmap.yaml
