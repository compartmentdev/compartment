# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/v1.1.1/schema/helm-testsuite.json
suite: retained install state resolution
templates:
  - templates/*.yaml
values:
  - registry-values.yaml
release:
  name: compartment
  namespace: default
  upgrade: true
kubernetesProvider:
  scheme:
    v1/Secret:
      gvr:
        version: v1
        resource: secrets
      namespaced: true
  objects:
    - apiVersion: v1
      kind: Secret
      metadata:
        name: compartment
        namespace: default
      data:
        tenant-secrets-kek: MTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMQ==
    - apiVersion: v1
      kind: Secret
      metadata:
        name: compartment-install-state
        namespace: default
      data:
        startup-stage: ZnVsbA==
        installation-id: cmV0YWluZWQtaW5zdGFsbA==
        ingress-class-name: aW5ncmVzcy1uZ2lueA==
        ingress-endpoint-type: aG9zdG5hbWU=
        ingress-endpoint-value: bGIuZXhhbXBsZS5jb20=
        ingress-targets-json: W3sidHlwZSI6Imhvc3RuYW1lIiwidmFsdWUiOiJsYi5leGFtcGxlLmNvbSJ9XQ==
        acme-email: cmV0YWluZWRAZXhhbXBsZS5jb20=
        managed-domain-broker-url: aHR0cHM6Ly9yZXRhaW5lZC1icm9rZXIuZXhhbXBsZQ==
        managed-domain-acme-dns-token: YnJva2VyLXRva2Vu
        domain-generation: Nw==
        domain-mode: bWFuYWdlZA==
        base-domain: cmV0YWluZWQuZXhhbXBsZS5jb20=
        managed-base-domain: bWFuYWdlZC5leGFtcGxlLmNvbQ==
        managed-issuer-ref-json: eyJraW5kIjoiSXNzdWVyIiwibmFtZSI6ImNvbXBhcnRtZW50LXBsYXRmb3JtIn0=
        public-protocol: aHR0cHM=
        registry-hostname: cmVnaXN0cnkucmV0YWluZWQuZXhhbXBsZS5jb20=
        registry-issuer-ref-kind: SXNzdWVy
        registry-issuer-ref-name: cmV0YWluZWQtcmVnaXN0cnktaXNzdWVy
        tls-mode: YnJva2VyLWRuczAx
    - apiVersion: v1
      kind: Secret
      metadata:
        name: operator-tls
        namespace: default
      data:
        tls.crt: dGVzdC1jZXJ0aWZpY2F0ZQ==
        tls.key: dGVzdC1wcml2YXRlLWtleQ==
    - apiVersion: v1
      kind: Secret
      metadata:
        name: empty-install-state
        namespace: default
      data:
        startup-stage: ZnVsbA==
        domain-generation: Nw==
        domain-mode: Y3VzdG9t
        base-domain: cmV0YWluZWQubG9jYWxob3N0
        public-protocol: aHR0cA==
        tls-mode: aXNzdWVy
    - apiVersion: v1
      kind: Secret
      metadata:
        name: interrupted-install-state
        namespace: default
      data:
        startup-stage: Zm91bmRhdGlvbg==
        installation-id: cmV0YWluZWQtaW50ZXJydXB0ZWQ=
        acme-email: cmV0YWluZWRAZXhhbXBsZS50ZXN0
        managed-domain-broker-url: aHR0cHM6Ly9icm9rZXIuZXhhbXBsZS50ZXN0
        managed-domain-acme-dns-token: ''
        domain-generation: MA==
        domain-mode: bWFuYWdlZA==
        base-domain: ''
        managed-base-domain: ''
        public-protocol: aHR0cHM=
        tls-mode: YnJva2VyLWRuczAx
    - apiVersion: v1
      kind: Secret
      metadata:
        name: endpoint-empty-install-state
        namespace: default
      data:
        ingress-endpoint-type: ''
        ingress-endpoint-value: ''
    - apiVersion: v1
      kind: Secret
      metadata:
        name: targets-empty-install-state
        namespace: default
      data:
        ingress-targets-json: W10=
tests:
  - it: retains the legacy variables key during the first tenant KEK migration
    set:
      secrets:
        productLogIngestToken: test-product-log-token
        registryCredentialSigningKey: test-registry-signing-key-with-at-least-32-characters
        tenantSecretsKek: '2222222222222222222222222222222222222222222222222222222222222222'
        variablesMasterKey: '1111111111111111111111111111111111111111111111111111111111111111'
    asserts:
      - equal:
          path: stringData.tenant-secrets-previous-kek
          value: '1111111111111111111111111111111111111111111111111111111111111111'
        template: secret.yaml

  - it: preserves the previous tenant KEK while rendering the rotation migration
    set:
      secrets:
        productLogIngestToken: test-product-log-token
        registryCredentialSigningKey: test-registry-signing-key-with-at-least-32-characters
        tenantSecretsKek: '2222222222222222222222222222222222222222222222222222222222222222'
    asserts:
      - equal:
          path: stringData.tenant-secrets-kek
          value: '2222222222222222222222222222222222222222222222222222222222222222'
        template: secret.yaml
      - equal:
          path: stringData.tenant-secrets-previous-kek
          value: '1111111111111111111111111111111111111111111111111111111111111111'
        template: secret.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: COMPARTMENT_TENANT_SECRETS_KEK
            valueFrom:
              secretKeyRef:
                name: compartment
                key: tenant-secrets-kek
        template: api-migrate.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: COMPARTMENT_TENANT_SECRETS_PREVIOUS_KEK
            valueFrom:
              secretKeyRef:
                name: compartment
                key: tenant-secrets-previous-kek
        template: api-migrate.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: COMPARTMENT_VARIABLES_MASTER_KEY
            valueFrom:
              secretKeyRef:
                name: compartment
                key: variables-master-key
        template: api-migrate.yaml

  - it: applies fresh operator choices while retaining installation identity
    set:
      ingress:
        className: incoming-ingress
        endpoint:
          type: A
          value: 8.8.4.4
        targetsJson: '[{"type":"A","value":"8.8.4.4"}]'
      tls:
        issuerRef:
          kind: Issuer
          name: incoming-managed-issuer
      platform:
        startupStage: foundation
        installationId: incoming-install
        domainGeneration: 0
        domainMode: custom
        baseDomain: incoming.localhost
        publicProtocol: http
        tlsMode: issuer
        acmeEmail: incoming@example.com
      secrets:
        managedDomainAcmeDnsToken: incoming-token
        registryCredentialSigningKey: test-registry-signing-key-with-at-least-32-characters
        productLogIngestToken: test-product-log-token
    asserts:
      - containsDocument:
          apiVersion: apps/v1
          kind: Deployment
          name: compartment-api
          any: true
        template: api.yaml
      - equal:
          path: data.COMPARTMENT_BASE_DOMAIN
          value: retained.example.com
        template: configmap.yaml
      - equal:
          path: data.COMPARTMENT_ARTIFACT_REGISTRY_HOST
          value: 10.43.250.250
        template: configmap.yaml
      - equal:
          path: data.COMPARTMENT_MANAGED_DOMAIN_BROKER_URL
          value: https://retained-broker.example
        template: configmap.yaml
      - equal:
          path: data.COMPARTMENT_INGRESS_TARGETS_JSON
          value: '[{"type":"A","value":"8.8.4.4"}]'
        template: configmap.yaml
      - equal:
          path: stringData.installation-id
          value: retained-install
        template: install-state-secret.yaml
      - equal:
          path: stringData.startup-stage
          value: full
        template: install-state-secret.yaml
      - equal:
          path: stringData.ingress-class-name
          value: incoming-ingress
        template: install-state-secret.yaml
      - equal:
          path: stringData.ingress-endpoint-type
          value: A
        template: install-state-secret.yaml
      - equal:
          path: stringData.ingress-endpoint-value
          value: 8.8.4.4
        template: install-state-secret.yaml
      - equal:
          path: stringData.domain-generation
          value: '7'
        template: install-state-secret.yaml
      - equal:
          path: stringData.managed-base-domain
          value: managed.example.com
        template: install-state-secret.yaml
      - equal:
          path: stringData.acme-email
          value: incoming@example.com
        template: install-state-secret.yaml
      - equal:
          path: stringData.managed-domain-acme-dns-token
          value: broker-token
        template: install-state-secret.yaml
      - equal:
          path: stringData.registry-hostname
          value: 10.43.250.250
        template: install-state-secret.yaml
      - equal:
          path: stringData.registry-issuer-ref-kind
          value: ClusterIssuer
        template: install-state-secret.yaml
      - equal:
          path: stringData.registry-issuer-ref-name
          value: registry-test-issuer
        template: install-state-secret.yaml
      - equal:
          path: stringData.managed-issuer-ref-json
          value: '{"kind":"Issuer","name":"compartment-platform"}'
        template: install-state-secret.yaml

  - it: resumes the foundation stage after an interrupted install with an empty domain
    release:
      name: interrupted
      namespace: default
      upgrade: true
    set:
      platform:
        startupStage: foundation
        installationId: replacement-attempt
        domainGeneration: 0
        domainMode: managed
        baseDomain: ''
        publicProtocol: https
        tlsMode: broker-dns01
        acmeEmail: retained@example.test
        managedDomainBrokerUrl: https://broker.example.test
      secrets:
        managedDomainAcmeDnsToken: ''
    asserts:
      - notFailedTemplate: {}
      - equal:
          path: stringData.installation-id
          value: retained-interrupted
        template: install-state-secret.yaml
      - equal:
          path: stringData.base-domain
          value: ''
        template: install-state-secret.yaml
      - equal:
          path: stringData.registry-hostname
          value: 10.43.250.250
        template: install-state-secret.yaml
      - equal:
          path: stringData.registry-issuer-ref-name
          value: registry-test-issuer
        template: install-state-secret.yaml

  - it: persists the resolved domain over the interrupted empty state
    release:
      name: interrupted
      namespace: default
      upgrade: true
    set:
      platform:
        startupStage: foundation
        installationId: replacement-attempt
        domainGeneration: 1
        domainMode: managed
        baseDomain: resumed.example.test
        publicProtocol: https
        tlsMode: broker-dns01
        acmeEmail: retained@example.test
        managedDomainBrokerUrl: https://broker.example.test
      secrets:
        managedDomainAcmeDnsToken: incoming-token
    asserts:
      - notFailedTemplate: {}
      - equal:
          path: data.COMPARTMENT_BASE_DOMAIN
          value: resumed.example.test
        template: configmap.yaml
      - equal:
          path: stringData.installation-id
          value: retained-interrupted
        template: install-state-secret.yaml
      - equal:
          path: stringData.base-domain
          value: resumed.example.test
        template: install-state-secret.yaml

  - it: persists a typed A ingress endpoint
    release:
      name: endpoint-a
      namespace: default
      upgrade: true
    set:
      ingress:
        className: traefik
        endpoint:
          type: A
          value: 8.8.8.8
    asserts:
      - equal:
          path: stringData.ingress-endpoint-type
          value: A
        template: install-state-secret.yaml
      - equal:
          path: stringData.ingress-endpoint-value
          value: 8.8.8.8
        template: install-state-secret.yaml

  - it: replaces deferred empty retained ingress targets after discovery
    release:
      name: targets-empty
      namespace: default
      upgrade: true
    set:
      ingress:
        targetsJson: '[{"type":"A","value":"8.8.8.8"}]'
    asserts:
      - equal:
          path: data.COMPARTMENT_INGRESS_TARGETS_JSON
          value: '[{"type":"A","value":"8.8.8.8"}]'
        template: configmap.yaml
      - equal:
          path: stringData.ingress-targets-json
          value: '[{"type":"A","value":"8.8.8.8"}]'
        template: install-state-secret.yaml

  - it: persists a typed AAAA ingress endpoint
    release:
      name: endpoint-aaaa
      namespace: default
      upgrade: true
    set:
      ingress:
        className: traefik
        endpoint:
          type: AAAA
          value: 2001:4860:4860::8888
    asserts:
      - equal:
          path: stringData.ingress-endpoint-type
          value: AAAA
        template: install-state-secret.yaml
      - equal:
          path: stringData.ingress-endpoint-value
          value: 2001:4860:4860::8888
        template: install-state-secret.yaml

  - it: persists a hostname ingress endpoint without projection to an IP
    release:
      name: endpoint-hostname
      namespace: default
      upgrade: true
    set:
      ingress:
        className: traefik
        endpoint:
          type: hostname
          value: lb.example.com
    asserts:
      - equal:
          path: stringData.ingress-endpoint-type
          value: hostname
        template: install-state-secret.yaml
      - equal:
          path: stringData.ingress-endpoint-value
          value: lb.example.com
        template: install-state-secret.yaml

  - it: replaces an empty retained endpoint with the first observed hostname
    release:
      name: endpoint-empty
      namespace: default
      upgrade: true
    set:
      ingress:
        className: traefik
        endpoint:
          type: hostname
          value: ingress.example.com
    asserts:
      - equal:
          path: stringData.ingress-endpoint-type
          value: hostname
        template: install-state-secret.yaml
      - equal:
          path: stringData.ingress-endpoint-value
          value: ingress.example.com
        template: install-state-secret.yaml
