# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/v1.1.1/schema/helm-testsuite.json
suite: tenant capacity headroom
templates:
  - templates/priority-class.yaml
  - templates/capacity-headroom-priority-class.yaml
  - templates/capacity-headroom.yaml
tests:
  - it: renders one preemptible free-app allocation on the tenant pool
    set:
      platform.startupStage: full
      nodePools:
        tenant:
          nodeSelector: { compartment.dev/node-pool: tenant }
          tolerations:
            - { key: compartment.dev/node-pool, operator: Equal, value: tenant, effect: NoSchedule }
    asserts:
      - hasDocuments:
          count: 1
        template: capacity-headroom-priority-class.yaml
      - equal:
          path: metadata.name
          value: compartment-capacity-headroom
        template: capacity-headroom-priority-class.yaml
      - equal:
          path: value
          value: -1
        template: capacity-headroom-priority-class.yaml
      - equal:
          path: preemptionPolicy
          value: Never
        template: capacity-headroom-priority-class.yaml
      - equal:
          path: spec.replicas
          value: 1
        template: capacity-headroom.yaml
      - equal:
          path: spec.strategy
          value: { type: Recreate }
        template: capacity-headroom.yaml
      - equal:
          path: spec.template.spec.priorityClassName
          value: compartment-capacity-headroom
        template: capacity-headroom.yaml
      - equal:
          path: spec.template.spec.runtimeClassName
          value: gvisor
        template: capacity-headroom.yaml
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 0
        template: capacity-headroom.yaml
      - equal:
          path: spec.template.spec.nodeSelector
          value: { compartment.dev/node-pool: tenant }
        template: capacity-headroom.yaml
      - equal:
          path: spec.template.spec.tolerations
          value:
            - { key: compartment.dev/node-pool, operator: Equal, value: tenant, effect: NoSchedule }
        template: capacity-headroom.yaml
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests: { cpu: 50m, ephemeral-storage: 1Gi, memory: 512Mi }
            limits: { cpu: '1', ephemeral-storage: 1Gi, memory: 512Mi }
        template: capacity-headroom.yaml
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.k8s.io/pause@sha256:ee6521f290b2168b6e0935a181d4cff9be1ac3f505666ef0e3c98fae8199917a
        template: capacity-headroom.yaml

  - it: can disable paid spare capacity explicitly
    set:
      capacityHeadroom.replicas: 0
      platform.startupStage: full
    asserts:
      - hasDocuments:
          count: 0
        template: capacity-headroom.yaml
      - hasDocuments:
          count: 2
        template: priority-class.yaml
      - hasDocuments:
          count: 0
        template: capacity-headroom-priority-class.yaml

  - it: derives the complete allocation from canonical tenant defaults
    set:
      platform.startupStage: full
      sandboxRuntime.runtimeClassName: tenant-sandbox
      resources.projectContainerDefaults:
        request: { cpu: 125m, ephemeral-storage: 128Mi, memory: 384Mi }
        limit: { cpu: 500m, ephemeral-storage: 1Gi, memory: 384Mi }
    asserts:
      - equal:
          path: spec.template.spec.runtimeClassName
          value: tenant-sandbox
        template: capacity-headroom.yaml
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests: { cpu: 125m, ephemeral-storage: 128Mi, memory: 384Mi }
            limits: { cpu: 500m, ephemeral-storage: 1Gi, memory: 384Mi }
        template: capacity-headroom.yaml

  - it: omits tenant capacity headroom during foundation startup
    set:
      platform.startupStage: foundation
    asserts:
      - hasDocuments:
          count: 0
        template: capacity-headroom.yaml
      - hasDocuments:
          count: 0
        template: capacity-headroom-priority-class.yaml
