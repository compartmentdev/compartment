suite: sandbox runtime
templates:
  - api.yaml
  - api-migrate.yaml
  # The worker reads the Caddy Pod labels back out of the rendered Caddy Deployment.
  - caddy.yaml
  - configmap.yaml
  - install-state-secret.yaml
  - worker.yaml
  - project-provisioner.yaml
  - secret.yaml
values:
  - registry-values.yaml
  - node-pools-values.yaml
tests:
  - it: schedules builds and tenant workloads through the required default sandbox
    asserts:
      - contains: &sandboxRuntimeEnv
          path: spec.template.spec.containers[0].env
          content:
            name: COMPARTMENT_KUBE_TENANT_SCHEDULING
            value: '{"nodeSelector":{},"runtimeClassName":"gvisor","tolerations":[]}'
        template: worker.yaml
      - contains: *sandboxRuntimeEnv
        template: project-provisioner.yaml
      - equal:
          path: data.COMPARTMENT_KUBE_BUILD_SCHEDULING
          value: '{"nodeSelector":{},"runtimeClassName":"gvisor-build","tolerations":[]}'
        template: configmap.yaml
      - notExists:
          path: spec.template.spec.runtimeClassName
        template: api.yaml
      - notExists:
          path: spec.template.spec.runtimeClassName
        template: api-migrate.yaml

  - it: applies separate operator RuntimeClasses to build and tenant workloads
    set:
      sandboxRuntime:
        buildRuntimeClassName: gke-gvisor-build
        runtimeClassName: gke-gvisor
    asserts:
      - contains: &customTenantRuntimeEnv
          path: spec.template.spec.containers[0].env
          content:
            name: COMPARTMENT_KUBE_TENANT_SCHEDULING
            value: '{"nodeSelector":{},"runtimeClassName":"gke-gvisor","tolerations":[]}'
        template: worker.yaml
      - contains: *customTenantRuntimeEnv
        template: project-provisioner.yaml
      - equal:
          path: data.COMPARTMENT_KUBE_BUILD_SCHEDULING
          value: '{"nodeSelector":{},"runtimeClassName":"gke-gvisor-build","tolerations":[]}'
        template: configmap.yaml
