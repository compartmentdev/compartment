ports:
  api: 39444
  edge: 39081
  registry: 5000
  registryInternal: 5001
  dockerHubCache: 5002
  http: 8080

ingress:
  className: traefik
  endpoint:
    type: ''
    value: ''
  targetsJson: '[]'

tls:
  issuerRef:
    name: compartment-platform
    kind: Issuer
  existingSecret: ''
  acme:
    environment: production
    productionUrl: https://acme-v02.api.letsencrypt.org/directory
    stagingUrl: https://acme-staging-v02.api.letsencrypt.org/directory
    skipTlsVerify: false
  solver:
    groupName: dns01.compartment.dev

storage:
  storageClass: ''
  postgres: 2Gi
  registry: 2Gi
  dockerHubCache: 20Gi
  edgeSnapshots: 1Gi
  api: 1Gi

api:
  replicas: 1

worker:
  replicas: 1
  deploymentInfrastructureTimeoutMs: 600000

projectProvisioner:
  replicas: 1

leaderElection:
  leaseDurationMs: 15000
  renewDeadlineMs: 10000
  retryPeriodMs: 2000

platform:
  startupStage: foundation
  domainGeneration: 0
  domainCommit: true
  installationId: ''
  domainMode: custom
  baseDomain: localhost
  publicProtocol: http
  tlsMode: issuer
  acmeEmail: ''
  managedDomainBrokerUrl: https://broker.compartment.run
  logLevel: info
  trustedOutboundHosts: ''
  workerPollIntervalMs: 1000
  usageMeteringIntervalMs: 60000
  usageRetentionDays: 400
  auditRetentionDays: 90
  auditCleanupCron: '0 3 * * *'
  auditCleanupBatchSize: 1000
  auditCleanupMaxBatches: 100
  auditFileSinkEnabled: false
  auditFileSinkRotateInterval: 1d
  auditFileSinkRotateSize: 64M
  auditFileSinkRetentionFiles: 30
  edgeTrafficLimits:
    app: { requestsPerSecond: 300, burst: 600, inFlight: 512 }
    client: { requestsPerSecond: 60, burst: 120 }
  rollbackRetentionLimit: ''
  sourceArchiveMaxBytes: 104857600
  sessionTtl: 7d
  signupEnabled: false
  newProjectsPrivateByDefault: true
  authThrottle:
    login:
      route: { window: 1m, limit: 30 }
      source: { window: 5m, limit: 20, cooldown: 15m }
      account: { window: 10m, limit: 10, cooldown: 30m }
      sourceAccount: { window: 1m, limit: 5, cooldown: 10m }
    activation:
      route: { window: 1m, limit: 10 }
      source: { window: 10m, limit: 15, cooldown: 30m }
      subject: { window: 30m, limit: 5, cooldown: 60m }
      sourceSubject: { window: 10m, limit: 3, cooldown: 30m }
    passwordReset:
      route: { window: 1m, limit: 10 }
      source: { window: 10m, limit: 15, cooldown: 30m }
      subject: { window: 30m, limit: 5, cooldown: 60m }
      sourceSubject: { window: 10m, limit: 3, cooldown: 30m }
  rolloutMarker: ''

postgres:
  database: compartment
  username: postgres
  external:
    enabled: false
    existingSecret: ''
    databaseUrlKey: database-url
    passwordKey: postgres-password

nodePools:
  system:
    nodeSelector: {}
    tolerations: []
  build:
    nodeSelector: {}
    tolerations: []
  tenant:
    nodeSelector: {}
    tolerations: []
  data:
    nodeSelector: {}
    tolerations: []

capacityHeadroom:
  # One preemptible free-app allocation makes autoscalers add capacity before tenant nodes are full.
  replicas: 1

sandboxRuntime:
  runtimeClassName: gvisor

buildkit:
  enabled: true
  namespace: compartment-build
  # Per-build memory-backed BuildKit data volume. Build Pod memory resources must fund this value,
  # the other 1Gi of tmpfs workspace, and 1Gi of BuildKit, runner, and Sentry process memory.
  dataSizeLimit: 2Gi
  # BuildKit keeps this much cache in its memory-backed data volume. Every build Job is deleted
  # after its result is captured, so retention above the live working set only consumes Pod memory.
  gcKeepStorageMb: 1024
  maximumConcurrentBuilds: 100
  maximumConcurrentBuildsPerOrganization: 2
  resourceQuota:
    limits:
      cpu: '48'
      memory: 64Gi
  timeoutMs: 1800000
  dnsNamespaceSelector:
    kubernetes.io/metadata.name: kube-system
  dnsPodSelector:
    k8s-app: kube-dns
  podCidr: 10.42.0.0/16
  serviceCidr: 10.43.0.0/16

dockerHubCache:
  enabled: true
  credentials:
    existingSecret: ''

edge:
  replicas: 1
  snapshots:
    enabled: false
    mountPath: /var/lib/compartment/snapshots

caddy:
  replicas: 1

registry:
  clusterIP: ''
  hostname: ''
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: ''
  storage:
    backend: pvc
    s3:
      bucket: ''
      region: ''
      regionEndpoint: ''
      forcePathStyle: false
      existingSecret: ''

productLogs:
  enabled: true
  namespace: ''

secrets:
  installToken: ''
  postgresPassword: ''
  registryCredentialSigningKey: ''
  edgeToken: ''
  productLogIngestToken: ''
  runtimeControlToken: ''
  sessionSecret: ''
  systemToken: ''
  tenantSecretsKek: ''
  tenantSecretsPreviousKek: null
  variablesMasterKey: ''
  managedDomainAcmeDnsToken: ''

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

resources:
  projectContainerDefaults:
    request: { cpu: 50m, memory: 512Mi }
    limit: { cpu: '1', memory: 512Mi }
  projectQuota:
    requestsCpu: '2'
    requestsMemory: 8Gi
    limitsCpu: '8'
    limitsMemory: 8Gi
    requestsStorage: 20Gi
  organizationQuota:
    requestsCpu: '2'
    requestsMemory: 8Gi
    limitsCpu: '8'
    limitsMemory: 8Gi
    requestsStorage: 20Gi
  api:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { cpu: '1', memory: 384Mi }
  apiMigrate:
    requests: { cpu: 50m, memory: 512Mi }
    limits: { cpu: 500m, memory: 512Mi }
  worker:
    requests: { cpu: 100m, memory: 768Mi }
    limits: { cpu: '1', memory: 768Mi }
  projectProvisioner:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: '1', memory: 256Mi }
  edge:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 128Mi }
  edgeInit:
    requests: { cpu: 10m, memory: 128Mi }
    limits: { cpu: 100m, memory: 128Mi }
  caddy:
    requests: { cpu: 25m, memory: 128Mi }
    limits: { cpu: 500m, memory: 128Mi }
  caddyInit:
    requests: { cpu: 10m, memory: 128Mi }
    limits: { cpu: 100m, memory: 128Mi }
  postgres:
    requests: { cpu: 100m, memory: 1Gi }
    limits: { cpu: '1', memory: 1Gi }
  registry:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { cpu: 500m, memory: 256Mi }
  registryAuth:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { cpu: 500m, memory: 256Mi }
  dns01Solver:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 128Mi }
  dockerHubCache:
    requests: { cpu: 50m, memory: 512Mi }
    limits: { cpu: 500m, memory: 512Mi }
  # gVisor serves the build Job's emptyDir volumes from Sentry memory, so these two limits also fund
  # buildkit.dataSizeLimit plus the other 1Gi of tmpfs workspace. The worker refuses to start when
  # they no longer cover that workspace plus 1Gi of BuildKit, runner, and Sentry process memory.
  buildkit:
    requests: { cpu: 250m, memory: 3Gi }
    limits: { cpu: 1750m, memory: 3Gi }
  buildRunner:
    requests: { cpu: 100m, memory: 1Gi }
    limits: { cpu: 250m, memory: 1Gi }
  productLogAgent:
    requests: { cpu: 50m, memory: 256Mi, ephemeral-storage: 320Mi }
    limits: { cpu: '1', memory: 256Mi, ephemeral-storage: 384Mi }
  wait:
    requests: { cpu: 10m, memory: 128Mi }
    limits: { cpu: 100m, memory: 128Mi }

capsule:
  crds:
    install: false
  global:
    jobs:
      postInstall:
        enabled: false
      preDelete:
        enabled: false
  replicaCount: 2
  priorityClassName: system-cluster-critical
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: capsule
  manager:
    image:
      registry: ghcr.io
      repository: projectcapsule/capsule
      tag: 'v0.13.11@sha256:d55bef9a0753259dddbe84a84a5a8d1ee0ebecf23de44ea2056072e08c41338c'
    rbac:
      create: false
      strict: true
    options:
      users: []
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { cpu: 500m, memory: 512Mi }
  webhooks:
    hooks:
      customquotas: { enabled: false }
      globalcustomquotas: { enabled: false }
      calculations:
        enabled: true
        failurePolicy: Fail
        namespaceSelector:
          matchLabels:
            app.kubernetes.io/managed-by: compartment
          matchExpressions:
            - key: compartment.dev/organization-id
              operator: Exists
            - key: compartment.dev/project-id
              operator: Exists
        rules:
          - apiGroups: ['']
            apiVersions: ['v1']
            operations: [CREATE, UPDATE]
            resources: [pods, persistentvolumeclaims]
            scope: Namespaced
      rulestatus: { enabled: false }
      metadata: { enabled: false }
      generic: { enabled: false }
      resourcepools:
        pools: { enabled: false }
        claims: { enabled: false }
      customresources: { enabled: false }
      namespaces: { enabled: false }
      cordoning: { enabled: false }
      gateways: { enabled: false }
      ingresses: { enabled: false }
      devices: { enabled: false }
      pods: { enabled: false }
      persistentvolumeclaims: { enabled: false }
      tenants: { enabled: false }
      owners: { enabled: false }
      config: { enabled: false }
      managed: { enabled: false }
      replications: { enabled: false }
      services: { enabled: false }
      nodes: { enabled: false }
      serviceaccounts: { enabled: false }
