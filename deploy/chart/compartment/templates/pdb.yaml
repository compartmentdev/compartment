{{- $installState := include "compartment.resolvedInstallState" . | fromYaml -}}
{{- if eq $installState.effective.platform.startupStage "full" -}}
{{- range $component := list "api" "edge" "caddy" "worker" "projectProvisioner" -}}
{{- $replicas := int (dig "replicas" 1 (get $.Values $component)) -}}
{{- if or (gt $replicas 1) (eq $component "caddy") }}
{{ $labelComponent := ternary "project-provisioner" $component (eq $component "projectProvisioner") }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "compartment.fullname" $ }}-{{ $labelComponent }}
  labels:
    {{- include "compartment.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $labelComponent }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "compartment.componentLabels" (dict "root" $ "component" $labelComponent) | nindent 6 }}
{{- end -}}
{{- end -}}
{{- end -}}
