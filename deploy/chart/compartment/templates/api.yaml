{{- $installState := include "compartment.resolvedInstallState" . | fromYaml -}}
{{- if eq $installState.effective.platform.startupStage "full" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "compartment.fullname" . }}-api
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "compartment.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ports.api }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "compartment.fullname" . }}-api
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "compartment.componentLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "compartment.componentLabels" (dict "root" . "component" "api") | nindent 8 }}
      annotations:
        {{- include "compartment.apiDomainRolloutAnnotations" . | nindent 8 }}
        compartment.dev/tenant-kek-values: {{ printf "%s:%s" .Values.secrets.tenantSecretsKek (.Values.secrets.tenantSecretsPreviousKek | default "") | sha256sum | quote }}
    spec:
      topologySpreadConstraints:
        {{- include "compartment.topologySpreadConstraint" (dict "root" . "component" "api") | nindent 8 }}
      priorityClassName: {{ include "compartment.platformPriorityClassName" . }}
      {{- include "compartment.nodePool" .Values.nodePools.system | nindent 6 }}
      {{- include "compartment.waiterPodSpec" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        {{- include "compartment.waitForMigrationInit" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "compartment.image" .Values.images.api }}
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          securityContext:
            {{- include "compartment.containerSecurityContext" . | nindent 12 }}
            runAsUser: 10001
            runAsGroup: 10001
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "compartment.fullname" . }}
          env:
            - name: COMPARTMENT_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: {{ include "compartment.databaseSecretName" . }}, key: {{ include "compartment.databaseUrlSecretKey" . }}}
            - name: COMPARTMENT_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ include "compartment.databaseSecretName" . }}, key: {{ include "compartment.postgresPasswordSecretKey" . }}}
            - name: COMPARTMENT_EDGE_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ include "compartment.fullname" . }}, key: edge-token}
            - name: COMPARTMENT_INSTALL_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ include "compartment.fullname" . }}, key: install-token}
            - name: COMPARTMENT_MANAGED_DOMAIN_BROKER_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ include "compartment.installStateSecretName" . }}, key: managed-domain-acme-dns-token}
            - name: COMPARTMENT_PRODUCT_LOG_INGEST_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ include "compartment.fullname" . }}, key: product-log-ingest-token}
            - name: COMPARTMENT_RUNTIME_CONTROL_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ include "compartment.fullname" . }}, key: runtime-control-token}
            - name: COMPARTMENT_SESSION_SECRET
              valueFrom:
                secretKeyRef: {name: {{ include "compartment.fullname" . }}, key: session-secret}
            - name: COMPARTMENT_SYSTEM_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ include "compartment.fullname" . }}, key: system-token}
            - name: COMPARTMENT_TENANT_SECRETS_KEK
              valueFrom:
                secretKeyRef: {name: {{ include "compartment.fullname" . }}, key: tenant-secrets-kek}
            - name: COMPARTMENT_TENANT_SECRETS_PREVIOUS_KEK
              valueFrom:
                secretKeyRef: {name: {{ include "compartment.fullname" . }}, key: tenant-secrets-previous-kek}
            - name: COMPARTMENT_VARIABLES_MASTER_KEY
              valueFrom:
                secretKeyRef: {name: {{ include "compartment.fullname" . }}, key: variables-master-key}
          ports:
            - name: http
              containerPort: {{ .Values.ports.api }}
            - name: metrics
              containerPort: {{ .Values.ports.metrics }}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /var/lib/compartment}
            - {name: runtime, mountPath: /var/run/compartment}
            - {name: tmp, mountPath: /tmp}
      volumes:
        {{- include "compartment.kubeApiAccessVolume" . | nindent 8 }}
        - name: data
          {{- if eq (int .Values.api.replicas) 1 }}
          persistentVolumeClaim:
            claimName: {{ include "compartment.fullname" . }}-api
          {{- else }}
          emptyDir: {}
          {{- end }}
        - {name: runtime, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
{{- end }}
