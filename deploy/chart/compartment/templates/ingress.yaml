{{- $installState := include "compartment.resolvedInstallState" . | fromYaml -}}
{{- $baseDomain := default (printf "pending.%s.invalid" .Release.Name) $installState.effective.platform.baseDomain -}}
{{- $operatorTlsSecret := .Values.tls.existingSecret -}}
{{- $managedTlsSecret := default (printf "%s-wildcard-tls" (include "compartment.fullname" .)) $operatorTlsSecret -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "compartment.fullname" . }}
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingress
spec:
  ingressClassName: {{ $installState.effective.ingress.className | quote }}
{{- if and (eq $installState.effective.platform.startupStage "full") (eq $installState.effective.platform.publicProtocol "https") }}
  tls:
    - hosts:
        - {{ printf "console.%s" $baseDomain | quote }}
      secretName: {{ if eq $installState.effective.platform.domainMode "managed" }}{{ $managedTlsSecret }}{{ else }}{{ default (printf "%s-console-tls" (include "compartment.fullname" .)) $operatorTlsSecret }}{{ end }}
    - hosts:
        - {{ printf "*.%s" $baseDomain | quote }}
      secretName: {{ default $managedTlsSecret $operatorTlsSecret }}
{{- end }}
  rules:
    {{- include "compartment.caddyIngressRule" (dict "root" . "host" (printf "console.%s" $baseDomain)) | nindent 4 }}
    {{- include "compartment.caddyIngressRule" (dict "root" . "host" (printf "*.%s" $baseDomain)) | nindent 4 }}
