{{- $installState := include "compartment.resolvedInstallState" . | fromYaml -}}
{{- $baseDomain := default (printf "pending.%s.invalid" .Release.Name) $installState.effective.platform.baseDomain -}}
{{- $operatorTlsSecret := default $installState.effective.customTls.existingSecret .Values.tls.existingSecret -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "compartment.fullname" . }}
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingress
spec:
  ingressClassName: {{ $installState.effective.ingress.className | quote }}
{{- if and (eq $installState.effective.platform.startupStage "full") (eq $installState.effective.platform.publicProtocol "https") }}
  tls:
    - hosts:
        - {{ printf "console.%s" $baseDomain | quote }}
      secretName: {{ default (printf "%s-console-tls" (include "compartment.fullname" .)) $operatorTlsSecret }}
    - hosts:
        - {{ printf "*.%s" $baseDomain | quote }}
      secretName: {{ default (printf "%s-wildcard-tls" (include "compartment.fullname" .)) $operatorTlsSecret }}
{{- end }}
  rules:
    - host: {{ printf "console.%s" $baseDomain | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "compartment.fullname" . }}-caddy
                port:
                  name: http
    - host: {{ printf "*.%s" $baseDomain | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "compartment.fullname" . }}-caddy
                port:
                  name: http
