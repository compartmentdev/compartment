{{- $installState := include "compartment.resolvedInstallState" . | fromYaml -}}
{{- if eq $installState.effective.platform.startupStage "full" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "compartment.fullname" . }}-organization-quota-reconciler
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
rules:
  - apiGroups: ["capsule.clastix.io"]
    resources: ["globalcustomquotas"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "compartment.fullname" . }}-organization-quota-reconciler
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "compartment.fullname" . }}-organization-quota-reconciler
subjects:
  - kind: ServiceAccount
    name: {{ include "compartment.fullname" . }}-worker
    namespace: {{ .Release.Namespace }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "compartment.fullname" . }}-organization-quota-namespace-backfill
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["namespaces"]
        scope: Cluster
  matchConditions:
    - name: organization-quota-worker
      expression: {{ printf "request.userInfo.username == 'system:serviceaccount:%s:%s-worker'" .Release.Namespace (include "compartment.fullname" .) | quote }}
  validations:
    - expression: "object.metadata.name.startsWith('cpt-') && 'app.kubernetes.io/managed-by' in oldObject.metadata.labels && oldObject.metadata.labels['app.kubernetes.io/managed-by'] == 'compartment' && 'compartment.dev/namespace-id' in oldObject.metadata.labels && 'compartment.dev/project-id' in oldObject.metadata.labels && oldObject.metadata.labels['compartment.dev/namespace-id'] == oldObject.metadata.labels['compartment.dev/project-id'] && 'compartment.dev/organization-id' in object.metadata.labels && object.metadata.labels['compartment.dev/organization-id'] != '' && (!('compartment.dev/organization-id' in oldObject.metadata.labels) || object.metadata.labels['compartment.dev/organization-id'] == oldObject.metadata.labels['compartment.dev/organization-id']) && oldObject.metadata.labels.all(key, value, key == 'compartment.dev/organization-id' || (key in object.metadata.labels && object.metadata.labels[key] == value)) && object.metadata.labels.all(key, value, key == 'compartment.dev/organization-id' || key in oldObject.metadata.labels) && object.metadata.annotations == oldObject.metadata.annotations && object.metadata.finalizers == oldObject.metadata.finalizers && object.metadata.ownerReferences == oldObject.metadata.ownerReferences && object.spec == oldObject.spec"
      message: Organization quota reconciliation may label only canonical Compartment project namespaces.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "compartment.fullname" . }}-organization-quota-namespace-backfill
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
spec:
  policyName: {{ include "compartment.fullname" . }}-organization-quota-namespace-backfill
  validationActions: [Deny]
{{- end }}
