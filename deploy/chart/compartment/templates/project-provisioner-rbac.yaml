{{- if eq .Values.platform.startupStage "full" }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "compartment.projectProvisioningNamespace" . }}
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "compartment.fullname" . }}-project-provisioner
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: compartment-controller
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "secrets", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: compartment-project-bootstrap
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["create"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    resourceNames: ["compartment-controller"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    resourceNames: ["compartment-project-bootstrap"]
    verbs: ["delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["compartment-controller"]
    verbs: ["bind"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    resourceNames: ["compartment-project-bootstrap"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "compartment.fullname" . }}-project-provisioner
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "compartment.fullname" . }}-project-provisioner
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "compartment.fullname" . }}-project-provisioner
subjects:
  - kind: ServiceAccount
    name: {{ include "compartment.fullname" . }}-project-provisioner
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "compartment.fullname" . }}-project-provisioning-job
  namespace: {{ include "compartment.projectProvisioningNamespace" . }}
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts", "secrets"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "compartment.fullname" . }}-project-provisioning-job
  namespace: {{ include "compartment.projectProvisioningNamespace" . }}
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "compartment.fullname" . }}-project-provisioning-job
subjects:
  - kind: ServiceAccount
    name: {{ include "compartment.fullname" . }}-project-provisioner
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "compartment.fullname" . }}-project-provisioner
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    verbs: ["create"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    resourceNames: ["compartment-project-bootstrap"]
    verbs: ["get", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["compartment-project-bootstrap"]
    verbs: ["bind"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "compartment.fullname" . }}-project-provisioner
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "compartment.fullname" . }}-project-provisioner
subjects:
  - kind: ServiceAccount
    name: {{ include "compartment.fullname" . }}-project-provisioner
    namespace: {{ .Release.Namespace }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "compartment.fullname" . }}-project-bootstrap-boundary
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["namespaces"]
        scope: Cluster
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["rolebindings"]
        scope: Namespaced
  matchConditions:
    - name: bootstrap-identity
      expression: {{ printf "request.userInfo.username.startsWith('system:serviceaccount:%s:cpt-')" (include "compartment.projectProvisioningNamespace" .) | quote }}
  validations:
    - expression: {{ printf "request.resource.resource == 'namespaces' ? request.userInfo.username == 'system:serviceaccount:%s:' + object.metadata.name : request.userInfo.username == 'system:serviceaccount:%s:' + request.namespace" (include "compartment.projectProvisioningNamespace" .) (include "compartment.projectProvisioningNamespace" .) | quote }}
      message: Project bootstrap authority is restricted to its encoded target namespace.
    - expression: "request.resource.resource != 'rolebindings' || (request.operation == 'DELETE' ? request.name == 'compartment-project-bootstrap' : object.metadata.name in ['compartment-project-bootstrap', 'compartment-controller'] && object.roleRef.apiGroup == 'rbac.authorization.k8s.io' && object.roleRef.kind == 'ClusterRole' && object.roleRef.name == 'compartment-controller')"
      message: Project bootstrap authority may manage only canonical controller RoleBindings.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "compartment.fullname" . }}-project-bootstrap-boundary
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
spec:
  policyName: {{ include "compartment.fullname" . }}-project-bootstrap-boundary
  validationActions: [Deny]
{{- end }}
