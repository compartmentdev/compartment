{{- $installState := include "compartment.resolvedInstallState" . | fromYaml -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "compartment.fullname" . }}-postgres
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "compartment.componentLabels" (dict "root" . "component" "postgres") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "compartment.componentLabels" (dict "root" . "component" "api") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "compartment.componentLabels" (dict "root" . "component" "api-migrate") | nindent 14 }}
      ports:
        - {protocol: TCP, port: 5432}
{{ if eq $installState.effective.platform.startupStage "full" }}
{{- $productLogsNamespace := default (printf "%s-observability" (include "compartment.fullname" .)) .Values.productLogs.namespace -}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "compartment.fullname" . }}-api
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "compartment.componentLabels" (dict "root" . "component" "api") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "compartment.componentLabels" (dict "root" . "component" "caddy") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "compartment.componentLabels" (dict "root" . "component" "worker") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "compartment.componentLabels" (dict "root" . "component" "edge") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "compartment.componentLabels" (dict "root" . "component" "project-provisioner") | nindent 14 }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.buildkit.namespace }}
          podSelector:
            matchLabels:
              compartment.dev/job-class: build
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $productLogsNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "compartment.fullname" . }}-log-agent
      ports:
        - {protocol: TCP, port: {{ .Values.ports.api }}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "compartment.fullname" . }}-edge
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "compartment.componentLabels" (dict "root" . "component" "edge") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "compartment.componentLabels" (dict "root" . "component" "caddy") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "compartment.componentLabels" (dict "root" . "component" "api") | nindent 14 }}
      ports:
        - {protocol: TCP, port: {{ .Values.ports.edge }}}
{{- end }}
{{- if eq $installState.effective.platform.startupStage "full" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "compartment.fullname" . }}-platform-metrics
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [api, worker, project-provisioner, edge]
    matchLabels:
      app.kubernetes.io/name: {{ include "compartment.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  {{- if .Values.platformMetrics.enabled }}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.platformMetrics.namespaceSelector | nindent 14 }}
          {{- with .Values.platformMetrics.podSelector }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - {protocol: TCP, port: {{ .Values.ports.metrics }}}
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}
