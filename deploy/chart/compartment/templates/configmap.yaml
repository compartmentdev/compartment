{{- $installState := include "compartment.resolvedInstallState" . | fromYaml -}}
{{- include "compartment.validateInstallValues" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "compartment.fullname" . }}
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
data:
  COMPARTMENT_API_BIND_HOST: "0.0.0.0"
  COMPARTMENT_API_INTERNAL_HOST: {{ include "compartment.apiHost" . | quote }}
  COMPARTMENT_API_PORT: {{ .Values.ports.api | quote }}
  COMPARTMENT_ARTIFACT_REGISTRY_HOST: {{ $installState.effective.registry.hostname | quote }}
  COMPARTMENT_ARTIFACT_REGISTRY_PORT: "443"
  COMPARTMENT_ARTIFACT_REGISTRY_INTERNAL_HOST: {{ printf "%s:%v" (include "compartment.registryAuthHost" .) .Values.ports.registryInternal | quote }}
  COMPARTMENT_ARTIFACT_REGISTRY_INTERNAL_URL: {{ printf "http://%s:%v" (include "compartment.registryAuthHost" .) .Values.ports.registryInternal | quote }}
  COMPARTMENT_BASE_DOMAIN: {{ $installState.effective.platform.baseDomain | quote }}
  COMPARTMENT_TLS_MODE: {{ $installState.effective.platform.tlsMode }}
  COMPARTMENT_CADDY_HTTP_PORT: {{ .Values.ports.http | quote }}
  COMPARTMENT_DEPLOYMENT_INFRASTRUCTURE_TIMEOUT_MS: {{ .Values.worker.deploymentInfrastructureTimeoutMs | quote }}
  COMPARTMENT_EDGE_BIND_HOST: "0.0.0.0"
  COMPARTMENT_EDGE_INTERNAL_HOST: {{ printf "%s-edge" (include "compartment.fullname" .) | quote }}
  COMPARTMENT_EDGE_PORT: {{ .Values.ports.edge | quote }}
  COMPARTMENT_EDGE_REPLICA_COUNT: {{ .Values.edge.replicas | quote }}
  COMPARTMENT_ENV: self-hosted
  COMPARTMENT_INSTALLATION_ID: {{ $installState.effective.platform.installationId | quote }}
  COMPARTMENT_LOG_LEVEL: {{ .Values.platform.logLevel | quote }}
  COMPARTMENT_API_METRICS_PORT: {{ .Values.ports.metrics | quote }}
  COMPARTMENT_WORKER_METRICS_PORT: {{ .Values.ports.metrics | quote }}
  COMPARTMENT_EDGE_METRICS_PORT: {{ .Values.ports.metrics | quote }}
  COMPARTMENT_PROJECT_PROVISIONER_METRICS_PORT: {{ .Values.ports.metrics | quote }}
  COMPARTMENT_PUBLIC_PROTOCOL: {{ $installState.effective.platform.publicProtocol | quote }}
  COMPARTMENT_PUBLIC_HTTP_PORT: "80"
  COMPARTMENT_PUBLIC_HTTPS_PORT: "443"
  COMPARTMENT_TRUSTED_OUTBOUND_HOSTS: {{ .Values.platform.trustedOutboundHosts | quote }}
  COMPARTMENT_WORKER_POLL_INTERVAL_MS: {{ .Values.platform.workerPollIntervalMs | quote }}
  COMPARTMENT_LEADER_ELECTION_LEASE_DURATION_MS: {{ .Values.leaderElection.leaseDurationMs | quote }}
  COMPARTMENT_LEADER_ELECTION_RENEW_DEADLINE_MS: {{ .Values.leaderElection.renewDeadlineMs | quote }}
  COMPARTMENT_LEADER_ELECTION_RETRY_PERIOD_MS: {{ .Values.leaderElection.retryPeriodMs | quote }}
  COMPARTMENT_USAGE_METERING_INTERVAL_MS: {{ .Values.platform.usageMeteringIntervalMs | quote }}
  COMPARTMENT_BUILDKIT_DATA_SIZE_LIMIT: {{ .Values.buildkit.dataSizeLimit | quote }}
  COMPARTMENT_BUILDKIT_GC_KEEP_STORAGE_MB: {{ .Values.buildkit.gcKeepStorageMb | quote }}
  COMPARTMENT_BUILDKIT_CONFIG_MAP_NAME: {{ printf "%s-buildkit" (include "compartment.fullname" .) | quote }}
  COMPARTMENT_BUILDKIT_RESOURCES: {{ .Values.resources.buildkit | toJson | quote }}
  COMPARTMENT_PROJECT_CONTAINER_DEFAULTS: {{ .Values.resources.projectContainerDefaults | toJson | quote }}
  COMPARTMENT_PROJECT_QUOTA: {{ .Values.resources.projectQuota | toJson | quote }}
  COMPARTMENT_ORGANIZATION_QUOTA: {{ .Values.resources.organizationQuota | toJson | quote }}
  COMPARTMENT_BUILD_NAMESPACE: {{ .Values.buildkit.namespace | quote }}
  COMPARTMENT_WORKER_IMAGE: {{ include "compartment.image" .Values.images.worker | quote }}
  COMPARTMENT_BUILD_RUNNER_RESOURCES: {{ .Values.resources.buildRunner | toJson | quote }}
  COMPARTMENT_BUILD_TIMEOUT_MS: {{ .Values.buildkit.timeoutMs | quote }}
  COMPARTMENT_MAX_CONCURRENT_BUILDS: {{ .Values.buildkit.maximumConcurrentBuilds | quote }}
  COMPARTMENT_MAX_CONCURRENT_BUILDS_PER_ORGANIZATION: {{ .Values.buildkit.maximumConcurrentBuildsPerOrganization | quote }}
  COMPARTMENT_KUBE_BUILD_SCHEDULING: {{ include "compartment.buildSchedulingJson" . | quote }}
  COMPARTMENT_SYSTEM_API_SOCKET: /var/run/compartment/api/system-api.sock
  COMPARTMENT_MANAGED_DOMAIN_BROKER_URL: {{ ternary $installState.effective.platform.managedDomainBrokerUrl "" (not (empty $installState.effective.secrets.managedDomainAcmeDnsToken)) | quote }}
  COMPARTMENT_INGRESS_TARGETS_JSON: {{ $installState.effective.ingress.targetsJson | quote }}
  COMPARTMENT_SOURCE_ARCHIVE_DIR: /var/lib/compartment/source-archives
  COMPARTMENT_SOURCE_ARCHIVE_MAX_BYTES: {{ .Values.platform.sourceArchiveMaxBytes | quote }}
  COMPARTMENT_AUDIT_RETENTION_DAYS: {{ .Values.platform.auditRetentionDays | quote }}
  COMPARTMENT_USAGE_RETENTION_DAYS: {{ .Values.platform.usageRetentionDays | quote }}
  COMPARTMENT_AUDIT_RETENTION_CLEANUP_CRON: {{ .Values.platform.auditCleanupCron | quote }}
  COMPARTMENT_AUDIT_RETENTION_CLEANUP_BATCH_SIZE: {{ .Values.platform.auditCleanupBatchSize | quote }}
  COMPARTMENT_AUDIT_RETENTION_CLEANUP_MAX_BATCHES: {{ .Values.platform.auditCleanupMaxBatches | quote }}
  COMPARTMENT_AUDIT_FILE_SINK_ENABLED: {{ .Values.platform.auditFileSinkEnabled | quote }}
  COMPARTMENT_AUDIT_FILE_SINK_DIR: /var/lib/compartment/audit-logs
  COMPARTMENT_AUDIT_FILE_SINK_ROTATE_INTERVAL: {{ .Values.platform.auditFileSinkRotateInterval | quote }}
  COMPARTMENT_AUDIT_FILE_SINK_ROTATE_SIZE: {{ .Values.platform.auditFileSinkRotateSize | quote }}
  COMPARTMENT_AUDIT_FILE_SINK_RETENTION_FILES: {{ .Values.platform.auditFileSinkRetentionFiles | quote }}
  COMPARTMENT_ROLLBACK_RETENTION_LIMIT: {{ .Values.platform.rollbackRetentionLimit | quote }}
  COMPARTMENT_SESSION_TTL: {{ .Values.platform.sessionTtl | quote }}
  COMPARTMENT_SIGNUP_ENABLED: {{ .Values.platform.signupEnabled | quote }}
  COMPARTMENT_NEW_PROJECTS_PRIVATE_BY_DEFAULT: {{ .Values.platform.newProjectsPrivateByDefault | quote }}
  COMPARTMENT_THROTTLE_AUTH_LOGIN_ROUTE_MAX_REQUESTS: {{ .Values.platform.authThrottle.login.route.limit | quote }}
  COMPARTMENT_THROTTLE_AUTH_LOGIN_ROUTE_WINDOW: {{ .Values.platform.authThrottle.login.route.window | quote }}
  COMPARTMENT_THROTTLE_AUTH_LOGIN_SOURCE_MAX_FAILURES: {{ .Values.platform.authThrottle.login.source.limit | quote }}
  COMPARTMENT_THROTTLE_AUTH_LOGIN_SOURCE_WINDOW: {{ .Values.platform.authThrottle.login.source.window | quote }}
  COMPARTMENT_THROTTLE_AUTH_LOGIN_SOURCE_BLOCK: {{ .Values.platform.authThrottle.login.source.cooldown | quote }}
  COMPARTMENT_THROTTLE_AUTH_LOGIN_ACCOUNT_MAX_FAILURES: {{ .Values.platform.authThrottle.login.account.limit | quote }}
  COMPARTMENT_THROTTLE_AUTH_LOGIN_ACCOUNT_WINDOW: {{ .Values.platform.authThrottle.login.account.window | quote }}
  COMPARTMENT_THROTTLE_AUTH_LOGIN_ACCOUNT_BLOCK: {{ .Values.platform.authThrottle.login.account.cooldown | quote }}
  COMPARTMENT_THROTTLE_AUTH_LOGIN_SOURCE_ACCOUNT_MAX_FAILURES: {{ .Values.platform.authThrottle.login.sourceAccount.limit | quote }}
  COMPARTMENT_THROTTLE_AUTH_LOGIN_SOURCE_ACCOUNT_WINDOW: {{ .Values.platform.authThrottle.login.sourceAccount.window | quote }}
  COMPARTMENT_THROTTLE_AUTH_LOGIN_SOURCE_ACCOUNT_BLOCK: {{ .Values.platform.authThrottle.login.sourceAccount.cooldown | quote }}
  COMPARTMENT_THROTTLE_AUTH_ACTIVATE_ROUTE_MAX_REQUESTS: {{ .Values.platform.authThrottle.activation.route.limit | quote }}
  COMPARTMENT_THROTTLE_AUTH_ACTIVATE_ROUTE_WINDOW: {{ .Values.platform.authThrottle.activation.route.window | quote }}
  COMPARTMENT_THROTTLE_AUTH_ACTIVATE_SOURCE_MAX_FAILURES: {{ .Values.platform.authThrottle.activation.source.limit | quote }}
  COMPARTMENT_THROTTLE_AUTH_ACTIVATE_SOURCE_WINDOW: {{ .Values.platform.authThrottle.activation.source.window | quote }}
  COMPARTMENT_THROTTLE_AUTH_ACTIVATE_SOURCE_BLOCK: {{ .Values.platform.authThrottle.activation.source.cooldown | quote }}
  COMPARTMENT_THROTTLE_AUTH_ACTIVATE_SUBJECT_MAX_FAILURES: {{ .Values.platform.authThrottle.activation.subject.limit | quote }}
  COMPARTMENT_THROTTLE_AUTH_ACTIVATE_SUBJECT_WINDOW: {{ .Values.platform.authThrottle.activation.subject.window | quote }}
  COMPARTMENT_THROTTLE_AUTH_ACTIVATE_SUBJECT_BLOCK: {{ .Values.platform.authThrottle.activation.subject.cooldown | quote }}
  COMPARTMENT_THROTTLE_AUTH_ACTIVATE_SOURCE_SUBJECT_MAX_FAILURES: {{ .Values.platform.authThrottle.activation.sourceSubject.limit | quote }}
  COMPARTMENT_THROTTLE_AUTH_ACTIVATE_SOURCE_SUBJECT_WINDOW: {{ .Values.platform.authThrottle.activation.sourceSubject.window | quote }}
  COMPARTMENT_THROTTLE_AUTH_ACTIVATE_SOURCE_SUBJECT_BLOCK: {{ .Values.platform.authThrottle.activation.sourceSubject.cooldown | quote }}
  COMPARTMENT_THROTTLE_AUTH_RESET_PASSWORD_ROUTE_MAX_REQUESTS: {{ .Values.platform.authThrottle.passwordReset.route.limit | quote }}
  COMPARTMENT_THROTTLE_AUTH_RESET_PASSWORD_ROUTE_WINDOW: {{ .Values.platform.authThrottle.passwordReset.route.window | quote }}
  COMPARTMENT_THROTTLE_AUTH_RESET_PASSWORD_SOURCE_MAX_FAILURES: {{ .Values.platform.authThrottle.passwordReset.source.limit | quote }}
  COMPARTMENT_THROTTLE_AUTH_RESET_PASSWORD_SOURCE_WINDOW: {{ .Values.platform.authThrottle.passwordReset.source.window | quote }}
  COMPARTMENT_THROTTLE_AUTH_RESET_PASSWORD_SOURCE_BLOCK: {{ .Values.platform.authThrottle.passwordReset.source.cooldown | quote }}
  COMPARTMENT_THROTTLE_AUTH_RESET_PASSWORD_SUBJECT_MAX_FAILURES: {{ .Values.platform.authThrottle.passwordReset.subject.limit | quote }}
  COMPARTMENT_THROTTLE_AUTH_RESET_PASSWORD_SUBJECT_WINDOW: {{ .Values.platform.authThrottle.passwordReset.subject.window | quote }}
  COMPARTMENT_THROTTLE_AUTH_RESET_PASSWORD_SUBJECT_BLOCK: {{ .Values.platform.authThrottle.passwordReset.subject.cooldown | quote }}
  COMPARTMENT_THROTTLE_AUTH_RESET_PASSWORD_SOURCE_SUBJECT_MAX_FAILURES: {{ .Values.platform.authThrottle.passwordReset.sourceSubject.limit | quote }}
  COMPARTMENT_THROTTLE_AUTH_RESET_PASSWORD_SOURCE_SUBJECT_WINDOW: {{ .Values.platform.authThrottle.passwordReset.sourceSubject.window | quote }}
  COMPARTMENT_THROTTLE_AUTH_RESET_PASSWORD_SOURCE_SUBJECT_BLOCK: {{ .Values.platform.authThrottle.passwordReset.sourceSubject.cooldown | quote }}
