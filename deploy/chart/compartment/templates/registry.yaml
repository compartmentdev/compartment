apiVersion: v1
kind: Service
metadata:
  name: {{ include "compartment.fullname" . }}-registry
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "compartment.componentLabels" (dict "root" . "component" "registry") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ports.registry }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "compartment.fullname" . }}-registry
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "compartment.componentLabels" (dict "root" . "component" "registry") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "compartment.componentLabels" (dict "root" . "component" "registry") | nindent 8 }}
    spec:
      priorityClassName: {{ include "compartment.platformPriorityClassName" . }}
      {{- include "compartment.dataNodePool" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: registry
          image: {{ include "compartment.image" .Values.images.registry }}
          imagePullPolicy: {{ .Values.images.registry.pullPolicy }}
          securityContext:
            {{- include "compartment.containerSecurityContext" . | nindent 12 }}
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            {{- toYaml .Values.resources.registry | nindent 12 }}
          env:
            - name: REGISTRY_HTTP_ADDR
              value: {{ printf "0.0.0.0:%v" .Values.ports.registry | quote }}
            - name: REGISTRY_HTTP_RELATIVEURLS
              value: "true"
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
            {{- if eq (include "compartment.registryStorageBackend" .) "s3" }}
            - name: REGISTRY_STORAGE
              value: s3
            - name: REGISTRY_STORAGE_S3_BUCKET
              value: {{ .Values.registry.storage.s3.bucket | quote }}
            - name: REGISTRY_STORAGE_S3_REGION
              value: {{ .Values.registry.storage.s3.region | quote }}
            - name: REGISTRY_STORAGE_S3_REGIONENDPOINT
              value: {{ .Values.registry.storage.s3.regionEndpoint | quote }}
            - name: REGISTRY_STORAGE_S3_FORCEPATHSTYLE
              value: {{ .Values.registry.storage.s3.forcePathStyle | quote }}
            - name: REGISTRY_STORAGE_S3_ACCESSKEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.registry.storage.s3.existingSecret }}
                  key: accessKey
            - name: REGISTRY_STORAGE_S3_SECRETKEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.registry.storage.s3.existingSecret }}
                  key: secretKey
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.ports.registry }}
          readinessProbe:
            httpGet:
              path: /v2/
              port: http
            periodSeconds: 2
          volumeMounts:
            {{- if eq (include "compartment.registryStorageBackend" .) "pvc" }}
            - name: data
              mountPath: /var/lib/registry
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- if eq (include "compartment.registryStorageBackend" .) "pvc" }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "compartment.fullname" . }}-registry
        {{- end }}
        - name: tmp
          emptyDir: {}
