{{- $installState := include "compartment.resolvedInstallState" . | fromYaml -}}
{{- if eq $installState.effective.platform.startupStage "full" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "compartment.fullname" . }}-edge
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "compartment.componentLabels" (dict "root" . "component" "edge") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ports.edge }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "compartment.fullname" . }}-edge
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
    app.kubernetes.io/component: edge
spec:
  replicas: {{ .Values.edge.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "compartment.componentLabels" (dict "root" . "component" "edge") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "compartment.componentLabels" (dict "root" . "component" "edge") | nindent 8 }}
      annotations:
        {{- include "compartment.domainRolloutAnnotations" . | nindent 8 }}
    spec:
      topologySpreadConstraints:
        {{- include "compartment.topologySpreadConstraint" (dict "root" . "component" "edge") | nindent 8 }}
      priorityClassName: {{ include "compartment.platformPriorityClassName" . }}
      {{- include "compartment.nodePool" .Values.nodePools.system | nindent 6 }}
      {{- include "compartment.waiterPodSpec" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: snapshots-ownership
          image: {{ include "compartment.image" .Values.images.edge }}
          imagePullPolicy: {{ .Values.images.edge.pullPolicy }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command: ['sh', '-c', 'chown -R 1000:1000 {{ .Values.edge.snapshots.mountPath }}']
          resources:
            {{- toYaml .Values.resources.edgeInit | nindent 12 }}
          volumeMounts:
            - {name: snapshots, mountPath: {{ .Values.edge.snapshots.mountPath | quote }}}
        {{- include "compartment.waitForMigrationInit" . | nindent 8 }}
      containers:
        - name: edge
          image: {{ include "compartment.image" .Values.images.edge }}
          imagePullPolicy: {{ .Values.images.edge.pullPolicy }}
          securityContext:
            {{- include "compartment.containerSecurityContext" . | nindent 12 }}
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            {{- toYaml .Values.resources.edge | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "compartment.fullname" . }}
          env:
            - name: COMPARTMENT_EDGE_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ include "compartment.fullname" . }}, key: edge-token}
            - name: COMPARTMENT_EDGE_SNAPSHOT_PATH
              value: {{ printf "%s/access-state.json" .Values.edge.snapshots.mountPath | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.ports.edge }}
            - name: metrics
              containerPort: {{ .Values.ports.metrics }}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: snapshots, mountPath: {{ .Values.edge.snapshots.mountPath | quote }}}
      volumes:
        {{- include "compartment.kubeApiAccessVolume" . | nindent 8 }}
        - {name: tmp, emptyDir: {}}
        - name: snapshots
          {{- if .Values.edge.snapshots.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "compartment.fullname" . }}-edge-snapshots
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
