{{- $installState := include "compartment.resolvedInstallState" . | fromYaml -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "compartment.fullname" . }}-caddy
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
    app.kubernetes.io/component: caddy
spec:
  type: ClusterIP
  selector:
    {{- include "compartment.componentLabels" (dict "root" . "component" "caddy") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ports.http }}
      targetPort: http
---
{{- if eq $installState.effective.platform.startupStage "full" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "compartment.fullname" . }}-caddy
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
    app.kubernetes.io/component: caddy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "compartment.componentLabels" (dict "root" . "component" "caddy") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "compartment.componentLabels" (dict "root" . "component" "caddy") | nindent 8 }}
      annotations:
        {{- include "compartment.domainRolloutAnnotations" . | nindent 8 }}
    spec:
      priorityClassName: {{ include "compartment.platformPriorityClassName" . }}
      {{- include "compartment.nodePool" .Values.nodePools.system | nindent 6 }}
      {{- include "compartment.waiterPodSpec" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        {{- include "compartment.waitForMigrationInit" . | nindent 8 }}
        - name: prepare-caddy
          image: {{ include "compartment.image" .Values.images.caddy }}
          imagePullPolicy: {{ .Values.images.caddy.pullPolicy }}
          command: ["/bin/sh", "-ec", "cp /usr/bin/caddy /work/caddy && chmod 0755 /work/caddy"]
          securityContext:
            {{- include "compartment.containerSecurityContext" . | nindent 12 }}
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            {{- toYaml .Values.resources.caddyInit | nindent 12 }}
          volumeMounts:
            - {name: executable, mountPath: /work}
      containers:
        - name: caddy
          image: {{ include "compartment.image" .Values.images.caddy }}
          imagePullPolicy: {{ .Values.images.caddy.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - exec /work/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
          securityContext:
            {{- include "compartment.containerSecurityContext" . | nindent 12 }}
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            {{- toYaml .Values.resources.caddy | nindent 12 }}
          env:
            - {name: COMPARTMENT_API_INTERNAL_HOST, value: {{ printf "%s-api" (include "compartment.fullname" .) | quote }}}
            - {name: COMPARTMENT_API_PORT, value: {{ .Values.ports.api | quote }}}
            - {name: COMPARTMENT_BASE_DOMAIN, value: {{ $installState.effective.platform.baseDomain | quote }}}
            - {name: COMPARTMENT_CADDY_HTTP_PORT, value: {{ .Values.ports.http | quote }}}
            - {name: COMPARTMENT_EDGE_INTERNAL_HOST, value: {{ printf "%s-edge" (include "compartment.fullname" .) | quote }}}
            - {name: COMPARTMENT_EDGE_PORT, value: {{ .Values.ports.edge | quote }}}
          ports:
            - {name: http, containerPort: {{ .Values.ports.http }}}
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 2
          volumeMounts:
            - {name: executable, mountPath: /work, readOnly: true}
            - {name: config, mountPath: /config}
            - {name: tmp, mountPath: /tmp}
      volumes:
        {{- include "compartment.kubeApiAccessVolume" . | nindent 8 }}
        - {name: executable, emptyDir: {}}
        - {name: config, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
{{- end }}
