{{- $installState := include "compartment.resolvedInstallState" . | fromYaml -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "compartment.fullname" . }}-caddy
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
    app.kubernetes.io/component: caddy
spec:
  type: ClusterIP
  selector:
    {{- include "compartment.caddyPodLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ports.http }}
      targetPort: http
---
{{- if eq $installState.effective.platform.startupStage "full" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "compartment.fullname" . }}-caddy
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
    app.kubernetes.io/component: caddy
spec:
  replicas: {{ .Values.caddy.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "compartment.caddyPodLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "compartment.caddyPodLabels" . | nindent 8 }}
      annotations:
        {{- include "compartment.domainRolloutAnnotations" . | nindent 8 }}
    spec:
      topologySpreadConstraints:
        {{- include "compartment.topologySpreadConstraint" (dict "root" . "component" "caddy") | nindent 8 }}
      priorityClassName: {{ include "compartment.platformPriorityClassName" . }}
      {{- include "compartment.nodePool" .Values.nodePools.system | nindent 6 }}
      {{- include "compartment.waiterPodSpec" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        {{- include "compartment.waitForMigrationInit" . | nindent 8 }}
        - name: prepare-caddy
          image: {{ include "compartment.image" .Values.images.caddy }}
          imagePullPolicy: {{ .Values.images.caddy.pullPolicy }}
          command: ["/bin/sh", "-ec", "cp /usr/bin/caddy /work/caddy && chmod 0755 /work/caddy"]
          securityContext:
            {{- include "compartment.containerSecurityContext" . | nindent 12 }}
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            {{- toYaml .Values.resources.caddyInit | nindent 12 }}
          volumeMounts:
            - {name: executable, mountPath: /work}
        - name: prove-tenant-path
          image: {{ include "compartment.image" .Values.images.caddy }}
          imagePullPolicy: {{ .Values.images.caddy.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              deadline=$(( $(date +%s) + 300 ))
              while [ "$(date +%s)" -lt "$deadline" ]; do
                if wget -q -T 1 -O /dev/null {{ printf "http://%s.%s.svc/" (include "compartment.caddyReadinessService" .) (include "compartment.caddyReadinessNamespace" .) }}; then
                  if ! wget -q -T 1 -O /dev/null {{ printf "http://%s.%s.svc:81/" (include "compartment.caddyReadinessService" .) (include "compartment.caddyReadinessNamespace" .) }}; then
                    exit 0
                  fi
                  echo 'Caddy tenant-path sentinel is reachable before default-deny enforcement' >&2
                fi
                sleep 2
              done
              echo 'Caddy tenant path was not proven within five minutes; starting anyway' >&2
              exit 0
          securityContext:
            {{- include "compartment.containerSecurityContext" . | nindent 12 }}
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            {{- toYaml .Values.resources.caddyInit | nindent 12 }}
      containers:
        - name: caddy
          image: {{ include "compartment.image" .Values.images.caddy }}
          imagePullPolicy: {{ .Values.images.caddy.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - exec /work/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
          securityContext:
            {{- include "compartment.containerSecurityContext" . | nindent 12 }}
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            {{- toYaml .Values.resources.caddy | nindent 12 }}
          env:
            - {name: COMPARTMENT_API_INTERNAL_HOST, value: {{ printf "%s-api" (include "compartment.fullname" .) | quote }}}
            - {name: COMPARTMENT_API_PORT, value: {{ .Values.ports.api | quote }}}
            - {name: COMPARTMENT_BASE_DOMAIN, value: {{ $installState.effective.platform.baseDomain | quote }}}
            - {name: COMPARTMENT_CADDY_HTTP_PORT, value: {{ .Values.ports.http | quote }}}
            - {name: COMPARTMENT_EDGE_APP_REQUESTS_PER_SECOND, value: {{ .Values.platform.edgeTrafficLimits.app.requestsPerSecond | quote }}}
            - {name: COMPARTMENT_EDGE_APP_BURST, value: {{ .Values.platform.edgeTrafficLimits.app.burst | quote }}}
            - {name: COMPARTMENT_EDGE_APP_IN_FLIGHT, value: {{ .Values.platform.edgeTrafficLimits.app.inFlight | quote }}}
            - {name: COMPARTMENT_EDGE_CLIENT_REQUESTS_PER_SECOND, value: {{ .Values.platform.edgeTrafficLimits.client.requestsPerSecond | quote }}}
            - {name: COMPARTMENT_EDGE_CLIENT_BURST, value: {{ .Values.platform.edgeTrafficLimits.client.burst | quote }}}
            - {name: COMPARTMENT_EDGE_INTERNAL_HOST, value: {{ printf "%s-edge" (include "compartment.fullname" .) | quote }}}
            - {name: COMPARTMENT_EDGE_PORT, value: {{ .Values.ports.edge | quote }}}
            - name: COMPARTMENT_EDGE_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ include "compartment.fullname" . }}, key: edge-token}
            - {name: COMPARTMENT_USAGE_METERING_INTERVAL_MS, value: {{ .Values.platform.usageMeteringIntervalMs | quote }}}
          ports:
            - {name: http, containerPort: {{ .Values.ports.http }}}
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 2
          volumeMounts:
            - {name: executable, mountPath: /work, readOnly: true}
            - {name: config, mountPath: /config}
            - {name: tmp, mountPath: /tmp}
      volumes:
        {{- include "compartment.kubeApiAccessVolume" . | nindent 8 }}
        - {name: executable, emptyDir: {}}
        - {name: config, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
{{- end }}
