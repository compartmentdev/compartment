{{- $installState := include "compartment.resolvedInstallState" . | fromYaml -}}
{{- if eq $installState.effective.platform.startupStage "full" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "compartment.fullname" . }}-worker
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "compartment.componentLabels" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "compartment.componentLabels" (dict "root" . "component" "worker") | nindent 8 }}
      annotations:
        {{- include "compartment.rolloutAnnotations" . | nindent 8 }}
        compartment.dev/tenant-kek-values: {{ printf "%s:%s" .Values.secrets.tenantSecretsKek (.Values.secrets.tenantSecretsPreviousKek | default "") | sha256sum | quote }}
    spec:
      topologySpreadConstraints:
        {{- include "compartment.topologySpreadConstraint" (dict "root" . "component" "worker") | nindent 8 }}
      priorityClassName: {{ include "compartment.platformPriorityClassName" . }}
      {{- include "compartment.nodePool" .Values.nodePools.system | nindent 6 }}
      serviceAccountName: {{ include "compartment.fullname" . }}-worker
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        {{- include "compartment.waitForMigrationInit" . | nindent 8 }}
        {{- include "compartment.waitForApiRolloutInit" . | nindent 8 }}
        {{- include "compartment.waitForApiInit" . | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "compartment.image" .Values.images.worker }}
          imagePullPolicy: {{ .Values.images.worker.pullPolicy }}
          securityContext:
            {{- include "compartment.containerSecurityContext" . | nindent 12 }}
            runAsUser: 10001
            runAsGroup: 10001
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "compartment.fullname" . }}
          ports:
            - name: metrics
              containerPort: {{ .Values.ports.metrics }}
          env:
            - name: COMPARTMENT_LEADER_ELECTION_IDENTITY
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: COMPARTMENT_ARTIFACT_REGISTRY_CREDENTIAL_SIGNING_KEY
              valueFrom:
                secretKeyRef: {name: {{ include "compartment.fullname" . }}-registry-credentials, key: registry-credential-signing-key}
            - name: COMPARTMENT_RUNTIME_CONTROL_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ include "compartment.fullname" . }}, key: runtime-control-token}
            - name: COMPARTMENT_TENANT_SECRETS_KEK
              valueFrom:
                secretKeyRef: {name: {{ include "compartment.fullname" . }}, key: tenant-secrets-kek}
            - name: COMPARTMENT_TENANT_SECRETS_PREVIOUS_KEK
              valueFrom:
                secretKeyRef: {name: {{ include "compartment.fullname" . }}, key: tenant-secrets-previous-kek}
            - {name: COMPARTMENT_EDGE_NAMESPACE, value: {{ .Release.Namespace | quote }}}
            - {name: COMPARTMENT_EDGE_POD_LABELS, value: {{ include "compartment.caddyPodLabelsJson" . | quote }}}
            - {name: COMPARTMENT_PLATFORM_NAMESPACE, value: {{ .Release.Namespace | quote }}}
            - {name: COMPARTMENT_DEPLOYMENT_INFRASTRUCTURE_TIMEOUT_MS, value: {{ .Values.worker.deploymentInfrastructureTimeoutMs | quote }}}
            - {name: COMPARTMENT_CADDY_SERVICE_NAME, value: {{ printf "%s-caddy" (include "compartment.fullname" .) | quote }}}
            - {name: COMPARTMENT_INGRESS_CLASS_NAME, value: {{ $installState.effective.ingress.className | quote }}}
            - {name: COMPARTMENT_TLS_ISSUER_KIND, value: {{ include "compartment.customDomainIssuerKind" . | quote }}}
            - {name: COMPARTMENT_TLS_ISSUER_NAME, value: {{ include "compartment.customDomainIssuerName" . | quote }}}
            - {name: COMPARTMENT_KUBE_POD_CIDR, value: {{ .Values.buildkit.podCidr | quote }}}
            - {name: COMPARTMENT_KUBE_SERVICE_CIDR, value: {{ .Values.buildkit.serviceCidr | quote }}}
            - {name: COMPARTMENT_KUBE_DATA_SCHEDULING, value: {{ include "compartment.dataSchedulingJson" . | quote }}}
            {{- with include "compartment.tenantSchedulingJson" . }}
            - {name: COMPARTMENT_KUBE_TENANT_SCHEDULING, value: {{ . | quote }}}
            {{- end }}
          volumeMounts:
            - {name: kube-api-access, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        {{- include "compartment.kubeApiAccessVolume" . | nindent 8 }}
        - {name: tmp, emptyDir: {}}
{{- end }}
