{{- $installState := include "compartment.resolvedInstallState" . | fromYaml -}}
{{- $registry := $installState.effective.registry -}}
{{- $registryIssuerRef := $installState.effective.registryIssuerRef -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "compartment.fullname" . }}-registry-auth
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
  annotations:
    {{- include "compartment.retainedResourceAnnotations" . | nindent 4 }}
spec:
  {{- if not (empty .Values.registry.clusterIP) }}
  clusterIP: {{ .Values.registry.clusterIP | quote }}
  {{- end }}
  selector:
    {{- include "compartment.componentLabels" (dict "root" . "component" "registry-auth") | nindent 4 }}
  ports:
    - name: https
      port: 443
      targetPort: https
    - name: http-internal
      port: {{ .Values.ports.registryInternal }}
      targetPort: http-internal
{{- if and (eq $installState.effective.platform.startupStage "full") (not (empty $registry.hostname)) (not (empty $registryIssuerRef.name)) }}
---
{{- $fullname := include "compartment.fullname" . -}}
{{- include "compartment.certManagerCertificate" (dict
  "root" .
  "name" (printf "%s-registry" $fullname)
  "secretName" (printf "%s-registry-tls" $fullname)
  "issuerRef" $registryIssuerRef
  "host" $registry.hostname
) }}
{{- end }}
{{- if eq $installState.effective.platform.startupStage "full" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "compartment.fullname" . }}-registry-auth
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "compartment.componentLabels" (dict "root" . "component" "registry-auth") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "compartment.componentLabels" (dict "root" . "component" "registry-auth") | nindent 8 }}
      annotations:
        {{- include "compartment.rolloutAnnotations" . | nindent 8 }}
    spec:
      {{- include "compartment.waiterPodSpec" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        {{- include "compartment.waitForMigrationInit" . | nindent 8 }}
      containers:
        - name: registry-auth
          image: {{ include "compartment.image" .Values.images.worker }}
          imagePullPolicy: {{ .Values.images.worker.pullPolicy }}
          command: ["node", "dist/registry-auth-proxy.js"]
          securityContext:
            {{- include "compartment.containerSecurityContext" . | nindent 12 }}
            runAsUser: 10001
            runAsGroup: 10001
          resources:
            {{- toYaml .Values.resources.registryAuth | nindent 12 }}
          env:
            - name: COMPARTMENT_ARTIFACT_REGISTRY_PROXY_BIND_HOST
              value: "0.0.0.0"
            - name: COMPARTMENT_ARTIFACT_REGISTRY_PROXY_PORT
              value: {{ .Values.ports.registry | quote }}
            - name: COMPARTMENT_ARTIFACT_REGISTRY_PROXY_INTERNAL_PORT
              value: {{ .Values.ports.registryInternal | quote }}
            - name: COMPARTMENT_ARTIFACT_REGISTRY_PROXY_TARGET_URL
              value: {{ printf "http://%s-registry:%v" (include "compartment.fullname" .) .Values.ports.registry | quote }}
            - name: COMPARTMENT_ARTIFACT_REGISTRY_CREDENTIAL_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "compartment.fullname" . }}-registry-credentials
                  key: registry-credential-signing-key
            - name: COMPARTMENT_ARTIFACT_REGISTRY_TLS_CERTIFICATE_FILE
              value: /tls/tls.crt
            - name: COMPARTMENT_ARTIFACT_REGISTRY_TLS_PRIVATE_KEY_FILE
              value: /tls/tls.key
          ports:
            - name: https
              containerPort: {{ .Values.ports.registry }}
            - name: http-internal
              containerPort: {{ .Values.ports.registryInternal }}
          readinessProbe:
            tcpSocket:
              port: https
            periodSeconds: 2
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- include "compartment.kubeApiAccessVolume" . | nindent 8 }}
        - name: tls
          secret:
            secretName: {{ include "compartment.fullname" . }}-registry-tls
        - name: tmp
          emptyDir: {}
{{- end }}
