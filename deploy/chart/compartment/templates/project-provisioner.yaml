{{- if eq .Values.platform.startupStage "full" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "compartment.fullname" . }}-project-provisioner
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
    app.kubernetes.io/component: project-provisioner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "compartment.componentLabels" (dict "root" . "component" "project-provisioner") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "compartment.componentLabels" (dict "root" . "component" "project-provisioner") | nindent 8 }}
      annotations:
        {{- include "compartment.rolloutAnnotations" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "compartment.fullname" . }}-project-provisioner
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        {{- include "compartment.waitForMigrationInit" . | nindent 8 }}
        {{- include "compartment.waitForApiRolloutInit" . | nindent 8 }}
        {{- include "compartment.waitForApiInit" . | nindent 8 }}
      containers:
        - name: project-provisioner
          image: {{ include "compartment.image" .Values.images.worker }}
          imagePullPolicy: {{ .Values.images.worker.pullPolicy }}
          command: ["node", "dist/project-provisioner-server.js"]
          securityContext:
            {{- include "compartment.containerSecurityContext" . | nindent 12 }}
            runAsUser: 10001
            runAsGroup: 10001
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "compartment.fullname" . }}
          env:
            - name: COMPARTMENT_ARTIFACT_REGISTRY_READ_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ include "compartment.fullname" . }}, key: registry-read-password}
            - name: COMPARTMENT_ARTIFACT_REGISTRY_WRITE_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ include "compartment.fullname" . }}, key: registry-write-password}
            - name: COMPARTMENT_RUNTIME_CONTROL_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ include "compartment.fullname" . }}, key: runtime-control-token}
            - {name: COMPARTMENT_EDGE_NAMESPACE, value: {{ .Release.Namespace | quote }}}
            - {name: COMPARTMENT_KUBE_POD_CIDR, value: {{ .Values.buildkit.podCidr | quote }}}
            - {name: COMPARTMENT_KUBE_SERVICE_CIDR, value: {{ .Values.buildkit.serviceCidr | quote }}}
            - {name: COMPARTMENT_PLATFORM_NAMESPACE, value: {{ .Release.Namespace | quote }}}
            - {name: COMPARTMENT_PROVISIONING_NAMESPACE, value: {{ include "compartment.projectProvisioningNamespace" . | quote }}}
            - {name: COMPARTMENT_PROJECT_PROVISIONER_IMAGE, value: {{ include "compartment.image" .Values.images.worker | quote }}}
            - {name: COMPARTMENT_WORKER_SERVICE_ACCOUNT_NAME, value: {{ printf "%s-worker" (include "compartment.fullname" .) | quote }}}
          volumeMounts:
            - {name: kube-api-access, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        {{- include "compartment.kubeApiAccessVolume" . | nindent 8 }}
        - {name: tmp, emptyDir: {}}
{{- end }}
