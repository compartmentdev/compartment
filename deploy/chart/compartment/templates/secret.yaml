{{- $name := include "compartment.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $data := dict -}}
{{- if and $existing $existing.data -}}
{{- $data = $existing.data -}}
{{- end -}}
{{- $postgresPassword := default (default (sha256sum (randAlphaNum 64)) (dig "postgres-password" "" $data | b64dec)) .Values.secrets.postgresPassword -}}
{{- $registryReadPassword := default (default (sha256sum (randAlphaNum 64)) (dig "registry-read-password" "" $data | b64dec)) .Values.secrets.registryReadPassword -}}
{{- $registryWritePassword := default (default (sha256sum (randAlphaNum 64)) (dig "registry-write-password" "" $data | b64dec)) .Values.secrets.registryWritePassword -}}
{{- $edgeToken := default (default (sha256sum (randAlphaNum 64)) (dig "edge-token" "" $data | b64dec)) .Values.secrets.edgeToken -}}
{{- $productLogIngestToken := default (default (sha256sum (randAlphaNum 64)) (dig "product-log-ingest-token" "" $data | b64dec)) .Values.secrets.productLogIngestToken -}}
{{- $runtimeControlToken := default (default (sha256sum (randAlphaNum 64)) (dig "runtime-control-token" "" $data | b64dec)) .Values.secrets.runtimeControlToken -}}
{{- $sessionSecret := default (default (sha256sum (randAlphaNum 64)) (dig "session-secret" "" $data | b64dec)) .Values.secrets.sessionSecret -}}
{{- $systemToken := default (default (sha256sum (randAlphaNum 64)) (dig "system-token" "" $data | b64dec)) .Values.secrets.systemToken -}}
{{- $variablesMasterKey := default (default (sha256sum (randAlphaNum 64)) (dig "variables-master-key" "" $data | b64dec)) .Values.secrets.variablesMasterKey -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ $postgresPassword | quote }}
  database-url: {{ printf "postgresql://%s:%s@%s-postgres:5432/%s" (.Values.postgres.username | urlquery | replace "+" "%20") ($postgresPassword | urlquery | replace "+" "%20") $name (.Values.postgres.database | urlquery | replace "+" "%20") | quote }}
  registry-read-password: {{ $registryReadPassword | quote }}
  registry-write-password: {{ $registryWritePassword | quote }}
  edge-token: {{ $edgeToken | quote }}
  product-log-ingest-token: {{ $productLogIngestToken | quote }}
  runtime-control-token: {{ $runtimeControlToken | quote }}
  session-secret: {{ $sessionSecret | quote }}
  system-token: {{ $systemToken | quote }}
  variables-master-key: {{ $variablesMasterKey | quote }}
