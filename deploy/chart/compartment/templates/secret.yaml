{{- $name := include "compartment.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $data := dict -}}
{{- if and $existing $existing.data -}}
{{- $data = $existing.data -}}
{{- end -}}
{{- $postgresPassword := include "compartment.persistedSecretValue" (dict "data" $data "secretKey" "postgres-password" "fallback" (sha256sum (randAlphaNum 64)) "override" .Values.secrets.postgresPassword) -}}
{{- $edgeToken := include "compartment.persistedSecretValue" (dict "data" $data "secretKey" "edge-token" "fallback" (sha256sum (randAlphaNum 64)) "override" .Values.secrets.edgeToken) -}}
{{- $installToken := include "compartment.persistedSecretValue" (dict "data" $data "secretKey" "install-token" "fallback" (sha256sum (randAlphaNum 64)) "override" .Values.secrets.installToken) -}}
{{- $productLogIngestToken := include "compartment.persistedSecretValue" (dict "data" $data "secretKey" "product-log-ingest-token" "fallback" (sha256sum (randAlphaNum 64)) "override" .Values.secrets.productLogIngestToken) -}}
{{- $runtimeControlToken := include "compartment.persistedSecretValue" (dict "data" $data "secretKey" "runtime-control-token" "fallback" (sha256sum (randAlphaNum 64)) "override" .Values.secrets.runtimeControlToken) -}}
{{- $sessionSecret := include "compartment.persistedSecretValue" (dict "data" $data "secretKey" "session-secret" "fallback" (sha256sum (randAlphaNum 64)) "override" .Values.secrets.sessionSecret) -}}
{{- $systemToken := include "compartment.persistedSecretValue" (dict "data" $data "secretKey" "system-token" "fallback" (sha256sum (randAlphaNum 64)) "override" .Values.secrets.systemToken) -}}
{{- $variablesMasterKey := include "compartment.persistedSecretValue" (dict "data" $data "secretKey" "variables-master-key" "fallback" (sha256sum (randAlphaNum 64)) "override" .Values.secrets.variablesMasterKey) -}}
{{- $existingTenantSecretsKek := dig "tenant-secrets-kek" "" $data | b64dec -}}
{{- $tenantSecretsKek := default (default (sha256sum (randAlphaNum 64)) $existingTenantSecretsKek) .Values.secrets.tenantSecretsKek -}}
{{- $previousTenantSecretsKek := dig "tenant-secrets-previous-kek" "" $data | b64dec -}}
{{- if empty $existingTenantSecretsKek -}}
{{- $previousTenantSecretsKek = $variablesMasterKey -}}
{{- else if ne $tenantSecretsKek $existingTenantSecretsKek -}}
{{- $previousTenantSecretsKek = $existingTenantSecretsKek -}}
{{- else if ne .Values.secrets.tenantSecretsPreviousKek nil -}}
{{- if or (empty .Values.secrets.tenantSecretsPreviousKek) (ne .Values.secrets.tenantSecretsPreviousKek $tenantSecretsKek) -}}
{{- $previousTenantSecretsKek = .Values.secrets.tenantSecretsPreviousKek -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.postgres.external.enabled }}
  postgres-password: {{ $postgresPassword | quote }}
  database-url: {{ printf "postgresql://%s:%s@%s-postgres:5432/%s" (.Values.postgres.username | urlquery | replace "+" "%20") ($postgresPassword | urlquery | replace "+" "%20") $name (.Values.postgres.database | urlquery | replace "+" "%20") | quote }}
  {{- end }}
  edge-token: {{ $edgeToken | quote }}
  install-token: {{ $installToken | quote }}
  product-log-ingest-token: {{ $productLogIngestToken | quote }}
  runtime-control-token: {{ $runtimeControlToken | quote }}
  session-secret: {{ $sessionSecret | quote }}
  system-token: {{ $systemToken | quote }}
  tenant-secrets-kek: {{ $tenantSecretsKek | quote }}
  tenant-secrets-previous-kek: {{ $previousTenantSecretsKek | quote }}
  variables-master-key: {{ $variablesMasterKey | quote }}
