{{- $installState := include "compartment.resolvedInstallState" . | fromYaml -}}
{{- if and .Values.buildkit.enabled (eq $installState.effective.platform.startupStage "full") }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.buildkit.namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "compartment.fullname" . }}-build-controller
  namespace: {{ .Values.buildkit.namespace }}
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "compartment.fullname" . }}-build-controller
  namespace: {{ .Values.buildkit.namespace }}
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "compartment.fullname" . }}-build-controller
subjects:
  - kind: ServiceAccount
    name: {{ include "compartment.fullname" . }}-worker
    namespace: {{ .Release.Namespace }}
{{- end }}
