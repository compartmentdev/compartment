{{- $installState := include "compartment.resolvedInstallState" . | fromYaml -}}
{{- if and .Values.buildkit.enabled (eq $installState.effective.platform.startupStage "full") }}
{{- $workerImage := include "compartment.image" .Values.images.worker -}}
{{- $buildkitGcKeepStorage := printf "%v" .Values.buildkit.gcKeepStorageMb -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.buildkit.namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "compartment.fullname" . }}-build
  namespace: {{ .Values.buildkit.namespace }}
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
spec:
  hard:
    limits.cpu: {{ .Values.buildkit.resourceQuota.limits.cpu | quote }}
    limits.memory: {{ .Values.buildkit.resourceQuota.limits.memory | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "compartment.fullname" . }}-build-controller
  namespace: {{ .Values.buildkit.namespace }}
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "compartment.fullname" . }}-build-controller
  namespace: {{ .Values.buildkit.namespace }}
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "compartment.fullname" . }}-build-controller
subjects:
  - kind: ServiceAccount
    name: {{ include "compartment.fullname" . }}-worker
    namespace: {{ .Release.Namespace }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "compartment.fullname" . }}-build-sandbox
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs"]
        scope: Namespaced
  matchConditions:
    - name: platform-worker
      expression: {{ printf "request.namespace == '%s' && request.userInfo.username == 'system:serviceaccount:%s:%s-worker'" .Values.buildkit.namespace .Release.Namespace (include "compartment.fullname" .) | quote }}
  validations:
    - expression: {{ printf "has(object.metadata.labels) && object.metadata.labels['compartment.dev/job-class'] == 'build' && has(object.spec.template.metadata.labels) && object.spec.template.metadata.labels['compartment.dev/job-class'] == 'build' && object.spec.template.spec.runtimeClassName == '%s'" .Values.sandboxRuntime.runtimeClassName | quote }}
      message: Build Jobs must use the configured gVisor RuntimeClass and canonical build label.
    - expression: "has(object.spec.template.metadata.annotations) && object.spec.template.metadata.annotations.all(key, key == 'compartment.dev/secret-checksum' || key in ['dev.gvisor.spec.mount.buildkit-data.options', 'dev.gvisor.spec.mount.buildkit-data.share', 'dev.gvisor.spec.mount.buildkit-data.type', 'dev.gvisor.spec.mount.buildkit-run.options', 'dev.gvisor.spec.mount.buildkit-run.share', 'dev.gvisor.spec.mount.buildkit-run.type', 'dev.gvisor.spec.mount.buildkit-tmp.options', 'dev.gvisor.spec.mount.buildkit-tmp.share', 'dev.gvisor.spec.mount.buildkit-tmp.type', 'dev.gvisor.spec.mount.tmp.options', 'dev.gvisor.spec.mount.tmp.share', 'dev.gvisor.spec.mount.tmp.type']) && 'compartment.dev/secret-checksum' in object.spec.template.metadata.annotations && object.spec.template.metadata.annotations['compartment.dev/secret-checksum'] != '' && object.spec.template.metadata.annotations['dev.gvisor.spec.mount.buildkit-data.options'] == 'rw,rprivate' && object.spec.template.metadata.annotations['dev.gvisor.spec.mount.buildkit-data.share'] == 'container' && object.spec.template.metadata.annotations['dev.gvisor.spec.mount.buildkit-data.type'] == 'tmpfs' && object.spec.template.metadata.annotations['dev.gvisor.spec.mount.buildkit-run.options'] == 'rw,rprivate' && object.spec.template.metadata.annotations['dev.gvisor.spec.mount.buildkit-run.share'] == 'container' && object.spec.template.metadata.annotations['dev.gvisor.spec.mount.buildkit-run.type'] == 'tmpfs' && object.spec.template.metadata.annotations['dev.gvisor.spec.mount.buildkit-tmp.options'] == 'rw,rprivate' && object.spec.template.metadata.annotations['dev.gvisor.spec.mount.buildkit-tmp.share'] == 'container' && object.spec.template.metadata.annotations['dev.gvisor.spec.mount.buildkit-tmp.type'] == 'tmpfs' && object.spec.template.metadata.annotations['dev.gvisor.spec.mount.tmp.options'] == 'rw,rprivate' && object.spec.template.metadata.annotations['dev.gvisor.spec.mount.tmp.share'] == 'container' && object.spec.template.metadata.annotations['dev.gvisor.spec.mount.tmp.type'] == 'tmpfs'"
      message: Build Jobs must use only the exact tested gVisor tmpfs mount hints.
    - expression: "object.spec.template.spec.automountServiceAccountToken == false && !has(object.spec.template.spec.hostNetwork) && !has(object.spec.template.spec.hostPID) && !has(object.spec.template.spec.hostIPC) && !has(object.spec.template.spec.shareProcessNamespace) && !has(object.spec.template.spec.nodeName)"
      message: Build Jobs must not use host namespaces, direct node placement, or service-account tokens.
    - expression: "has(object.spec.template.spec.securityContext) && has(object.spec.template.spec.securityContext.seccompProfile) && object.spec.template.spec.securityContext.seccompProfile.type == 'RuntimeDefault'"
      message: Build Jobs must use the RuntimeDefault seccomp profile.
    - expression: "has(object.spec.template.spec.volumes) && object.spec.template.spec.volumes.size() == 5"
      message: Build Jobs must use exactly five volumes.
    - expression: "object.spec.template.spec.volumes.all(volume, has(volume.emptyDir) || (volume.name == 'buildkit-config' && has(volume.configMap) && volume.configMap.name == '{{ include "compartment.fullname" . }}-buildkit'))"
      message: Build Jobs may use only bounded emptyDir volumes and the platform BuildKit ConfigMap.
    - expression: "object.spec.template.spec.volumes.exists(volume, volume.name == 'buildkit-data' && quantity(volume.emptyDir.sizeLimit).compareTo(quantity('2Gi')) == 0)"
      message: Build Jobs must use a 2Gi buildkit-data emptyDir.
    - expression: "object.spec.template.spec.volumes.exists(volume, volume.name == 'buildkit-run' && quantity(volume.emptyDir.sizeLimit).compareTo(quantity('128Mi')) == 0)"
      message: Build Jobs must use a 128Mi buildkit-run emptyDir.
    - expression: "object.spec.template.spec.volumes.exists(volume, volume.name == 'buildkit-tmp' && quantity(volume.emptyDir.sizeLimit).compareTo(quantity('512Mi')) == 0)"
      message: Build Jobs must use a 512Mi buildkit-tmp emptyDir.
    - expression: "object.spec.template.spec.volumes.exists(volume, volume.name == 'tmp' && quantity(volume.emptyDir.sizeLimit).compareTo(quantity('384Mi')) == 0)"
      message: Build Jobs must use a 384Mi runner tmp emptyDir.
    - expression: {{ printf "object.spec.template.spec.containers.size() == 1 && object.spec.template.spec.containers.all(container, container.name == 'job' && container.image == '%s' && container.command == ['node', 'dist/build-job.js'] && !has(container.args) && !has(container.ports) && has(container.securityContext) && !has(container.securityContext.procMount) && !has(container.securityContext.appArmorProfile) && (!has(container.securityContext.seccompProfile) || container.securityContext.seccompProfile.type == 'RuntimeDefault') && container.securityContext.privileged == false && container.securityContext.allowPrivilegeEscalation == false && container.securityContext.readOnlyRootFilesystem == true && container.securityContext.runAsNonRoot == true && container.securityContext.runAsUser == 10001 && container.securityContext.runAsGroup == 10001 && has(container.securityContext.capabilities) && container.securityContext.capabilities.drop == ['ALL'] && (!has(container.securityContext.capabilities.add) || container.securityContext.capabilities.add.size() == 0) && has(container.volumeMounts) && container.volumeMounts.size() == 1 && container.volumeMounts.all(mount, mount.name == 'tmp' && mount.mountPath == '/tmp' && !has(mount.subPath) && !has(mount.subPathExpr)))" $workerImage | quote }}
      message: Build runner containers must remain nonroot, read-only, nonprivileged, and capability-free.
    - expression: "object.spec.template.spec.containers.all(container, !has(container.envFrom) && has(container.env) && container.env.all(env, env.name in ['BUILDKIT_ADDR', 'COMPARTMENT_BUILD_JOB_INPUT', 'COMPARTMENT_BUILD_JOB_SOURCE_ARCHIVE_CREDENTIAL', 'TMPDIR'] && !has(env.value) && has(env.valueFrom) && has(env.valueFrom.secretKeyRef)))"
      message: Build runner containers may carry only the scoped build Job environment, projected from Secret keys.
    - expression: {{ printf "has(object.spec.template.spec.initContainers) && object.spec.template.spec.initContainers.size() == 1 && object.spec.template.spec.initContainers.all(container, container.name == 'buildkit' && container.image == '%s' && container.command == ['/usr/local/bin/buildkitd'] && container.args == ['--addr', 'tcp://127.0.0.1:1234', '--config', '/etc/buildkit/buildkitd.toml', '--oci-worker=true', '--oci-worker-binary=/usr/local/bin/buildkit-runc-gvisor', '--oci-worker-gc-keepstorage', '%s'] && container.restartPolicy == 'Always' && !has(container.ports) && !has(container.envFrom) && container.env.size() == 2 && container.env.exists(env, env.name == 'HOME' && env.value == '/tmp') && container.env.exists(env, env.name == 'TMPDIR' && env.value == '/buildkit-tmp') && has(container.securityContext) && !has(container.securityContext.procMount) && !has(container.securityContext.appArmorProfile) && (!has(container.securityContext.seccompProfile) || container.securityContext.seccompProfile.type == 'RuntimeDefault') && container.securityContext.privileged == false && container.securityContext.allowPrivilegeEscalation == false && container.securityContext.readOnlyRootFilesystem == true && container.securityContext.runAsUser == 0 && container.securityContext.runAsGroup == 0 && has(container.securityContext.capabilities) && container.securityContext.capabilities.drop == ['ALL'] && container.securityContext.capabilities.add.size() == 15 && container.securityContext.capabilities.add.all(capability, capability in ['AUDIT_WRITE', 'CHOWN', 'DAC_OVERRIDE', 'FOWNER', 'FSETID', 'KILL', 'MKNOD', 'NET_BIND_SERVICE', 'NET_RAW', 'SETFCAP', 'SETGID', 'SETPCAP', 'SETUID', 'SYS_ADMIN', 'SYS_CHROOT']) && has(container.volumeMounts) && container.volumeMounts.size() == 4 && container.volumeMounts.exists(mount, mount.name == 'buildkit-data' && mount.mountPath == '/var/lib/buildkit' && !has(mount.subPath) && !has(mount.subPathExpr)) && container.volumeMounts.exists(mount, mount.name == 'buildkit-run' && mount.mountPath == '/run' && !has(mount.subPath) && !has(mount.subPathExpr)) && container.volumeMounts.exists(mount, mount.name == 'buildkit-tmp' && mount.mountPath == '/buildkit-tmp' && !has(mount.subPath) && !has(mount.subPathExpr)) && container.volumeMounts.exists(mount, mount.name == 'buildkit-config' && mount.mountPath == '/etc/buildkit/buildkitd.toml' && mount.readOnly == true && mount.subPath == 'buildkitd.toml' && !has(mount.subPathExpr)))" $workerImage $buildkitGcKeepStorage | quote }}
      message: BuildKit sidecars must retain the tested, exact Sentry-confined capability contract.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "compartment.fullname" . }}-build-sandbox
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
spec:
  policyName: {{ include "compartment.fullname" . }}-build-sandbox
  validationActions: [Deny]
{{- end }}
