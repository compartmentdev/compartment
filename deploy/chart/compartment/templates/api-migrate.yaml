{{- $installState := include "compartment.resolvedInstallState" . | fromYaml -}}
{{- if eq $installState.effective.platform.startupStage "full" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "compartment.fullname" . }}-api-migrate-{{ .Release.Revision }}
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-migrate
spec:
  backoffLimit: 12
  template:
    metadata:
      labels:
        {{- include "compartment.componentLabels" (dict "root" . "component" "api-migrate") | nindent 8 }}
    spec:
      priorityClassName: {{ include "compartment.platformPriorityClassName" . }}
      {{- include "compartment.nodePool" .Values.nodePools.system | nindent 6 }}
      {{- include "compartment.waiterPodSpec" . | nindent 6 }}
      restartPolicy: OnFailure
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        {{- include "compartment.waitForFoundationInit" . | nindent 8 }}
      containers:
        - name: api-migrate
          image: {{ include "compartment.image" .Values.images.api }}
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          command: ["node", "dist/db/migrate.js"]
          securityContext:
            {{- include "compartment.containerSecurityContext" . | nindent 12 }}
            runAsUser: 10001
            runAsGroup: 10001
          resources:
            {{- toYaml .Values.resources.apiMigrate | nindent 12 }}
          env:
            - name: COMPARTMENT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "compartment.fullname" . }}
                  key: database-url
            - name: COMPARTMENT_TENANT_SECRETS_KEK
              valueFrom:
                secretKeyRef: {name: {{ include "compartment.fullname" . }}, key: tenant-secrets-kek}
            - name: COMPARTMENT_TENANT_SECRETS_PREVIOUS_KEK
              valueFrom:
                secretKeyRef: {name: {{ include "compartment.fullname" . }}, key: tenant-secrets-previous-kek}
            - name: COMPARTMENT_VARIABLES_MASTER_KEY
              valueFrom:
                secretKeyRef: {name: {{ include "compartment.fullname" . }}, key: variables-master-key}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- include "compartment.kubeApiAccessVolume" . | nindent 8 }}
        - name: tmp
          emptyDir: {}
{{- end }}
