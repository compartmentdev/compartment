{{- $installState := include "compartment.resolvedInstallState" . | fromYaml -}}
{{- if and .Values.buildkit.enabled (not .Values.dockerHubCache.enabled) (eq $installState.effective.platform.startupStage "full") -}}
{{- fail "dockerHubCache.enabled must be true when buildkit.enabled is true" -}}
{{- end -}}
{{- if and .Values.buildkit.enabled .Values.dockerHubCache.enabled (eq $installState.effective.platform.startupStage "full") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "compartment.fullname" . }}-buildkit
  namespace: {{ .Values.buildkit.namespace }}
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
data:
  buildkitd.toml: |
    [registry."docker.io"]
      mirrors = ["http://{{ include "compartment.fullname" . }}-dockerhub-cache.{{ .Release.Namespace }}.svc:{{ .Values.ports.dockerHubCache }}"]
{{- end }}
