{{- $runtimeClassName := .Values.sandboxRuntime.runtimeClassName -}}
{{- $existing := lookup "node.k8s.io/v1" "RuntimeClass" "" $runtimeClassName -}}
{{- $annotations := dict -}}
{{- if $existing -}}
{{- $annotations = default dict $existing.metadata.annotations -}}
{{- end -}}
{{- $ownedByRelease := and $existing (eq (get $annotations "meta.helm.sh/release-name") .Release.Name) (eq (get $annotations "meta.helm.sh/release-namespace") .Release.Namespace) -}}
{{- if $ownedByRelease }}
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: {{ $runtimeClassName }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
handler: {{ required "The existing release-owned RuntimeClass must have a handler" $existing.handler }}
{{- with $existing.overhead }}
overhead:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- with $existing.scheduling }}
scheduling:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
