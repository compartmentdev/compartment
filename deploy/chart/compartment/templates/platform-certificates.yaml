{{- $installState := include "compartment.resolvedInstallState" . | fromYaml -}}
{{- if and (eq $installState.effective.platform.startupStage "full") (eq $installState.effective.platform.publicProtocol "https") (ne $installState.effective.platform.tlsMode "secret") (empty .Values.tls.existingSecret) -}}
{{- $baseDomain := $installState.effective.platform.baseDomain -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "compartment.fullname" . }}-console
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-tls
spec:
  secretName: {{ include "compartment.fullname" . }}-console-tls
  issuerRef:
    name: {{ .Values.tls.issuerRef.name | quote }}
    kind: {{ .Values.tls.issuerRef.kind | quote }}
  dnsNames:
    - {{ printf "console.%s" $baseDomain | quote }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "compartment.fullname" . }}-wildcard
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-tls
spec:
  secretName: {{ include "compartment.fullname" . }}-wildcard-tls
  issuerRef:
    name: {{ .Values.tls.issuerRef.name | quote }}
    kind: {{ .Values.tls.issuerRef.kind | quote }}
  dnsNames:
    - {{ printf "*.%s" $baseDomain | quote }}
{{- end }}
