{{- $installState := include "compartment.resolvedInstallState" . | fromYaml -}}
{{- if and (eq $installState.effective.platform.tlsMode "secret") (not $installState.effective.customTls.existingSecret) }}
{{- $name := include "compartment.customTlsSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $data := dict -}}
{{- if and $existing $existing.data -}}
{{- $data = $existing.data -}}
{{- end -}}
{{- $certificate := include "compartment.persistedSecretValue" (dict "data" $data "secretKey" "tls.crt" "fallback" "" "override" .Values.customTls.certificate) -}}
{{- $privateKey := include "compartment.persistedSecretValue" (dict "data" $data "secretKey" "tls.key" "fallback" "" "override" .Values.customTls.privateKey) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
type: kubernetes.io/tls
stringData:
  tls.crt: {{ $certificate | quote }}
  tls.key: {{ $privateKey | quote }}
{{- end }}
{{- if not (empty $installState.effective.customTls.operatorSecretName) }}
{{- $operatorExisting := lookup "v1" "Secret" .Release.Namespace $installState.effective.customTls.operatorSecretName -}}
{{- $operatorData := dict -}}
{{- if and $operatorExisting $operatorExisting.data -}}
{{- $operatorData = $operatorExisting.data -}}
{{- end -}}
{{- $operatorCertificate := include "compartment.persistedSecretValue" (dict "data" $operatorData "secretKey" "tls.crt" "fallback" "" "override" .Values.customTls.operatorCertificate) -}}
{{- $operatorPrivateKey := include "compartment.persistedSecretValue" (dict "data" $operatorData "secretKey" "tls.key" "fallback" "" "override" .Values.customTls.operatorPrivateKey) -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $installState.effective.customTls.operatorSecretName }}
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
    app.kubernetes.io/component: system-domain-tls
type: kubernetes.io/tls
stringData:
  tls.crt: {{ $operatorCertificate | quote }}
  tls.key: {{ $operatorPrivateKey | quote }}
{{- end }}
{{- if not (empty .Values.customTls.pendingSecretName) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.customTls.pendingSecretName }}
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
    app.kubernetes.io/component: system-domain-tls
type: kubernetes.io/tls
stringData:
  tls.crt: {{ .Values.customTls.pendingCertificate | quote }}
  tls.key: {{ .Values.customTls.pendingPrivateKey | quote }}
{{- end }}
