{{- include "compartment.applyRetainedInstallState" . -}}
{{- if and (eq .Values.platform.tlsMode "custom-cert") (not .Values.customTls.existingSecret) }}
{{- $name := include "compartment.customTlsSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $data := dict -}}
{{- if and $existing $existing.data -}}
{{- $data = $existing.data -}}
{{- end -}}
{{- $certificate := default (default "" (dig "tls.crt" "" $data | b64dec)) .Values.customTls.certificate -}}
{{- $privateKey := default (default "" (dig "tls.key" "" $data | b64dec)) .Values.customTls.privateKey -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
type: kubernetes.io/tls
stringData:
  tls.crt: {{ $certificate | quote }}
  tls.key: {{ $privateKey | quote }}
{{- end }}
{{- if not (empty .Values.customTls.operatorSecretName) }}
{{- $operatorExisting := lookup "v1" "Secret" .Release.Namespace .Values.customTls.operatorSecretName -}}
{{- $operatorData := dict -}}
{{- if and $operatorExisting $operatorExisting.data -}}
{{- $operatorData = $operatorExisting.data -}}
{{- end -}}
{{- $operatorCertificate := default (default "" (dig "tls.crt" "" $operatorData | b64dec)) .Values.customTls.operatorCertificate -}}
{{- $operatorPrivateKey := default (default "" (dig "tls.key" "" $operatorData | b64dec)) .Values.customTls.operatorPrivateKey -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.customTls.operatorSecretName }}
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
    app.kubernetes.io/component: system-domain-tls
type: kubernetes.io/tls
stringData:
  tls.crt: {{ $operatorCertificate | quote }}
  tls.key: {{ $operatorPrivateKey | quote }}
{{- end }}
{{- if not (empty .Values.customTls.pendingSecretName) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.customTls.pendingSecretName }}
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
    app.kubernetes.io/component: system-domain-tls
type: kubernetes.io/tls
stringData:
  tls.crt: {{ .Values.customTls.pendingCertificate | quote }}
  tls.key: {{ .Values.customTls.pendingPrivateKey | quote }}
{{- end }}
