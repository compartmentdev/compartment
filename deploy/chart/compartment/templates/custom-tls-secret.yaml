{{- include "compartment.applyRetainedInstallState" . -}}
{{- if and (eq .Values.platform.tlsMode "custom-cert") (not .Values.customTls.existingSecret) }}
{{- $name := include "compartment.customTlsSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $data := dict -}}
{{- if and $existing $existing.data -}}
{{- $data = $existing.data -}}
{{- end -}}
{{- $certificate := default (default "" (dig "tls.crt" "" $data | b64dec)) .Values.customTls.certificate -}}
{{- $privateKey := default (default "" (dig "tls.key" "" $data | b64dec)) .Values.customTls.privateKey -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
type: kubernetes.io/tls
stringData:
  tls.crt: {{ $certificate | quote }}
  tls.key: {{ $privateKey | quote }}
{{- end }}
