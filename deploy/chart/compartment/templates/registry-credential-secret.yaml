{{- $name := printf "%s-registry-credentials" (include "compartment.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $existingKey := "" -}}
{{- if and $existing $existing.data -}}
{{- $existingKey = dig "registry-credential-signing-key" "" $existing.data | b64dec -}}
{{- end -}}
{{- $generatedKey := default (sha256sum (randAlphaNum 64)) .Values.secrets.registryCredentialSigningKey -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
  annotations:
    {{- include "compartment.retainedResourceAnnotations" . | nindent 4 }}
type: Opaque
stringData:
  registry-credential-signing-key: {{ default $generatedKey $existingKey | quote }}
