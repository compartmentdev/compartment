apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "compartment.fullname" . }}-caddy
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "compartment.componentLabels" (dict "root" . "component" "caddy") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        # IngressClass does not expose controller Pod identity. Exact class, host, and path selection is enforced
        # by the Ingress resources and Caddy's public route allowlist.
        - namespaceSelector: {}
      ports:
        - {protocol: TCP, port: {{ .Values.ports.http }}}
