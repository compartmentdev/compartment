apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "compartment.fullname" . }}-caddy
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "compartment.componentLabels" (dict "root" . "component" "caddy") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ingress.controller.namespace | quote }}
          podSelector:
            matchLabels:
              {{- range .Values.ingress.controller.podSelector }}
              {{ .key | quote }}: {{ .value | quote }}
              {{- end }}
      ports:
        - {protocol: TCP, port: {{ .Values.ports.http }}}
