{{- $installState := include "compartment.resolvedInstallState" . | fromYaml -}}
{{- if eq $installState.effective.platform.startupStage "full" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "compartment.fullname" . }}-registry
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "compartment.componentLabels" (dict "root" . "component" "registry") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "compartment.componentLabels" (dict "root" . "component" "registry-auth") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.ports.registry }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "compartment.fullname" . }}-buildkit-seed-cache
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "compartment.componentLabels" (dict "root" . "component" "buildkit-seed-cache") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "compartment.componentLabels" (dict "root" . "component" "registry-auth") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "compartment.componentLabels" (dict "root" . "component" "worker") | nindent 14 }}
      ports:
        - {protocol: TCP, port: {{ .Values.ports.buildkitSeedCache }}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "compartment.fullname" . }}-registry-auth
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "compartment.componentLabels" (dict "root" . "component" "registry-auth") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "compartment.componentLabels" (dict "root" . "component" "worker") | nindent 14 }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.buildkit.namespace }}
          podSelector:
            matchLabels:
              compartment.dev/job-class: build
      ports:
        - {protocol: TCP, port: {{ .Values.ports.registryInternal }}}
    # Intentionally omits `from`: cluster nodes need direct :5000 access for kubelet image pulls; see the chart README.
    - ports:
        - {protocol: TCP, port: {{ .Values.ports.registry }}}
{{- end }}
