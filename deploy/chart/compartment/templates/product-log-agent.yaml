{{- $installState := include "compartment.resolvedInstallState" . | fromYaml -}}
{{- if and (eq $installState.effective.platform.startupStage "full") .Values.productLogs.enabled }}
{{- $name := printf "%s-log-agent" (include "compartment.fullname" .) -}}
{{- $namespace := default (printf "%s-observability" (include "compartment.fullname" .)) .Values.productLogs.namespace -}}
{{- $platformSecret := lookup "v1" "Secret" .Release.Namespace (include "compartment.fullname" .) -}}
{{- $productLogIngestToken := required "install the foundation stage first or set secrets.productLogIngestToken" (default (dig "data" "product-log-ingest-token" "" $platformSecret | b64dec) .Values.secrets.productLogIngestToken) -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $namespace }}
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
data:
  vector.yaml: |
    {{- .Files.Get "files/product-log-agent-vector.yaml" | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
type: Opaque
stringData:
  ingest-token: {{ $productLogIngestToken | quote }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
  annotations:
    compartment.dev/log-slo-lines-per-second: '12000'
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
      annotations:
        checksum/ingest-token: {{ $productLogIngestToken | sha256sum }}
        prometheus.io/port: '9598'
        prometheus.io/scrape: 'true'
    spec:
      priorityClassName: {{ include "compartment.platformPriorityClassName" . }}
      {{- include "compartment.nodePool" .Values.nodePools.system | nindent 6 }}
      automountServiceAccountToken: false
      serviceAccountName: {{ $name }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: vector
          image: {{ include "compartment.image" .Values.images.productLogAgent }}
          imagePullPolicy: {{ .Values.images.productLogAgent.pullPolicy }}
          args:
            - --config
            - /etc/vector/vector.yaml
            - --watch-config
            - --watch-config-method
            - poll
            - --watch-config-poll-interval-seconds
            - '1'
          env:
            - name: COMPARTMENT_LOG_INGEST_URL
              value: {{ printf "http://%s-api.%s.svc:%v/internal/kubernetes/logs" (include "compartment.fullname" .) .Release.Namespace .Values.ports.api | quote }}
            - name: COMPARTMENT_PRODUCT_LOG_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}
                  key: ingest-token
          ports:
            - {name: api, containerPort: 8686}
            - {name: metrics, containerPort: 9598}
          livenessProbe:
            httpGet: {path: /health, port: api}
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet: {path: /health, port: api}
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.resources.productLogAgent | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - {name: config, mountPath: /etc/vector, readOnly: true}
            - {name: pod-logs, mountPath: /var/log/pods, readOnly: true}
            - {name: data, mountPath: /var/lib/vector}
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: data
          hostPath:
            path: {{ printf "/var/lib/compartment/%s" $name }}
            type: DirectoryOrCreate
{{- end }}
