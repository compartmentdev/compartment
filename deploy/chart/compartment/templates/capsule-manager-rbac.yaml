{{- $name := printf "%s-capsule" .Release.Name -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-manager
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
rules:
  - apiGroups: ['']
    resources:
      - limitranges
      - namespaces
      - persistentvolumeclaims
      - persistentvolumes
      - pods
      - resourcequotas
      - serviceaccounts
      - services
    verbs: [get, list, watch]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: [capsule.clastix.io]
    resources:
      - capsuleconfigurations
      - customquotas
      - globalcustomquotas
      - globaltenantresources
      - quantityledgers
      - resourcepoolclaims
      - resourcepools
      - rulestatuses
      - tenantowners
      - tenantresources
      - tenants
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gatewayclasses]
    verbs: [get, list, watch]
  - apiGroups: [node.k8s.io]
    resources: [runtimeclasses]
    verbs: [get, list, watch]
  - apiGroups: [resource.k8s.io]
    resources: [deviceclasses]
    verbs: [get, list, watch]
  - apiGroups: [scheduling.k8s.io]
    resources: [priorityclasses]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: [capsule.clastix.io]
    resources: [capsuleconfigurations/status, globalcustomquotas/status, quantityledgers/status]
    verbs: [get, patch, update]
  - apiGroups: [capsule.clastix.io]
    resources: [globalcustomquotas]
    verbs: [patch]
  - apiGroups: [capsule.clastix.io]
    resources: [quantityledgers]
    verbs: [create, patch, update, delete]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingwebhookconfigurations]
    verbs: [list, watch]
  - apiGroups: [admissionregistration.k8s.io]
    resourceNames: [{{ $name }}-dynamic-webhook]
    resources: [validatingwebhookconfigurations]
    verbs: [get, patch, update]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles, clusterrolebindings, rolebindings]
    verbs: [list, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resourceNames: [capsule-namespace-deleter, capsule-namespace-provisioner]
    resources: [clusterroles]
    verbs: [get, patch, update]
  - apiGroups: [rbac.authorization.k8s.io]
    resourceNames: [capsule-namespace-provisioner]
    resources: [clusterrolebindings]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-manager
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-manager
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: ['']
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-manager
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: capsule-namespace-provisioner
  labels:
    projectcapsule.dev/created-by: rbac-controller
rules:
  - apiGroups: ['']
    resources: [namespaces]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: capsule-namespace-deleter
  labels:
    projectcapsule.dev/created-by: rbac-controller
rules:
  - apiGroups: ['']
    resources: [namespaces]
    verbs: [delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: capsule-namespace-provisioner
  labels:
    projectcapsule.dev/created-by: rbac-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: capsule-namespace-provisioner
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ $name }}-dynamic-webhook
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: {{ printf "%s/%s-webhook-cert" .Release.Namespace $name | quote }}
webhooks:
  - name: calculation.custom-quotas.validating.projectcapsule.dev
    admissionReviewVersions: [v1, v1beta1]
    clientConfig:
      service:
        name: {{ $name }}-webhook-service
        namespace: {{ .Release.Namespace }}
        path: /custom-quotas/calculations
        port: 9443
    failurePolicy: Fail
    matchPolicy: Equivalent
    namespaceSelector:
      matchLabels:
        app.kubernetes.io/managed-by: compartment
      matchExpressions:
        - key: compartment.dev/organization-id
          operator: Exists
        - key: compartment.dev/project-id
          operator: Exists
    rules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, persistentvolumeclaims]
        scope: Namespaced
    sideEffects: NoneOnDryRun
    timeoutSeconds: 30
