{{- include "compartment.applyRetainedInstallState" . -}}
{{- $name := include "compartment.installStateSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $data := dict -}}
{{- if and $existing $existing.data -}}
{{- $data = $existing.data -}}
{{- end -}}
{{- $installationId := default .Values.platform.installationId (dig "installation-id" "" $data | b64dec) -}}
{{- $domainMode := default .Values.platform.domainMode (dig "domain-mode" "" $data | b64dec) -}}
{{- $baseDomain := default .Values.platform.baseDomain (dig "base-domain" "" $data | b64dec) -}}
{{- $publicIngressIpv4 := default .Values.platform.publicIngressIpv4 (dig "public-ingress-ipv4" "" $data | b64dec) -}}
{{- $publicIngressIpv6 := default .Values.platform.publicIngressIpv6 (dig "public-ingress-ipv6" "" $data | b64dec) -}}
{{- $acmeEmail := default .Values.platform.acmeEmail (dig "acme-email" "" $data | b64dec) -}}
{{- $brokerUrl := default .Values.platform.managedDomainBrokerUrl (dig "managed-domain-broker-url" "" $data | b64dec) -}}
{{- $brokerToken := default .Values.secrets.managedDomainBrokerToken (dig "managed-domain-broker-token" "" $data | b64dec) -}}
{{- $publicProtocol := default .Values.platform.publicProtocol (dig "public-protocol" "" $data | b64dec) -}}
{{- $tlsMode := default .Values.platform.tlsMode (dig "tls-mode" "" $data | b64dec) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
    app.kubernetes.io/component: install-state
  annotations:
    helm.sh/resource-policy: keep
    meta.helm.sh/release-name: {{ .Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | quote }}
type: Opaque
stringData:
  installation-id: {{ $installationId | quote }}
  domain-mode: {{ $domainMode | quote }}
  base-domain: {{ $baseDomain | quote }}
  public-ingress-ipv4: {{ $publicIngressIpv4 | quote }}
  public-ingress-ipv6: {{ $publicIngressIpv6 | quote }}
  acme-email: {{ $acmeEmail | quote }}
  managed-domain-broker-url: {{ $brokerUrl | quote }}
  managed-domain-broker-token: {{ $brokerToken | quote }}
  public-protocol: {{ $publicProtocol | quote }}
  tls-mode: {{ $tlsMode | quote }}
