{{- $name := include "compartment.installStateSecretName" . -}}
{{- $installState := include "compartment.resolvedInstallState" . | fromYaml -}}
{{- $platform := $installState.persisted.platform -}}
{{- $customTls := $installState.persisted.customTls -}}
{{- $secrets := $installState.persisted.secrets -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
    app.kubernetes.io/component: install-state
  annotations:
    helm.sh/resource-policy: keep
    meta.helm.sh/release-name: {{ .Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | quote }}
type: Opaque
stringData:
  installation-id: {{ $platform.installationId | quote }}
  startup-stage: {{ $platform.startupStage | quote }}
  domain-generation: {{ $platform.domainGeneration | quote }}
  domain-mode: {{ $platform.domainMode | quote }}
  base-domain: {{ $platform.baseDomain | quote }}
  managed-base-domain: {{ $platform.managedBaseDomain | quote }}
  public-ingress-ipv4: {{ $platform.publicIngressIpv4 | quote }}
  public-ingress-ipv6: {{ $platform.publicIngressIpv6 | quote }}
  acme-email: {{ $platform.acmeEmail | quote }}
  managed-domain-broker-url: {{ $platform.managedDomainBrokerUrl | quote }}
  managed-domain-broker-token: {{ $secrets.managedDomainBrokerToken | quote }}
  public-protocol: {{ $platform.publicProtocol | quote }}
  tls-mode: {{ $platform.tlsMode | quote }}
  active-custom-tls-secret: {{ $customTls.existingSecret | quote }}
  operator-custom-tls-secret: {{ $customTls.operatorSecretName | quote }}
