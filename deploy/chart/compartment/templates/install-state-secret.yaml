{{- $name := include "compartment.installStateSecretName" . -}}
{{- $installState := include "compartment.resolvedInstallState" . | fromYaml -}}
{{- $platform := $installState.persisted.platform -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "compartment.labels" . | nindent 4 }}
    app.kubernetes.io/component: install-state
  annotations:
    {{- include "compartment.retainedResourceAnnotations" . | nindent 4 }}
type: Opaque
stringData:{{ range $field := include "compartment.installStateFields" . | fromYamlArray }}
  {{ $field.secretKey }}: {{ get (get $installState.persisted $field.valuesSection) $field.valueKey | quote }}{{ if eq $field.secretKey "installation-id" }}
  startup-stage: {{ $platform.startupStage | quote }}
  domain-generation: {{ $platform.domainGeneration | quote }}{{ end }}{{ if eq $field.secretKey "base-domain" }}
  managed-base-domain: {{ $platform.managedBaseDomain | quote }}{{ end }}{{ end }}
