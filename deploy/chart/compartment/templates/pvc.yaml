{{- $installState := include "compartment.resolvedInstallState" . | fromYaml -}}
{{- $root := . -}}
{{- $claims := dict "postgres" .Values.storage.postgres "registry" .Values.storage.registry -}}
{{- if eq $installState.effective.platform.startupStage "full" -}}
{{- $_ := set $claims "api" .Values.storage.api -}}
{{- if .Values.edge.snapshots.enabled -}}
{{- $_ := set $claims "edge-snapshots" .Values.storage.edgeSnapshots -}}
{{- end -}}
{{- end -}}
{{- range $name, $size := $claims }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "compartment.fullname" $root }}-{{ $name }}
  labels:
    {{- include "compartment.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
  {{- if eq $name "registry" }}
  annotations:
    {{- include "compartment.retainedResourceAnnotations" $root | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- include "compartment.storageClass" $root | nindent 2 }}
  resources:
    requests:
      storage: {{ $size }}
{{- end }}
