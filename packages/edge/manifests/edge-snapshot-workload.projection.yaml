apiVersion: apps/v1
kind: Deployment
metadata:
  name: compartment-edge
spec:
  template:
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: prepare-edge-snapshot-volume
          # Pinned from busybox:1.37.0 on 2026-07-23; refresh the digest intentionally with the readable tag.
          image: busybox:1.37.0@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028
          command: [sh, -c, 'chown 1000:1000 /snapshot && chmod 0700 /snapshot']
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: edge-snapshot
              mountPath: /snapshot
      containers:
        - name: edge
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: edge-snapshot
              mountPath: /var/lib/compartment-edge
      volumes:
        - name: edge-snapshot
          persistentVolumeClaim:
            claimName: compartment-edge-snapshot
