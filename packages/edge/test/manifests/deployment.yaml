apiVersion: apps/v1
kind: Deployment
metadata:
  name: compartment-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: compartment-edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: compartment-edge
    spec:
      containers:
        - name: edge
          image: compartment-edge:test
