apiVersion: v1
kind: ServiceAccount
metadata:
  name: compartment-worker
  namespace: compartment
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: compartment-worker-observability
rules:
  - apiGroups: ['']
    resources: ['pods']
    verbs: ['get', 'list']
  - apiGroups: ['metrics.k8s.io']
    resources: ['pods']
    verbs: ['get', 'list']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: compartment-worker-observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: compartment-worker-observability
subjects:
  - kind: ServiceAccount
    name: compartment-worker
    namespace: compartment
