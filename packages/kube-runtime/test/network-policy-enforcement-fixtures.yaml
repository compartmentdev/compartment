apiVersion: v1
kind: Namespace
metadata: { name: ns-a, labels: { compartment.test/namespace: ns-a } }
---
apiVersion: v1
kind: Namespace
metadata: { name: ns-b, labels: { compartment.test/namespace: ns-b } }
---
apiVersion: v1
kind: Namespace
metadata:
  { name: platform-ns, labels: { compartment.test/namespace: platform-ns, compartment.dev/namespace-id: platform-ns } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: app, namespace: ns-a }
spec:
  replicas: 1
  selector: { matchLabels: { app: application } }
  template:
    # The worker projects tenant application Pods with app: application; compartment.test/role only
    # addresses this Pod from the check script and is never selected by a rendered policy.
    metadata: { labels: { app: application, compartment.test/role: application } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: server
          image: busybox:1.37.0
          command: [sh, -c, 'echo ok >/tmp/index.html; httpd -f -p 8080 -h /tmp']
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: app, namespace: ns-a }
spec: { selector: { app: application }, ports: [{ port: 8080, targetPort: 8080 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: resource, namespace: ns-a }
spec:
  replicas: 1
  selector: { matchLabels: { app: resource } }
  template:
    metadata: { labels: { app: resource } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: server
          image: busybox:1.37.0
          command: [sh, -c, 'echo ok >/tmp/index.html; httpd -f -p 8080 -h /tmp']
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: resource, namespace: ns-a }
spec: { selector: { app: resource }, ports: [{ port: 8080, targetPort: 8080 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: client, namespace: ns-a }
spec:
  replicas: 1
  selector: { matchLabels: { app: client } }
  template:
    metadata: { labels: { app: client, compartment.dev/job-class: release } }
    spec:
      automountServiceAccountToken: false
      containers:
        - { name: client, image: busybox:1.37.0, command: [sh, -c, 'sleep 86400'] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: foreign, namespace: ns-b }
spec:
  replicas: 1
  selector: { matchLabels: { app: foreign } }
  template:
    metadata: { labels: { app: foreign } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: server
          image: busybox:1.37.0
          command: [sh, -c, 'echo ok >/tmp/index.html; httpd -f -p 8080 -h /tmp']
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: foreign, namespace: ns-b }
spec: { selector: { app: foreign }, ports: [{ port: 8080, targetPort: 8080 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: platform, namespace: platform-ns }
spec:
  replicas: 1
  selector: { matchLabels: { app: platform } }
  template:
    metadata: { labels: { app: platform } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: server
          image: busybox:1.37.0
          command: [sh, -c, 'echo ok >/tmp/index.html; httpd -f -p 8080 -h /tmp']
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: platform, namespace: platform-ns }
spec: { selector: { app: platform }, ports: [{ port: 8080, targetPort: 8080 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: caddy, namespace: platform-ns }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/component: caddy } }
  template:
    metadata:
      # The chart labels Caddy Pods with compartment.componentLabels: name, instance, and component.
      labels:
        app.kubernetes.io/name: compartment
        app.kubernetes.io/instance: compartment
        app.kubernetes.io/component: caddy
    spec:
      automountServiceAccountToken: false
      containers:
        - { name: client, image: busybox:1.37.0, command: [sh, -c, 'sleep 86400'] }
