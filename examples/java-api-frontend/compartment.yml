name: java-api-frontend

services:
  web:
    path: ./services/web
    build:
      strategy: railpack
      command: node build.mjs
    readiness:
      type: http
      path: /ready
      timeoutMs: 30000
  api:
    kind: api
    path: ./services/api
    readiness:
      type: http
      path: /ready
      timeoutMs: 30000
