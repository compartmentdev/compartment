apiVersion: v1
kind: ServiceAccount
metadata:
  name: compartment-controller
  namespace: project-a
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: compartment-project
  namespace: project-a
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: compartment-controller
  namespace: project-a
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: compartment-controller
subjects:
  - kind: ServiceAccount
    name: compartment-controller
    namespace: project-a
