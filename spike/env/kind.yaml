kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: HOST_HTTP_PORT
        listenAddress: 127.0.0.1
        protocol: TCP
      - containerPort: 30443
        hostPort: HOST_HTTPS_PORT
        listenAddress: 127.0.0.1
        protocol: TCP
