apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-data
  namespace: cpt-t3-stateful
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: t3-backup
  namespace: cpt-t3-stateful
spec:
  template:
    metadata:
      labels: {spike.compartment.dev/track: t3}
    spec:
      restartPolicy: Never
      containers:
        - name: pg-dump
          image: postgres:16.9-alpine
          env:
            - {name: PGPASSWORD, value: t3-password}
          command: [sh, -ec, "rm -f /backup/t3.ready /backup/t3.dump.tmp; pg_dump -h t3-postgres -U t3 -d t3 -Fc -f /backup/t3.dump.tmp; mv /backup/t3.dump.tmp /backup/t3.dump; touch /backup/t3.ready; sleep 300"]
          volumeMounts:
            - {name: backup, mountPath: /backup}
      volumes:
        - name: backup
          persistentVolumeClaim:
            claimName: backup-data
