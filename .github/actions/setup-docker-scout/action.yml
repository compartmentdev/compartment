name: Set up Docker Scout
description: Install a pinned Docker Scout CLI plugin.

inputs:
  version:
    description: Docker Scout CLI version to install.
    required: false
    default: 1.23.1
  sha256:
    description: SHA-256 checksum for the Docker Scout CLI archive.
    required: false
    default: 0f778f9d833f28bc6cccff95e33039849c0afcecafa38d9f46fe74bfd0915714

runs:
  using: composite
  steps:
    - name: Install Docker Scout
      shell: bash
      env:
        DOCKER_SCOUT_CLI_SHA256: ${{ inputs.sha256 }}
        DOCKER_SCOUT_CLI_VERSION: ${{ inputs.version }}
      run: |
        mkdir -p "$HOME/.docker/cli-plugins"
        rm -rf /tmp/docker-scout-install
        mkdir -p /tmp/docker-scout-install
        curl --fail --location --show-error \
          "https://github.com/docker/scout-cli/releases/download/v${DOCKER_SCOUT_CLI_VERSION}/docker-scout_${DOCKER_SCOUT_CLI_VERSION}_linux_amd64.tar.gz" \
          --output /tmp/docker-scout.tar.gz
        echo "${DOCKER_SCOUT_CLI_SHA256}  /tmp/docker-scout.tar.gz" | sha256sum --check
        tar -xzf /tmp/docker-scout.tar.gz -C /tmp/docker-scout-install docker-scout
        install -m 0755 /tmp/docker-scout-install/docker-scout "$HOME/.docker/cli-plugins/docker-scout"
        docker scout version
