name: Publish Self-Hosted Image Channel
description: Build, publish, sign, and verify a branch image channel

inputs:
  channel:
    description: Mutable tag and source branch name
    required: true
  dockerhub-token:
    description: Docker Hub access token
    required: true
  dockerhub-username:
    description: Docker Hub username
    required: true
  publish-sha:
    description: Commit to publish as an immutable sha tag
    required: true

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version-file: .nvmrc

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

    - name: Set up Cosign
      uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5
      with:
        cosign-release: v2.6.1

    - name: Set up Trivy
      uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514
      with:
        version: v0.70.0

    - name: Set up Docker Scout
      uses: ./.github/actions/setup-docker-scout

    - name: Build self-hosted images
      shell: bash
      env:
        COMPARTMENT_CADDY_BUILDER_IMAGE: public.ecr.aws/docker/library/caddy:2.11-builder
        COMPARTMENT_CADDY_RUNTIME_IMAGE: public.ecr.aws/docker/library/alpine:3.22
        COMPARTMENT_GO_BUILD_IMAGE: public.ecr.aws/docker/library/golang:1.26.5-bookworm
        COMPARTMENT_NODE_BUILD_IMAGE: public.ecr.aws/docker/library/node:24.15.0-bookworm
        COMPARTMENT_NODE_RUNTIME_IMAGE: public.ecr.aws/docker/library/node:24.15.0-bookworm-slim
        PUBLISH_SHA: ${{ inputs.publish-sha }}
      run: |
        mkdir -p ./.compartment/release-assets
        node ./scripts/deploy/build-self-hosted-images.mjs \
          --tag "sha-${PUBLISH_SHA}" \
          --repository-prefix docker.io/compartmentdev

    - name: Log in to Docker Hub
      uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-token }}

    - name: Scan self-hosted images before publish
      shell: bash
      env:
        PUBLISH_SHA: ${{ inputs.publish-sha }}
      run: |
        node ./scripts/deploy/secure-self-hosted-images.mjs \
          --scan-only \
          --docker-scout \
          --repository-prefix docker.io/compartmentdev \
          "sha-${PUBLISH_SHA}"

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Push immutable self-hosted images
      shell: bash
      env:
        COMPARTMENT_BUILDKIT_VERSION: v0.30.0
        COMPARTMENT_CADDY_BUILDER_IMAGE: public.ecr.aws/docker/library/caddy:2.11-builder
        COMPARTMENT_CADDY_RUNTIME_IMAGE: public.ecr.aws/docker/library/alpine:3.22
        COMPARTMENT_GO_BUILD_IMAGE: public.ecr.aws/docker/library/golang:1.26.5-bookworm
        COMPARTMENT_NODE_BUILD_IMAGE: public.ecr.aws/docker/library/node:24.15.0-bookworm
        COMPARTMENT_NODE_RUNTIME_IMAGE: public.ecr.aws/docker/library/node:24.15.0-bookworm-slim
        PRIMARY_TAG: sha-${{ inputs.publish-sha }}
        STAGING_TAG: staging-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.publish-sha }}
      run: |
        common_args=(--push --provenance=mode=max --sbom=true)
        node_args=(
          --build-arg "COMPARTMENT_NODE_BUILD_IMAGE=${COMPARTMENT_NODE_BUILD_IMAGE}"
          --build-arg "COMPARTMENT_NODE_RUNTIME_IMAGE=${COMPARTMENT_NODE_RUNTIME_IMAGE}"
        )
        worker_args=(
          "${node_args[@]}"
          --build-arg "COMPARTMENT_BUILDKIT_VERSION=${COMPARTMENT_BUILDKIT_VERSION}"
          --build-arg "COMPARTMENT_GO_BUILD_IMAGE=${COMPARTMENT_GO_BUILD_IMAGE}"
        )
        caddy_args=(
          --build-arg "COMPARTMENT_CADDY_BUILDER_IMAGE=${COMPARTMENT_CADDY_BUILDER_IMAGE}"
          --build-arg "COMPARTMENT_CADDY_RUNTIME_IMAGE=${COMPARTMENT_CADDY_RUNTIME_IMAGE}"
        )
        push_dockerhub_image() {
          local image_name="$1"
          local dockerfile="$2"
          local metadata_file="./.compartment/release-assets/${image_name}-build-metadata.json"
          shift 2
          docker buildx build "${common_args[@]}" "$@" \
            --tag "docker.io/compartmentdev/${image_name}:${STAGING_TAG}" \
            --metadata-file "$metadata_file" \
            --file "$dockerfile" .
        }

        read_image_digest() {
          local image_ref="$1"
          docker buildx imagetools inspect \
            --format '{{ printf "%s" .Manifest.Digest }}' \
            "$image_ref"
        }

        read_optional_image_digest() {
          local image_ref="$1"
          local inspect_error_file="$2"
          local digest

          if digest="$(read_image_digest "$image_ref" 2> "$inspect_error_file")"; then
            printf '%s\n' "$digest"
            return 0
          fi
          if grep -Eiq 'manifest unknown|not found' "$inspect_error_file"; then
            return 2
          fi

          cat "$inspect_error_file" >&2
          echo "Failed to determine whether immutable image ${image_ref} exists." >&2
          return 1
        }

        reconcile_immutable_image_pair() {
          local image_name="$1"
          local scanned_digest="$2"
          local scanned_ref="docker.io/compartmentdev/${image_name}@${scanned_digest}"
          local dockerhub_ref="docker.io/compartmentdev/${image_name}:${PRIMARY_TAG}"
          local ghcr_ref="ghcr.io/compartmentdev/${image_name}:${PRIMARY_TAG}"
          local dockerhub_error_file="./.compartment/release-assets/${image_name}-dockerhub-inspect-error.txt"
          local ghcr_error_file="./.compartment/release-assets/${image_name}-ghcr-inspect-error.txt"
          local dockerhub_digest=""
          local ghcr_digest=""
          local canonical_digest
          local canonical_ref
          local status

          if dockerhub_digest="$(read_optional_image_digest "$dockerhub_ref" "$dockerhub_error_file")"; then
            :
          else
            status=$?
            [ "$status" -eq 2 ] || return "$status"
          fi
          if ghcr_digest="$(read_optional_image_digest "$ghcr_ref" "$ghcr_error_file")"; then
            :
          else
            status=$?
            [ "$status" -eq 2 ] || return "$status"
          fi

          canonical_digest="$(node ./scripts/deploy/secure-self-hosted-images.mjs \
            --resolve-scanned-digest \
            "$image_name" \
            "$scanned_digest" \
            "$dockerhub_digest" \
            "$ghcr_digest")"
          canonical_ref="$scanned_ref"

          if [ -z "$dockerhub_digest" ]; then
            docker buildx imagetools create --tag "$dockerhub_ref" "$canonical_ref"
            dockerhub_digest="$(read_image_digest "$dockerhub_ref")"
          fi
          if [ "$dockerhub_digest" != "$canonical_digest" ]; then
            echo "Immutable image ${dockerhub_ref} resolved to ${dockerhub_digest}; expected ${canonical_digest}." >&2
            return 1
          fi

          if [ -z "$ghcr_digest" ]; then
            docker buildx imagetools create --tag "$ghcr_ref" "$canonical_ref"
            ghcr_digest="$(read_image_digest "$ghcr_ref")"
          fi
          if [ "$ghcr_digest" != "$canonical_digest" ]; then
            echo "Immutable image ${ghcr_ref} resolved to ${ghcr_digest}; expected ${canonical_digest}." >&2
            return 1
          fi

          echo "Immutable image pair for ${image_name} is pinned at ${canonical_digest}."
        }

        push_dockerhub_image compartment-api packages/api/Dockerfile.self-hosted "${node_args[@]}"
        push_dockerhub_image compartment-caddy packages/edge/Dockerfile.caddy.self-hosted "${caddy_args[@]}"
        push_dockerhub_image compartment-edge packages/edge/Dockerfile.self-hosted "${node_args[@]}"
        push_dockerhub_image compartment-worker packages/worker/Dockerfile.self-hosted "${worker_args[@]}"

        mapfile -t self_hosted_services < <(node ./scripts/deploy/list-self-hosted-runtime-image-artifacts.mjs)

        declare -A scanned_digest_by_service
        digest_manifest="./.compartment/release-assets/self-hosted-scanned-digests.tsv"
        : > "$digest_manifest"
        scan_args=(--scan-only --docker-scout)
        for service in "${self_hosted_services[@]}"; do
          image_name="compartment-${service}"
          metadata_file="./.compartment/release-assets/${image_name}-build-metadata.json"
          scanned_digest_by_service["$service"]="$(node ./scripts/deploy/secure-self-hosted-images.mjs \
            --read-build-metadata-digest "$metadata_file")"
          scan_args+=(--image-ref "docker.io/compartmentdev/${image_name}@${scanned_digest_by_service[$service]}")
          printf '%s\t%s\n' "$service" "${scanned_digest_by_service[$service]}" >> "$digest_manifest"
        done
        node ./scripts/deploy/secure-self-hosted-images.mjs "${scan_args[@]}"

        for service in "${self_hosted_services[@]}"; do
          reconcile_immutable_image_pair "compartment-${service}" "${scanned_digest_by_service[$service]}"
        done

    - name: Secure self-hosted image digests
      shell: bash
      run: |
        dockerhub_args=()
        ghcr_args=()
        digest_manifest="./.compartment/release-assets/self-hosted-scanned-digests.tsv"
        while IFS=$'\t' read -r service digest; do
          if [ -z "$service" ] || [ -z "$digest" ]; then
            echo "Expected service and scanned digest in ${digest_manifest}." >&2
            exit 1
          fi
          dockerhub_args+=(--image-ref "docker.io/compartmentdev/compartment-${service}@${digest}")
          ghcr_args+=(--image-ref "ghcr.io/compartmentdev/compartment-${service}@${digest}")
        done < "$digest_manifest"

        node ./scripts/deploy/secure-self-hosted-images.mjs \
          --output-dir ./.compartment/release-assets/self-hosted-sboms/dockerhub \
          "${dockerhub_args[@]}"
        node ./scripts/deploy/secure-self-hosted-images.mjs \
          --output-dir ./.compartment/release-assets/self-hosted-sboms/ghcr \
          "${ghcr_args[@]}"

    - name: Promote mutable channel tags
      shell: bash
      env:
        CHANNEL: ${{ inputs.channel }}
        GH_TOKEN: ${{ github.token }}
        PUBLISH_SHA: ${{ inputs.publish-sha }}
      run: |
        if ! current_channel_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${CHANNEL}" --jq '.object.sha')"; then
          echo "Failed to read current ${CHANNEL} ref." >&2
          exit 1
        fi
        if [ -z "$current_channel_sha" ]; then
          echo "Expected current ${CHANNEL} ref SHA." >&2
          exit 1
        fi
        if [ "$current_channel_sha" != "$PUBLISH_SHA" ]; then
          echo "Skipping mutable ${CHANNEL} promotion because ${PUBLISH_SHA} is no longer the branch head."
          exit 0
        fi

        mapfile -t self_hosted_services < <(node ./scripts/deploy/list-self-hosted-runtime-image-artifacts.mjs)
        for service in "${self_hosted_services[@]}"; do
          docker buildx imagetools create \
            --tag "docker.io/compartmentdev/compartment-${service}:${CHANNEL}" \
            "docker.io/compartmentdev/compartment-${service}:sha-${PUBLISH_SHA}"
          docker buildx imagetools create \
            --tag "ghcr.io/compartmentdev/compartment-${service}:${CHANNEL}" \
            "ghcr.io/compartmentdev/compartment-${service}:sha-${PUBLISH_SHA}"
        done

    - name: Upload self-hosted SBOM artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        include-hidden-files: true
        name: self-hosted-sboms-${{ inputs.channel }}
        path: ./.compartment/release-assets/self-hosted-sboms/**/*.spdx.json

    - name: Upload self-hosted provenance artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        include-hidden-files: true
        name: self-hosted-provenance-${{ inputs.channel }}
        path: ./.compartment/release-assets/self-hosted-sboms/**/*.slsa-v1-provenance.json
