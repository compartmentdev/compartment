name: Main CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: main-ci-${{ github.ref }}
  queue: max

jobs:
  select-runner:
    name: main:ci / select runner
    uses: ./.github/workflows/_select-ci-runner.yml

  db-integration:
    name: main:ci / db
    needs:
      - select-runner
    uses: ./.github/workflows/_db-integration.yml
    with:
      runner_labels_json: ${{ needs.select-runner.outputs.runner_labels_json }}

  self-hosted-image-cache:
    name: main:ci / build images
    needs:
      - select-runner
    uses: ./.github/workflows/_self-hosted-image-cache.yml
    with:
      runner_labels_json: ${{ needs.select-runner.outputs.runner_labels_json }}

  self-hosted-image-security-gate:
    name: main:ci / self-hosted image security gate
    needs:
      - select-runner
      - self-hosted-image-cache
    uses: ./.github/workflows/_self-hosted-image-security-gate.yml
    with:
      runner_labels_json: ${{ needs.select-runner.outputs.runner_labels_json }}
      self_hosted_image_cache_key: ${{ needs.self-hosted-image-cache.outputs.cache_key }}
      docker_scout_enabled: true
    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  edge-caddy-config:
    name: main:ci / edge caddy config
    needs:
      - select-runner
      - self-hosted-image-cache
    runs-on: ${{ fromJson(needs.select-runner.outputs.runner_labels_json) }}
    timeout-minutes: 20
    env:
      # The Caddyfile is only proven by the build that runs it: the plugin directives it depends on
      # exist nowhere else, so validation uses the image the platform actually ships.
      COMPARTMENT_CADDY_VALIDATION_IMAGE: ghcr.io/compartmentdev/compartment-caddy:sha-${{ github.sha }}
      COMPARTMENT_CADDY_VALIDATION_REQUIRED: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/tool-cache
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/tool-cache
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          version: 10.6.3
          cache: true

      - name: Restore self-hosted image cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ./.compartment/self-hosted-image-cache
          key: ${{ needs.self-hosted-image-cache.outputs.cache_key }}
          fail-on-cache-miss: true

      - name: Load the Caddy image
        run: docker load --input ./.compartment/self-hosted-image-cache/caddy.tar

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Helm
        env:
          HELM_SHA256: e9b88b4ee95b18c706839c28d3a0220e5bc470e9cd9262410c90793c45ff8b7c
          HELM_VERSION: v4.2.3
        # The validation environment is rendered from the chart rather than copied, so this job needs Helm.
        run: |
          helm_archive="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl --fail --location --show-error \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            "https://get.helm.sh/${helm_archive}" \
            --output "/tmp/${helm_archive}"
          echo "${HELM_SHA256}  /tmp/${helm_archive}" | sha256sum --check
          tar -xzf "/tmp/${helm_archive}" -C /tmp
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm

      - name: Validate the edge Caddyfile
        run: pnpm --filter @compartment/edge test:caddy-config

  select-platform-k3d-shards:
    name: main:ci / select platform k3d shards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      shards_json: ${{ steps.select.outputs.shards_json }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Select the full platform k3d matrix
        id: select
        run: node ./scripts/ci/select-platform-k3d-shards.mjs

  platform-k3d-e2e:
    name: main:ci / platform-k3d-e2e
    needs:
      - select-runner
      - select-platform-k3d-shards
      - self-hosted-image-cache
    uses: ./.github/workflows/_platform-k3d-e2e.yml
    with:
      self_hosted_image_cache_key: ${{ needs.self-hosted-image-cache.outputs.cache_key }}
      runner_labels_json: ${{ needs.select-runner.outputs.runner_labels_json }}
      shards_json: ${{ needs.select-platform-k3d-shards.outputs.shards_json }}
