name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    name: update release PR
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_PLEASE_APP_ID: ${{ secrets.RELEASE_PLEASE_APP_ID }}
    steps:
      - name: Ensure release app configuration
        run: |
          if [ -z "$RELEASE_PLEASE_APP_ID" ]; then
            echo "Expected secrets.RELEASE_PLEASE_APP_ID." >&2
            exit 1
          fi

          if [ -z "${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}" ]; then
            echo "Expected secrets.RELEASE_PLEASE_APP_PRIVATE_KEY." >&2
            exit 1
          fi

      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - name: Run release-please
        uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
