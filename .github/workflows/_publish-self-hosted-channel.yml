name: Publish Self-Hosted Image Channel

on:
  workflow_call:
    inputs:
      channel:
        description: Mutable tag and source branch name
        required: true
        type: string
      publish_sha:
        description: Commit to publish as an immutable sha tag
        required: true
        type: string
    secrets:
      DOCKERHUB_TOKEN:
        required: true
      DOCKERHUB_USERNAME:
        required: true

env:
  CHANNEL: ${{ inputs.channel }}
  PUBLISH_SHA: ${{ inputs.publish_sha }}

jobs:
  build-images:
    name: build ${{ inputs.channel }} image artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ env.PUBLISH_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Build self-hosted images
        env:
          COMPARTMENT_CADDY_BUILDER_IMAGE: public.ecr.aws/docker/library/caddy:2.11.4-builder
          COMPARTMENT_CADDY_RUNTIME_IMAGE: public.ecr.aws/docker/library/alpine:3.22
          COMPARTMENT_GO_BUILD_IMAGE: public.ecr.aws/docker/library/golang:1.26.5-bookworm
          COMPARTMENT_NODE_BUILD_IMAGE: public.ecr.aws/docker/library/node:24.15.0-bookworm
          COMPARTMENT_NODE_RUNTIME_IMAGE: public.ecr.aws/docker/library/node:24.15.0-bookworm-slim
        run: |
          mkdir -p ./.compartment/release-assets
          node ./scripts/deploy/build-self-hosted-images.mjs \
            --tag "sha-${PUBLISH_SHA}" \
            --repository-prefix docker.io/compartmentdev

      - name: Archive self-hosted images
        run: |
          docker image save \
            "docker.io/compartmentdev/compartment-api:sha-${PUBLISH_SHA}" \
            "docker.io/compartmentdev/compartment-caddy:sha-${PUBLISH_SHA}" \
            "docker.io/compartmentdev/compartment-edge:sha-${PUBLISH_SHA}" \
            "docker.io/compartmentdev/compartment-worker:sha-${PUBLISH_SHA}" \
            | gzip -1 > ./.compartment/release-assets/self-hosted-images.tar.gz

      - name: Upload self-hosted image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          include-hidden-files: true
          name: self-hosted-images-${{ inputs.channel }}
          path: ./.compartment/release-assets/self-hosted-images.tar.gz

  publish-images:
    name: publish ${{ inputs.channel }} + sha
    needs: build-images
    permissions:
      contents: read
      id-token: write
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ env.PUBLISH_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Set up Cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5
        with:
          cosign-release: v2.6.1

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514
        with:
          version: v0.70.0

      - name: Set up Docker Scout
        uses: ./.github/actions/setup-docker-scout

      - name: Download self-hosted image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: self-hosted-images-${{ inputs.channel }}
          path: ./.compartment/release-assets

      - name: Load self-hosted images
        run: gunzip -c ./.compartment/release-assets/self-hosted-images.tar.gz | docker load

      - name: Log in to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Scan self-hosted images before publish
        run: |
          node ./scripts/deploy/secure-self-hosted-images.mjs \
            --scan-only \
            --docker-scout \
            --repository-prefix docker.io/compartmentdev \
            "sha-${PUBLISH_SHA}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push self-hosted images
        env:
          COMPARTMENT_BUILDKIT_VERSION: v0.30.0
          COMPARTMENT_CADDY_BUILDER_IMAGE: public.ecr.aws/docker/library/caddy:2.11.4-builder
          COMPARTMENT_CADDY_RUNTIME_IMAGE: public.ecr.aws/docker/library/alpine:3.22
          COMPARTMENT_GO_BUILD_IMAGE: public.ecr.aws/docker/library/golang:1.26.5-bookworm
          COMPARTMENT_NODE_BUILD_IMAGE: public.ecr.aws/docker/library/node:24.15.0-bookworm
          COMPARTMENT_NODE_RUNTIME_IMAGE: public.ecr.aws/docker/library/node:24.15.0-bookworm-slim
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MUTABLE_TAG: ${{ inputs.channel }}
          PRIMARY_TAG: sha-${{ inputs.publish_sha }}
          STAGING_TAG: staging-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.publish_sha }}
        run: |
          common_args=(--push --provenance=mode=max --sbom=true)
          node_args=(
            --build-arg "COMPARTMENT_NODE_BUILD_IMAGE=${COMPARTMENT_NODE_BUILD_IMAGE}"
            --build-arg "COMPARTMENT_NODE_RUNTIME_IMAGE=${COMPARTMENT_NODE_RUNTIME_IMAGE}"
          )
          worker_args=(
            "${node_args[@]}"
            --build-arg "COMPARTMENT_BUILDKIT_VERSION=${COMPARTMENT_BUILDKIT_VERSION}"
            --build-arg "COMPARTMENT_GO_BUILD_IMAGE=${COMPARTMENT_GO_BUILD_IMAGE}"
          )
          caddy_args=(
            --build-arg "COMPARTMENT_CADDY_BUILDER_IMAGE=${COMPARTMENT_CADDY_BUILDER_IMAGE}"
            --build-arg "COMPARTMENT_CADDY_RUNTIME_IMAGE=${COMPARTMENT_CADDY_RUNTIME_IMAGE}"
          )
          mutable_tags_file="./.compartment/release-assets/published-self-hosted-mutable-tags.txt"
          : > "$mutable_tags_file"

          push_dockerhub_image() {
            local image_name="$1"
            local dockerfile="$2"
            shift 2
            docker buildx build "${common_args[@]}" "$@" \
              --tag "docker.io/compartmentdev/${image_name}:${STAGING_TAG}" \
              --file "$dockerfile" .
          }

          promote_dockerhub_image() {
            local image_name="$1"
            docker buildx imagetools create \
              --tag "docker.io/compartmentdev/${image_name}:${PRIMARY_TAG}" \
              "docker.io/compartmentdev/${image_name}:${STAGING_TAG}"
          }

          read_current_channel_sha() {
            local current_channel_sha
            if ! current_channel_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${CHANNEL}" --jq '.object.sha')"; then
              echo "Failed to read current ${CHANNEL} ref." >&2
              return 1
            fi
            if [ -z "$current_channel_sha" ]; then
              echo "Expected current ${CHANNEL} ref SHA." >&2
              return 1
            fi
            printf '%s\n' "$current_channel_sha"
          }

          promote_dockerhub_mutable_image() {
            local image_name="$1"
            docker buildx imagetools create \
              --tag "docker.io/compartmentdev/${image_name}:${MUTABLE_TAG}" \
              "docker.io/compartmentdev/${image_name}:${PRIMARY_TAG}"
          }

          push_dockerhub_image compartment-api packages/api/Dockerfile.self-hosted "${node_args[@]}"
          push_dockerhub_image compartment-caddy packages/edge/Dockerfile.caddy.self-hosted "${caddy_args[@]}"
          push_dockerhub_image compartment-edge packages/edge/Dockerfile.self-hosted "${node_args[@]}"
          push_dockerhub_image compartment-worker packages/worker/Dockerfile.self-hosted "${worker_args[@]}"

          mapfile -t self_hosted_services < <(node ./scripts/deploy/list-self-hosted-runtime-image-artifacts.mjs)

          node ./scripts/deploy/secure-self-hosted-images.mjs \
            --scan-only \
            --docker-scout \
            --repository-prefix docker.io/compartmentdev \
            "$STAGING_TAG"

          for service in "${self_hosted_services[@]}"; do
            promote_dockerhub_image "compartment-${service}"
          done

          mutable_channel_enabled=false
          current_channel_sha="$(read_current_channel_sha)" || exit 1
          if [ "$current_channel_sha" = "$PUBLISH_SHA" ]; then
            mutable_channel_enabled=true
            for service in "${self_hosted_services[@]}"; do
              promote_dockerhub_mutable_image "compartment-${service}"
            done
            printf '%s\n' "$MUTABLE_TAG" >> "$mutable_tags_file"
          fi

          for service in "${self_hosted_services[@]}"; do
            image_ref="docker.io/compartmentdev/compartment-${service}:sha-${PUBLISH_SHA}"
            docker tag "${image_ref}" "ghcr.io/compartmentdev/compartment-${service}:sha-${PUBLISH_SHA}"
            docker push "ghcr.io/compartmentdev/compartment-${service}:sha-${PUBLISH_SHA}"
          done

          if [ "$mutable_channel_enabled" = true ]; then
            for service in "${self_hosted_services[@]}"; do
              image_ref="docker.io/compartmentdev/compartment-${service}:sha-${PUBLISH_SHA}"
              docker tag "${image_ref}" "ghcr.io/compartmentdev/compartment-${service}:${MUTABLE_TAG}"
              docker push "ghcr.io/compartmentdev/compartment-${service}:${MUTABLE_TAG}"
            done
          fi

      - name: Secure self-hosted image digests
        run: |
          tags=("sha-${PUBLISH_SHA}")
          mutable_tags_file="./.compartment/release-assets/published-self-hosted-mutable-tags.txt"
          if [ -f "$mutable_tags_file" ]; then
            while IFS= read -r mutable_tag; do
              if [ -n "$mutable_tag" ]; then
                tags+=("$mutable_tag")
              fi
            done < "$mutable_tags_file"
          fi

          node ./scripts/deploy/secure-self-hosted-images.mjs \
            --repository-prefix docker.io/compartmentdev \
            --output-dir ./.compartment/release-assets/self-hosted-sboms/dockerhub \
            "${tags[@]}"
          node ./scripts/deploy/secure-self-hosted-images.mjs \
            --repository-prefix ghcr.io/compartmentdev \
            --output-dir ./.compartment/release-assets/self-hosted-sboms/ghcr \
            "${tags[@]}"

      - name: Upload self-hosted SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          include-hidden-files: true
          name: self-hosted-sboms-${{ inputs.channel }}
          path: ./.compartment/release-assets/self-hosted-sboms/**/*.spdx.json

      - name: Upload self-hosted provenance artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          include-hidden-files: true
          name: self-hosted-provenance-${{ inputs.channel }}
          path: ./.compartment/release-assets/self-hosted-sboms/**/*.slsa-v1-provenance.json
