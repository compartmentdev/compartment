name: Publish Self-Hosted Images (Kubernetes)

on:
  push:
    branches:
      - kubernetes

permissions:
  contents: read
  packages: read

concurrency:
  group: publish-self-hosted-kubernetes
  queue: max

jobs:
  select-runner:
    name: kubernetes:ci / select runner
    uses: ./.github/workflows/_select-ci-runner.yml

  db-integration:
    name: kubernetes:ci / db
    needs:
      - select-runner
    uses: ./.github/workflows/_db-integration.yml
    with:
      runner_labels_json: ${{ needs.select-runner.outputs.runner_labels_json }}

  self-hosted-image-cache:
    name: kubernetes:ci / build images
    needs:
      - select-runner
    uses: ./.github/workflows/_self-hosted-image-cache.yml
    with:
      runner_labels_json: ${{ needs.select-runner.outputs.runner_labels_json }}

  self-hosted-image-security-gate:
    name: kubernetes:ci / self-hosted image security gate
    needs:
      - select-runner
      - self-hosted-image-cache
    uses: ./.github/workflows/_self-hosted-image-security-gate.yml
    with:
      runner_labels_json: ${{ needs.select-runner.outputs.runner_labels_json }}
      self_hosted_image_cache_key: ${{ needs.self-hosted-image-cache.outputs.cache_key }}
      docker_scout_enabled: true
    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  platform-k3d-e2e:
    name: kubernetes:ci / platform-k3d-e2e
    needs:
      - select-runner
      - self-hosted-image-cache
    uses: ./.github/workflows/_platform-k3d-e2e.yml
    with:
      self_hosted_image_cache_key: ${{ needs.self-hosted-image-cache.outputs.cache_key }}
      runner_labels_json: ${{ needs.select-runner.outputs.runner_labels_json }}

  build-kubernetes-cli:
    name: build CLI ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_name: compartment-darwin-arm64.tar.gz
            runner: macos-14
          - artifact_name: compartment-darwin-x64.tar.gz
            runner: macos-15-intel
          - artifact_name: compartment-linux-arm64.tar.gz
            runner: ubuntu-24.04-arm
          - artifact_name: compartment-linux-x64.tar.gz
            runner: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 10.6.3
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install cosign for CLI image verification
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5
        with:
          cosign-release: v2.6.1

      - name: Build kubernetes CLI binary
        run: |
          pnpm cli:build:sea \
            --distribution-channel kubernetes \
            --build-commit-sha "${GITHUB_SHA}" \
            --output-dir ./.compartment/cli-dist

      - name: Smoke test CLI binary
        run: |
          version_output="$(./.compartment/cli-dist/compartment --version)"
          expected_version_suffix="-kubernetes+$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          case "$version_output" in
            *"$expected_version_suffix")
              ;;
            *)
              echo "Expected kubernetes CLI version to include ${expected_version_suffix}, received: ${version_output}" >&2
              exit 1
              ;;
          esac
          ./.compartment/cli-dist/compartment --help

      - name: Archive CLI binary
        run: |
          mkdir -p ./.compartment/release-assets
          tar -C ./.compartment/cli-dist -czf "./.compartment/release-assets/${{ matrix.artifact_name }}" compartment

      - name: Upload CLI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          include-hidden-files: true
          name: ${{ matrix.artifact_name }}
          path: ./.compartment/release-assets/${{ matrix.artifact_name }}

  publish-kubernetes-images:
    name: publish kubernetes + sha
    needs:
      - db-integration
      - platform-k3d-e2e
      - self-hosted-image-security-gate
    permissions:
      contents: read
      id-token: write
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Publish self-hosted image channel
        uses: ./.github/actions/publish-self-hosted-channel
        with:
          channel: kubernetes
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          publish-sha: ${{ github.sha }}

  publish-kubernetes-cli:
    name: publish signed kubernetes CLI
    needs:
      - build-kubernetes-cli
      - publish-kubernetes-images
    permissions:
      contents: read
      id-token: write
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLI_REPOSITORY: ghcr.io/compartmentdev/compartment-cli
      GH_TOKEN: ${{ github.token }}
      PUBLISH_SHA: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6
        with:
          version: 1.3.3

      - name: Set up Cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5
        with:
          cosign-release: v2.6.1

      - name: Download CLI artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          merge-multiple: true
          pattern: compartment-*.tar.gz
          path: ./.compartment/release-assets

      - name: Build CLI checksums
        run: |
          cd ./.compartment/release-assets
          sha256sum compartment-*.tar.gz > checksums.txt

      - name: Log in to GitHub Container Registry
        run: |
          printf '%s' "$GH_TOKEN" | oras login --username "${GITHUB_ACTOR}" --password-stdin ghcr.io

      - name: Publish immutable CLI artifact
        run: |
          staging_ref="${CLI_REPOSITORY}:staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${PUBLISH_SHA}"
          immutable_ref="${CLI_REPOSITORY}:sha-${PUBLISH_SHA}"

          (
            cd ./.compartment/release-assets
            publish_platform_artifact() {
              platform_os="$1"
              platform_arch="$2"
              archive_arch="$3"
              platform_tag="staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${PUBLISH_SHA}-${platform_os}-${platform_arch}"
              oras push \
                --artifact-platform "${platform_os}/${platform_arch}" \
                --artifact-type application/vnd.compartment.cli.platform.v1 \
                "${CLI_REPOSITORY}:${platform_tag}" \
                "compartment-${platform_os}-${archive_arch}.tar.gz:application/vnd.compartment.cli.archive.v1+gzip" \
                checksums.txt:text/plain \
                >/dev/null
              printf '%s\n' "$platform_tag"
            }

            darwin_arm64_tag="$(publish_platform_artifact darwin arm64 arm64)"
            darwin_amd64_tag="$(publish_platform_artifact darwin amd64 x64)"
            linux_arm64_tag="$(publish_platform_artifact linux arm64 arm64)"
            linux_amd64_tag="$(publish_platform_artifact linux amd64 x64)"
            oras manifest index create \
              --artifact-type application/vnd.compartment.cli.v1 \
              --annotation "org.opencontainers.image.revision=${PUBLISH_SHA}" \
              --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              "$staging_ref" \
              "$darwin_arm64_tag" \
              "$darwin_amd64_tag" \
              "$linux_arm64_tag" \
              "$linux_amd64_tag"
          )

          staging_digest="$(oras resolve "$staging_ref")"
          if immutable_digest="$(oras resolve "$immutable_ref" 2>./.compartment/immutable-cli-error.txt)"; then
            if [ "$immutable_digest" != "$staging_digest" ]; then
              echo "Immutable CLI artifact ${immutable_ref} already points to ${immutable_digest}; expected ${staging_digest}." >&2
              exit 1
            fi
          elif grep -Eiq 'manifest unknown|not found' ./.compartment/immutable-cli-error.txt; then
            oras cp "$staging_ref" "$immutable_ref"
          else
            cat ./.compartment/immutable-cli-error.txt >&2
            echo "Failed to determine whether immutable CLI artifact ${immutable_ref} exists." >&2
            exit 1
          fi

          immutable_digest="$(oras resolve "$immutable_ref")"
          if [ "$immutable_digest" != "$staging_digest" ]; then
            echo "Immutable CLI artifact ${immutable_ref} resolved to ${immutable_digest}; expected ${staging_digest}." >&2
            exit 1
          fi
          printf '%s' "$immutable_digest" > ./.compartment/cli-artifact-digest

      - name: Sign and verify CLI artifact
        run: |
          cli_digest="$(cat ./.compartment/cli-artifact-digest)"
          digest_ref="${CLI_REPOSITORY}@${cli_digest}"
          certificate_identity="https://github.com/compartmentdev/compartment/.github/workflows/publish-self-hosted-kubernetes.yml@refs/heads/kubernetes"

          cosign sign --yes --new-bundle-format "$digest_ref"
          cosign verify \
            --new-bundle-format \
            --certificate-identity "$certificate_identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$digest_ref"

      - name: Enable anonymous CLI artifact pulls
        run: |
          gh api \
            --method PATCH \
            "orgs/compartmentdev/packages/container/compartment-cli/visibility" \
            --field visibility=public \
            >/dev/null

          printf '{"auths":{}}\n' > ./.compartment/anonymous-registry-config.json
          expected_digest="$(cat ./.compartment/cli-artifact-digest)"
          anonymous_digest="$(oras resolve \
            --registry-config ./.compartment/anonymous-registry-config.json \
            "${CLI_REPOSITORY}:sha-${PUBLISH_SHA}")"
          if [ "$anonymous_digest" != "$expected_digest" ]; then
            echo "Anonymous CLI artifact resolved to ${anonymous_digest}; expected ${expected_digest}." >&2
            exit 1
          fi

      - name: Promote mutable kubernetes CLI tag
        run: |
          current_kubernetes_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/kubernetes" --jq '.object.sha')"
          if [ -z "$current_kubernetes_sha" ]; then
            echo 'Expected current kubernetes ref SHA.' >&2
            exit 1
          fi
          if [ "$current_kubernetes_sha" != "$PUBLISH_SHA" ]; then
            echo "Skipping mutable kubernetes CLI promotion because ${PUBLISH_SHA} is no longer the branch head."
            exit 0
          fi

          cli_digest="$(cat ./.compartment/cli-artifact-digest)"
          oras cp "${CLI_REPOSITORY}@${cli_digest}" "${CLI_REPOSITORY}:kubernetes"
          promoted_digest="$(oras resolve "${CLI_REPOSITORY}:kubernetes")"
          if [ "$promoted_digest" != "$cli_digest" ]; then
            echo "Mutable kubernetes CLI tag resolved to ${promoted_digest}; expected ${cli_digest}." >&2
            exit 1
          fi
