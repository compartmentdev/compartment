name: Self-hosted image security gate reusable

on:
  workflow_call:
    inputs:
      runner_labels_json:
        required: true
        type: string
      self_hosted_image_cache_key:
        required: true
        type: string
      docker_scout_enabled:
        required: true
        type: boolean
    secrets:
      dockerhub_username:
        required: false
      dockerhub_token:
        required: false

permissions:
  contents: read

jobs:
  scan-images:
    name: scan images
    runs-on: ${{ fromJson(inputs.runner_labels_json) }}
    timeout-minutes: 75
    env:
      # The Caddyfile is only proven by the build that runs it: the plugin directives it depends on
      # exist nowhere else, so validation uses the image the platform actually ships.
      COMPARTMENT_CADDY_VALIDATION_IMAGE: ghcr.io/compartmentdev/compartment-caddy:sha-${{ github.sha }}
      COMPARTMENT_CADDY_VALIDATION_REQUIRED: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/tool-cache
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/tool-cache
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          version: 10.6.3
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The validation environment is rendered from the chart rather than copied, so this job needs Helm.
      - name: Install pinned Helm
        uses: ./.github/actions/install-pinned-helm

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514
        with:
          version: v0.70.0

      - name: Set up Docker Scout
        uses: ./.github/actions/setup-docker-scout

      - name: Log in to Docker Hub
        if: inputs.docker_scout_enabled
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          username: ${{ secrets.dockerhub_username }}
          password: ${{ secrets.dockerhub_token }}

      - name: Restore self-hosted image cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ./.compartment/self-hosted-image-cache
          key: ${{ inputs.self_hosted_image_cache_key }}
          fail-on-cache-miss: true

      - name: Acquire shared image cache lock
        id: acquire-image-cache-lock
        run: >-
          node ./scripts/deploy/manage-platform-image-cache-lock.mjs acquire
          "security-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Load self-hosted images from cache
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mapfile -t services < <(node ./scripts/deploy/list-self-hosted-runtime-image-artifacts.mjs)
          [ "${#services[@]}" -gt 0 ] || { echo "No self-hosted runtime images were listed." >&2; exit 1; }
          for service in "${services[@]}"; do
            docker load --input "./.compartment/self-hosted-image-cache/${service}.tar"
          done

      - name: Verify cached self-hosted image refs
        timeout-minutes: 2
        run: |
          set -euo pipefail
          mapfile -t services < <(node ./scripts/deploy/list-self-hosted-runtime-image-artifacts.mjs)
          [ "${#services[@]}" -gt 0 ] || { echo "No self-hosted runtime images were listed." >&2; exit 1; }
          for service in "${services[@]}"; do
            docker image inspect "ghcr.io/compartmentdev/compartment-${service}:sha-${{ github.sha }}" >/dev/null
          done

      - name: Check self-hosted image vulnerabilities
        timeout-minutes: 20
        env:
          DOCKER_SCOUT_ENABLED: ${{ inputs.docker_scout_enabled }}
        run: |
          docker_scout_args=()
          if [ "$DOCKER_SCOUT_ENABLED" = "true" ]; then
            docker_scout_args+=(--docker-scout)
          fi

          node ./scripts/deploy/secure-self-hosted-images.mjs \
            --scan-only \
            "${docker_scout_args[@]}" \
            "sha-${{ github.sha }}"

      - name: Validate the edge Caddyfile
        timeout-minutes: 2
        run: pnpm --filter @compartment/edge test:caddy-config

      - name: Release shared image cache lock
        if: ${{ always() && steps.acquire-image-cache-lock.outcome == 'success' }}
        run: >-
          node ./scripts/deploy/manage-platform-image-cache-lock.mjs release
          "security-${{ github.run_id }}-${{ github.run_attempt }}"
