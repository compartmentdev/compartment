name: Self-hosted image security gate reusable

on:
  workflow_call:
    inputs:
      runner_labels_json:
        required: true
        type: string
      self_hosted_image_cache_key:
        required: true
        type: string

permissions:
  contents: read

jobs:
  scan-images:
    name: scan images
    runs-on: ${{ fromJson(inputs.runner_labels_json) }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/tool-cache
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/tool-cache
        with:
          node-version-file: .nvmrc

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514
        with:
          version: v0.70.0

      - name: Set up Docker Scout
        env:
          DOCKER_SCOUT_CLI_SHA256: 07b075d532efd3ca04893a0a1845cb57df3b367e2c4b4717658e2425caa8e1f8
          DOCKER_SCOUT_CLI_VERSION: 1.21.0
        run: |
          mkdir -p "$HOME/.docker/cli-plugins"
          rm -rf /tmp/docker-scout-install
          mkdir -p /tmp/docker-scout-install
          curl --fail --location --show-error \
            "https://github.com/docker/scout-cli/releases/download/v${DOCKER_SCOUT_CLI_VERSION}/docker-scout_${DOCKER_SCOUT_CLI_VERSION}_linux_amd64.tar.gz" \
            --output /tmp/docker-scout.tar.gz
          echo "${DOCKER_SCOUT_CLI_SHA256}  /tmp/docker-scout.tar.gz" | sha256sum --check
          tar -xzf /tmp/docker-scout.tar.gz -C /tmp/docker-scout-install docker-scout
          install -m 0755 /tmp/docker-scout-install/docker-scout "$HOME/.docker/cli-plugins/docker-scout"
          docker scout version

      - name: Restore self-hosted image cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ./.compartment/self-hosted-image-cache
          key: ${{ inputs.self_hosted_image_cache_key }}
          fail-on-cache-miss: true

      - name: Load self-hosted images from cache
        run: |
          for service in api caddy edge worker runtime-probe; do
            docker load --input "./.compartment/self-hosted-image-cache/${service}.tar"
          done

      - name: Verify cached self-hosted image refs
        run: |
          set -euo pipefail
          set -a
          . ./.compartment/self-hosted-image-cache/.env.self-hosted
          set +a

          docker image inspect \
            "$COMPARTMENT_API_IMAGE" \
            "$COMPARTMENT_CADDY_IMAGE" \
            "$COMPARTMENT_EDGE_IMAGE" \
            "$COMPARTMENT_RUNTIME_PROBE_IMAGE" \
            "$COMPARTMENT_WORKER_IMAGE" >/dev/null

      - name: Check self-hosted image vulnerabilities
        run: |
          node ./scripts/deploy/secure-self-hosted-images.mjs \
            --scan-only \
            --docker-scout \
            --env-file ./.compartment/self-hosted-image-cache/.env.self-hosted
