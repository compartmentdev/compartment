name: Devin Review Link

on:
  pull_request_target:
    types:
      - opened
      - reopened

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: devin-review-link-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  update-pr-body:
    name: Insert Devin Review link
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted workflow code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Insert Devin Review link
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node ./scripts/ci/devin-review-link/update-pr-body.mjs
