name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-runner:
    name: check:ci / select runner
    uses: ./.github/workflows/_select-ci-runner.yml

  migration-count:
    name: check:ci / migration-count
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Check pull request migration count
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail

          merge_base="$(git merge-base "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          node ./scripts/ci/check-drizzle-migration-count.mjs "${merge_base}" "${{ github.event.pull_request.head.sha }}"

      - name: Check pull request Drizzle journals
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail

          merge_base="$(git merge-base "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          node ./scripts/ci/check-drizzle-journal.mjs "${merge_base}" "${{ github.event.pull_request.head.sha }}"

  standard-checks:
    name: check:ci / standard
    needs:
      - migration-count
      - select-runner
    runs-on: ${{ fromJson(needs.select-runner.outputs.runner_labels_json) }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.5
          cache-dependency-path: packages/edge/caddy-ratelimit/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 10.6.3
          cache: true

      - name: Restore Turbo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-standard-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-standard-${{ github.ref_name }}-
            ${{ runner.os }}-turbo-standard-main-
            ${{ runner.os }}-turbo-standard-
            ${{ runner.os }}-turbo-static-${{ github.ref_name }}-
            ${{ runner.os }}-turbo-unit-${{ github.ref_name }}-
            ${{ runner.os }}-turbo-static-main-
            ${{ runner.os }}-turbo-unit-main-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run root lint
        run: pnpm lint:root

      - name: Run examples lint
        run: pnpm lint:examples

      - name: Run eslint plugin lint
        run: pnpm --filter @compartment/eslint-plugin lint

      - name: Run eslint config lint
        run: pnpm --filter @compartment/eslint-config lint

      - name: Run contracts lint
        run: pnpm --filter @compartment/contracts lint

      - name: Run docker lint
        run: pnpm --filter @compartment/docker lint

      - name: Run kube runtime lint
        run: pnpm --filter @compartment/kube-runtime lint

      - name: Run utils lint
        run: pnpm --filter @compartment/utils lint

      - name: Run public docs lint
        run: pnpm --filter @compartment/public-docs lint

      - name: Run console lint
        run: pnpm --filter @compartment/console lint

      - name: Run SDK lint
        run: pnpm --filter @compartment/sdk lint

      - name: Run source archive lint
        run: pnpm --filter @compartment/source-archive lint

      - name: Run test support lint
        run: pnpm --filter @compartment/test-support lint

      - name: Run API source lint
        run: pnpm --filter @compartment/api exec eslint src --max-warnings 0

      - name: Run API test lint
        run: pnpm --filter @compartment/api exec eslint test --max-warnings 0

      - name: Run CLI lint
        run: pnpm --filter @compartment/cli lint

      - name: Run edge lint
        run: pnpm --filter @compartment/edge lint

      - name: Run edge Go validation
        run: pnpm --filter @compartment/edge vet:go && pnpm --filter @compartment/edge test:go

      - name: Run worker lint
        run: pnpm --filter @compartment/worker lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run build
        run: pnpm build

      - name: Run test build
        run: pnpm build:test

      - name: Check commitlint wiring
        run: pnpm check:commitlint

      - name: Check Kubernetes cutover boundary
        run: pnpm check:kubernetes-cutover

      - name: Check fork PR runner routing
        run: pnpm check:fork-pr-runners

      - name: Check formatting
        run: pnpm format:check

      - name: Check public docs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PUBLIC_DOCS_BASE_SHA="${{ github.event.pull_request.base.sha }}" \
            PUBLIC_DOCS_HEAD_SHA="${{ github.event.pull_request.head.sha }}" \
            pnpm docs:check
          else
            pnpm docs:check
          fi

      - name: Check unused files
        run: pnpm check:unused

      - name: Check runtime exports
        run: pnpm check:unused:runtime

      - name: Check duplicates
        run: pnpm check:duplicates

      - name: Install cosign for standalone CLI build
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5
        with:
          cosign-release: v2.6.1

      - name: Check self-hosted provenance cosign parser
        run: node ./scripts/deploy/secure-self-hosted-images.mjs --validate-provenance-attestation

      - name: Smoke test the standalone CLI build
        run: |
          pnpm cli:build:sea --distribution-channel source --output-dir ./.compartment/cli-dist-ci
          ./.compartment/cli-dist-ci/compartment --version
          ./.compartment/cli-dist-ci/compartment --help

      - name: Run fast tests
        run: pnpm test:fast:ci

  semgrep:
    name: check:ci / semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: semgrep/semgrep:1.136.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Run Semgrep OWASP scan
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --exclude-rule javascript.express.security.audit.xss.direct-response-write.direct-response-write \
            --severity ERROR \
            --error \
            --metrics off \
            --disable-version-check

  gitleaks:
    name: check:ci / gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install GitLeaks
        run: |
          curl -fsSLo /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p /tmp/gitleaks
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks gitleaks
          echo "/tmp/gitleaks" >> "${GITHUB_PATH}"

      - name: Run GitLeaks secret scan
        run: |
          gitleaks dir . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --verbose

  db-integration:
    name: check:ci / db
    needs:
      - migration-count
      - select-runner
    uses: ./.github/workflows/_db-integration.yml
    with:
      runner_labels_json: ${{ needs.select-runner.outputs.runner_labels_json }}

  self-hosted-image-cache:
    name: check:ci / build images
    needs:
      - migration-count
      - select-runner
    uses: ./.github/workflows/_self-hosted-image-cache.yml
    with:
      runner_labels_json: ${{ needs.select-runner.outputs.runner_labels_json }}

  self-hosted-image-security-gate:
    name: check:ci / self-hosted image security gate
    needs:
      - select-runner
      - self-hosted-image-cache
    uses: ./.github/workflows/_self-hosted-image-security-gate.yml
    with:
      runner_labels_json: ${{ needs.select-runner.outputs.runner_labels_json }}
      self_hosted_image_cache_key: ${{ needs.self-hosted-image-cache.outputs.cache_key }}
      docker_scout_enabled: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  edge-caddy-config:
    name: check:ci / edge caddy config
    needs:
      - select-runner
      - self-hosted-image-cache
    runs-on: ${{ fromJson(needs.select-runner.outputs.runner_labels_json) }}
    timeout-minutes: 20
    env:
      # The Caddyfile is only proven by the build that runs it: the plugin directives it depends on
      # exist nowhere else, so validation uses the image the platform actually ships.
      COMPARTMENT_CADDY_VALIDATION_IMAGE: ghcr.io/compartmentdev/compartment-caddy:sha-${{ github.sha }}
      COMPARTMENT_CADDY_VALIDATION_REQUIRED: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/tool-cache
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/tool-cache
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          version: 10.6.3
          cache: true

      - name: Restore self-hosted image cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ./.compartment/self-hosted-image-cache
          key: ${{ needs.self-hosted-image-cache.outputs.cache_key }}
          fail-on-cache-miss: true

      - name: Load the Caddy image
        run: docker load --input ./.compartment/self-hosted-image-cache/caddy.tar

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The validation environment is rendered from the chart rather than copied, so this job needs Helm.
      - name: Install pinned Helm
        uses: ./.github/actions/install-pinned-helm

      - name: Validate the edge Caddyfile
        run: pnpm --filter @compartment/edge test:caddy-config

  select-platform-k3d-shards:
    name: check:ci / select platform k3d shards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      shards_json: ${{ steps.select.outputs.shards_json }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Select platform k3d shards
        id: select
        run: |
          node ./scripts/ci/select-platform-k3d-shards.mjs \
            "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  platform-k3d-e2e:
    name: check:ci / platform-k3d-e2e
    needs:
      - select-runner
      - select-platform-k3d-shards
      - self-hosted-image-cache
    uses: ./.github/workflows/_platform-k3d-e2e.yml
    with:
      self_hosted_image_cache_key: ${{ needs.self-hosted-image-cache.outputs.cache_key }}
      runner_labels_json: ${{ needs.select-runner.outputs.runner_labels_json }}
      shards_json: ${{ needs.select-platform-k3d-shards.outputs.shards_json }}

  check-ci:
    name: check:ci
    if: ${{ always() }}
    needs:
      - select-runner
      - select-platform-k3d-shards
      - gitleaks
      - semgrep
      - standard-checks
      - db-integration
      - self-hosted-image-cache
      - self-hosted-image-security-gate
      - edge-caddy-config
      - platform-k3d-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify all CI jobs passed
        run: |
          if [[ "${{ needs.select-runner.result }}" != "success" ]]; then
            exit 1
          fi
          if [[ "${{ needs.standard-checks.result }}" != "success" ]]; then
            exit 1
          fi
          if [[ "${{ needs.semgrep.result }}" != "success" ]]; then
            exit 1
          fi
          if [[ "${{ needs.gitleaks.result }}" != "success" ]]; then
            exit 1
          fi
          if [[ "${{ needs.db-integration.result }}" != "success" ]]; then
            exit 1
          fi
          if [[ "${{ needs.self-hosted-image-cache.result }}" != "success" ]]; then
            exit 1
          fi
          if [[ "${{ needs.self-hosted-image-security-gate.result }}" != "success" ]]; then
            exit 1
          fi
          if [[ "${{ needs.edge-caddy-config.result }}" != "success" ]]; then
            exit 1
          fi
          if [[ "${{ needs.select-platform-k3d-shards.result }}" != "success" ]]; then
            exit 1
          fi
          if [[ "${{ needs.platform-k3d-e2e.result }}" != "success" ]]; then
            exit 1
          fi
