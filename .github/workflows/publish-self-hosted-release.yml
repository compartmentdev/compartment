name: Publish Self-Hosted Images (Release)

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: publish-self-hosted-release
  queue: max

jobs:
  build-release-images:
    name: build release image artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      release_version: ${{ steps.release.outputs.value }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Ensure tagged commit is on main
        run: |
          git fetch origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"; then
            echo "Release tags must point to a commit reachable from origin/main." >&2
            exit 1
          fi

      - name: Resolve release version
        id: release
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          echo "value=${release_version}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc

      - name: Check release version files
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.value }}
        run: node ./scripts/release/check-release-version.mjs --version "$RELEASE_VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Build self-hosted images
        env:
          COMPARTMENT_CADDY_RUNTIME_IMAGE: public.ecr.aws/docker/library/caddy:2.11.4-alpine
          COMPARTMENT_GO_BUILD_IMAGE: public.ecr.aws/docker/library/golang:1.26.5-bookworm
          COMPARTMENT_NODE_BUILD_IMAGE: public.ecr.aws/docker/library/node:24.15.0-bookworm
          COMPARTMENT_NODE_RUNTIME_IMAGE: public.ecr.aws/docker/library/node:24.15.0-bookworm-slim
        run: |
          mkdir -p ./.compartment/release-assets
          node ./scripts/deploy/build-self-hosted-images.mjs \
            --tag "${{ steps.release.outputs.value }}" \
            --repository-prefix docker.io/compartmentdev

      - name: Archive self-hosted images
        run: |
          docker image save \
            docker.io/compartmentdev/compartment-api:${{ steps.release.outputs.value }} \
            docker.io/compartmentdev/compartment-caddy:${{ steps.release.outputs.value }} \
            docker.io/compartmentdev/compartment-edge:${{ steps.release.outputs.value }} \
            docker.io/compartmentdev/compartment-worker:${{ steps.release.outputs.value }} \
            | gzip -1 > ./.compartment/release-assets/self-hosted-images.tar.gz

      - name: Upload self-hosted image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          include-hidden-files: true
          name: self-hosted-images-release
          path: ./.compartment/release-assets/self-hosted-images.tar.gz

  publish-release-images:
    name: publish version + latest
    needs: build-release-images
    permissions:
      contents: read
      id-token: write
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Set up Cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5
        with:
          cosign-release: v2.6.1

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514
        with:
          version: v0.70.0

      - name: Set up Docker Scout
        uses: ./.github/actions/setup-docker-scout

      - name: Download self-hosted image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: self-hosted-images-release
          path: ./.compartment/release-assets

      - name: Load self-hosted images
        run: gunzip -c ./.compartment/release-assets/self-hosted-images.tar.gz | docker load

      - name: Log in to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Scan self-hosted images before publish
        env:
          RELEASE_VERSION: ${{ needs.build-release-images.outputs.release_version }}
        run: |
          node ./scripts/deploy/secure-self-hosted-images.mjs \
            --scan-only \
            --docker-scout \
            --repository-prefix docker.io/compartmentdev \
            "$RELEASE_VERSION"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push self-hosted images
        env:
          COMPARTMENT_BUILDKIT_VERSION: v0.30.0
          COMPARTMENT_CADDY_RUNTIME_IMAGE: public.ecr.aws/docker/library/caddy:2.11.4-alpine
          COMPARTMENT_GO_BUILD_IMAGE: public.ecr.aws/docker/library/golang:1.26.5-bookworm
          COMPARTMENT_NODE_BUILD_IMAGE: public.ecr.aws/docker/library/node:24.15.0-bookworm
          COMPARTMENT_NODE_RUNTIME_IMAGE: public.ecr.aws/docker/library/node:24.15.0-bookworm-slim
          MUTABLE_TAG: latest
          PRIMARY_TAG: ${{ needs.build-release-images.outputs.release_version }}
          STAGING_TAG: staging-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
        run: |
          common_args=(--push --provenance=mode=max --sbom=true)
          node_args=(
            --build-arg "COMPARTMENT_NODE_BUILD_IMAGE=${COMPARTMENT_NODE_BUILD_IMAGE}"
            --build-arg "COMPARTMENT_NODE_RUNTIME_IMAGE=${COMPARTMENT_NODE_RUNTIME_IMAGE}"
          )
          worker_args=(
            "${node_args[@]}"
            --build-arg "COMPARTMENT_BUILDKIT_VERSION=${COMPARTMENT_BUILDKIT_VERSION}"
            --build-arg "COMPARTMENT_GO_BUILD_IMAGE=${COMPARTMENT_GO_BUILD_IMAGE}"
          )
          caddy_args=(
            --build-arg "COMPARTMENT_CADDY_RUNTIME_IMAGE=${COMPARTMENT_CADDY_RUNTIME_IMAGE}"
          )
          mutable_tags_file="./.compartment/release-assets/published-self-hosted-mutable-tags.txt"
          : > "$mutable_tags_file"

          push_dockerhub_image() {
            local image_name="$1"
            local dockerfile="$2"
            shift 2
            docker buildx build "${common_args[@]}" "$@" \
              --tag "docker.io/compartmentdev/${image_name}:${STAGING_TAG}" \
              --file "$dockerfile" .
          }

          promote_dockerhub_image() {
            local image_name="$1"
            docker buildx imagetools create \
              --tag "docker.io/compartmentdev/${image_name}:${PRIMARY_TAG}" \
              "docker.io/compartmentdev/${image_name}:${STAGING_TAG}"
          }

          read_latest_stable_release_tag_version() {
            local tag_refs
            local latest_tag_version
            if ! tag_refs="$(git ls-remote --exit-code --refs --tags origin 'refs/tags/v*.*.*')"; then
              echo "Failed to read release tags from origin." >&2
              return 1
            fi
            latest_tag_version="$(
              printf '%s\n' "$tag_refs" \
                | sed -E 's#.*refs/tags/v##' \
                | awk '/^[0-9]+[.][0-9]+[.][0-9]+$/ { print }' \
                | sort -V \
                | tail -n 1
            )"
            if [ -z "$latest_tag_version" ]; then
              echo "Expected at least one stable release tag." >&2
              return 1
            fi
            printf '%s\n' "$latest_tag_version"
          }

          promote_dockerhub_mutable_image() {
            local image_name="$1"
            docker buildx imagetools create \
              --tag "docker.io/compartmentdev/${image_name}:${MUTABLE_TAG}" \
              "docker.io/compartmentdev/${image_name}:${PRIMARY_TAG}"
          }

          push_dockerhub_image compartment-api packages/api/Dockerfile.self-hosted "${node_args[@]}"
          push_dockerhub_image compartment-caddy packages/edge/Dockerfile.caddy.self-hosted "${caddy_args[@]}"
          push_dockerhub_image compartment-dns01-solver packages/managed-domain-dns01-solver/Dockerfile "${worker_args[@]}"
          push_dockerhub_image compartment-edge packages/edge/Dockerfile.self-hosted "${node_args[@]}"
          push_dockerhub_image compartment-worker packages/worker/Dockerfile.self-hosted "${worker_args[@]}"

          mapfile -t self_hosted_services < <(node ./scripts/deploy/list-self-hosted-runtime-image-artifacts.mjs)

          node ./scripts/deploy/secure-self-hosted-images.mjs \
            --scan-only \
            --docker-scout \
            --repository-prefix docker.io/compartmentdev \
            "$STAGING_TAG"

          for service in "${self_hosted_services[@]}"; do
            promote_dockerhub_image "compartment-${service}"
          done

          mutable_latest_enabled=false
          latest_stable_release_tag_version="$(read_latest_stable_release_tag_version)" || exit 1
          if [ "$latest_stable_release_tag_version" = "$PRIMARY_TAG" ]; then
            mutable_latest_enabled=true
            for service in "${self_hosted_services[@]}"; do
              promote_dockerhub_mutable_image "compartment-${service}"
            done
            printf '%s\n' "$MUTABLE_TAG" >> "$mutable_tags_file"
          fi

          for service in "${self_hosted_services[@]}"; do
            image_ref="docker.io/compartmentdev/compartment-${service}:${PRIMARY_TAG}"
            docker tag "${image_ref}" "ghcr.io/compartmentdev/compartment-${service}:${PRIMARY_TAG}"
            docker push "ghcr.io/compartmentdev/compartment-${service}:${PRIMARY_TAG}"
          done

          if [ "$mutable_latest_enabled" = true ]; then
            for service in "${self_hosted_services[@]}"; do
              image_ref="docker.io/compartmentdev/compartment-${service}:${PRIMARY_TAG}"
              docker tag "${image_ref}" "ghcr.io/compartmentdev/compartment-${service}:latest"
              docker push "ghcr.io/compartmentdev/compartment-${service}:latest"
            done
          fi

      - name: Secure self-hosted image digests
        env:
          RELEASE_VERSION: ${{ needs.build-release-images.outputs.release_version }}
        run: |
          tags=("$RELEASE_VERSION")
          mutable_tags_file="./.compartment/release-assets/published-self-hosted-mutable-tags.txt"
          if [ -f "$mutable_tags_file" ]; then
            while IFS= read -r mutable_tag; do
              if [ -n "$mutable_tag" ]; then
                tags+=("$mutable_tag")
              fi
            done < "$mutable_tags_file"
          fi

          node ./scripts/deploy/secure-self-hosted-images.mjs \
            --repository-prefix docker.io/compartmentdev \
            --output-dir ./.compartment/release-assets/self-hosted-sboms/dockerhub \
            "${tags[@]}"
          node ./scripts/deploy/secure-self-hosted-images.mjs \
            --repository-prefix ghcr.io/compartmentdev \
            --output-dir ./.compartment/release-assets/self-hosted-sboms/ghcr \
            "${tags[@]}"

      - name: Upload self-hosted SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          include-hidden-files: true
          name: self-hosted-sboms-release
          path: ./.compartment/release-assets/self-hosted-sboms/**/*.spdx.json

      - name: Upload self-hosted provenance artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          include-hidden-files: true
          name: self-hosted-provenance-release
          path: ./.compartment/release-assets/self-hosted-sboms/**/*.slsa-v1-provenance.json

  build-release-cli:
    name: build CLI ${{ matrix.artifact_name }}
    needs:
      - build-release-images
      - publish-release-images
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_name: compartment-darwin-arm64.tar.gz
            runner: macos-14
          - artifact_name: compartment-darwin-x64.tar.gz
            runner: macos-15-intel
          - artifact_name: compartment-linux-arm64.tar.gz
            runner: ubuntu-24.04-arm
          - artifact_name: compartment-linux-x64.tar.gz
            runner: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 10.6.3
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install cosign for CLI image verification
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5
        with:
          cosign-release: v2.6.1

      - name: Build stable CLI binary
        run: |
          pnpm cli:build:sea \
            --build-commit-sha "${{ github.sha }}" \
            --distribution-channel release \
            --output-dir ./.compartment/cli-dist

      - name: Smoke test CLI binary
        run: |
          ./.compartment/cli-dist/compartment --version
          ./.compartment/cli-dist/compartment --help

      - name: Archive CLI binary
        run: |
          mkdir -p ./.compartment/release-assets
          tar -C ./.compartment/cli-dist -czf "./.compartment/release-assets/${{ matrix.artifact_name }}" compartment

      - name: Upload CLI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          include-hidden-files: true
          name: ${{ matrix.artifact_name }}
          path: ./.compartment/release-assets/${{ matrix.artifact_name }}

  publish-release-cli:
    name: publish stable CLI release
    needs:
      - build-release-images
      - build-release-cli
      - publish-release-images
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_REPOSITORY: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.build-release-images.outputs.release_version }}
    steps:
      - name: Ensure release version
        run: |
          if [ -z "$RELEASE_VERSION" ]; then
            echo "Expected a resolved release version." >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc

      - name: Download CLI artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          merge-multiple: true
          pattern: compartment-*.tar.gz
          path: ./.compartment/release-assets

      - name: Render stable installer
        run: |
          node ./scripts/release/render-cli-install-script.mjs \
            --repository "$RELEASE_REPOSITORY" \
            --default-version "$RELEASE_VERSION" \
            --output ./.compartment/release-assets/install.sh

      - name: Build release checksums
        run: |
          cd ./.compartment/release-assets
          sha256sum compartment-*.tar.gz install.sh > checksums.txt

      - name: Write stable release notes
        run: |
          node ./scripts/release/write-release-notes.mjs \
            --version "$RELEASE_VERSION" \
            --fallback-notes "Manual compartment release ${RELEASE_VERSION}." \
            --output ./.compartment/release-assets/release-notes.md

      - name: Check GitHub CLI release verification support
        run: |
          probe_release_verification_command() {
            command_name="$1"
            shift

            set +e
            command_output="$(gh release "$command_name" "$@" 2>&1 >/dev/null)"
            command_status="$?"
            set -e

            if [ "$command_status" -eq 0 ]; then
              return 0
            fi

            if printf '%s\n' "$command_output" | grep -Eiq 'unknown command|unknown flag|Usage:[[:space:]]+gh release <command>'; then
              echo "GitHub CLI 2.81.0 or newer is required to verify release attestations." >&2
              printf '%s\n' "$command_output" >&2
              exit 1
            fi
          }

          probe_release_verification_command verify "__compartment-release-verification-probe__" \
            --repo "$RELEASE_REPOSITORY"
          probe_release_verification_command verify-asset "__compartment-release-verification-probe__" ./.compartment/release-assets/install.sh \
            --repo "$RELEASE_REPOSITORY"

      - name: Resolve stable release publish mode
        id: stable-release
        run: |
          release_tag="v${RELEASE_VERSION}"
          release_state="$(node ./scripts/release/read-release-state.mjs --repo "$RELEASE_REPOSITORY" --tag "$release_tag")"

          if [ "$release_state" = "published" ]; then
            node ./scripts/release/validate-release-assets.mjs \
              --repo "$RELEASE_REPOSITORY" \
              --tag "$release_tag" \
              --repair-hint "Publish a new release tag instead of clobbering immutable assets." \
              ./.compartment/release-assets/compartment-*.tar.gz \
              ./.compartment/release-assets/checksums.txt \
              ./.compartment/release-assets/install.sh

            echo "upload_assets=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$release_state" = "draft" ]; then
            gh release edit "$release_tag" --repo "$RELEASE_REPOSITORY" --title "compartment ${RELEASE_VERSION}" --notes-file ./.compartment/release-assets/release-notes.md --prerelease=false --draft
          else
            gh release create "$release_tag" --repo "$RELEASE_REPOSITORY" --title "compartment ${RELEASE_VERSION}" --notes-file ./.compartment/release-assets/release-notes.md --draft --verify-tag
          fi

          echo "upload_assets=true" >> "$GITHUB_OUTPUT"

      - name: Upload stable CLI artifacts
        if: steps.stable-release.outputs.upload_assets == 'true'
        run: |
          gh release upload "v${RELEASE_VERSION}" ./.compartment/release-assets/compartment-*.tar.gz ./.compartment/release-assets/checksums.txt ./.compartment/release-assets/install.sh \
            --repo "$RELEASE_REPOSITORY" \
            --clobber

      - name: Publish stable release
        if: steps.stable-release.outputs.upload_assets == 'true'
        run: |
          gh release edit "v${RELEASE_VERSION}" \
            --repo "$RELEASE_REPOSITORY" \
            --title "compartment ${RELEASE_VERSION}" \
            --notes-file ./.compartment/release-assets/release-notes.md \
            --prerelease=false \
            --draft=false

      - name: Verify stable release attestation
        run: |
          release_tag="v${RELEASE_VERSION}"
          verify_attempt=1
          max_verify_attempts=30
          verify_delay_seconds=10

          until gh release verify "$release_tag" --repo "$RELEASE_REPOSITORY" \
            && gh release verify-asset "$release_tag" ./.compartment/release-assets/install.sh --repo "$RELEASE_REPOSITORY"; do
            if [ "$verify_attempt" -ge "$max_verify_attempts" ]; then
              echo "Release attestation verification did not pass for ${release_tag} after ${max_verify_attempts} attempts." >&2
              exit 1
            fi

            echo "Release attestation for ${release_tag} is not available yet; retrying in ${verify_delay_seconds}s."
            verify_attempt=$((verify_attempt + 1))
            sleep "$verify_delay_seconds"
          done
