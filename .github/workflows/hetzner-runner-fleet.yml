name: Hetzner runner fleet

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - closed
  push:
    branches:
      - main
  schedule:
    # Billing-aware reaper: catch idle VMs before their next rounded Hetzner hour.
    - cron: '*/10 * * * *'
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: hetzner-runner-fleet-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  manage:
    name: manage Hetzner runner fleet
    if: >-
      ${{
        github.event_name != 'pull_request_target' ||
        github.event.action == 'closed' ||
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    uses: ./.github/workflows/_hetzner-runner-control.yml
    with:
      command: ${{ github.event_name == 'schedule' && 'reconcile' || (github.event_name == 'workflow_run' || (github.event_name == 'pull_request_target' && github.event.action == 'closed')) && 'cleanup' || 'ensure-fleet' }}
    secrets: inherit
