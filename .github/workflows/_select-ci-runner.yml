name: Select CI runner reusable

on:
  workflow_call:
    outputs:
      runner_labels_json:
        description: JSON array for runs-on labels.
        value: ${{ jobs.select-runner.outputs.runner_labels_json }}

permissions: {}

jobs:
  select-runner:
    name: select runner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runner_labels_json: ${{ steps.runner.outputs.labels }}
    steps:
      - name: Select CI runner
        id: runner
        run: |
          echo 'labels=["ubuntu-24.04"]' >> "$GITHUB_OUTPUT"
