name: Platform k3d e2e reusable

on:
  workflow_call:
    inputs:
      self_hosted_image_cache_key:
        required: true
        type: string
      runner_labels_json:
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  run-platform-k3d-e2e:
    name: run platform k3d e2e / ${{ matrix.shard }}
    runs-on: ${{ fromJson(inputs.runner_labels_json) }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard:
          - build-matrix-a
          - build-matrix-b
          - gvisor-build
          - user-flow
          - console
          - managed-install
          - system-update
          - build-performance
    env:
      COMPARTMENT_E2E_IMAGE_ARCHIVE_DIR: ./.compartment/self-hosted-image-cache
      COMPARTMENT_E2E_GVISOR_ENABLED: ${{ matrix.shard == 'gvisor-build' && '1' || '0' }}
      COMPARTMENT_E2E_KEEP_ON_FAILURE: ${{ vars.COMPARTMENT_E2E_KEEP_ON_FAILURE || '0' }}
      COMPARTMENT_E2E_SKIP_CLI_BUILD: '1'
      COMPARTMENT_TEST_APP_NODE_IMAGE: public.ecr.aws/docker/library/node:24.15.0-bookworm
      COMPARTMENT_TEST_POSTGRES_IMAGE: postgres:16
      DOCKER_CONFIG: ${{ github.workspace }}/.compartment/docker-config
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/tool-cache
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/tool-cache
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          version: 10.6.3
          cache: true

      - name: Install pinned k3d, kubectl, Helm, and helm-unittest
        env:
          HELM_DATA_HOME: ${{ runner.temp }}/helm-data
          HELM_SHA256: e9b88b4ee95b18c706839c28d3a0220e5bc470e9cd9262410c90793c45ff8b7c
          HELM_VERSION: v4.2.3
          HELM_UNITTEST_VERSION: 1.1.1
          K3D_SHA256: dbaa79a76ace7f4ca230a1ff41dc7d8a5036a8ad0309e9c54f9bf3836dbe853e
          K3D_VERSION: v5.8.3
          KUBECTL_SHA256: 33d0cdec6967817468f0a4a90f537dfef394dcf815d91966ca651cc118393eea
          KUBECTL_VERSION: v1.33.2
        run: |
          curl --fail --location --show-error \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64" \
            --output /tmp/k3d
          echo "${K3D_SHA256}  /tmp/k3d" | sha256sum --check
          sudo install -m 0755 /tmp/k3d /usr/local/bin/k3d

          curl --fail --location --show-error \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" \
            --output /tmp/kubectl
          echo "${KUBECTL_SHA256}  /tmp/kubectl" | sha256sum --check
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl

          helm_archive="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl --fail --location --show-error \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            "https://get.helm.sh/${helm_archive}" \
            --output "/tmp/${helm_archive}"
          echo "${HELM_SHA256}  /tmp/${helm_archive}" | sha256sum --check
          tar -xzf "/tmp/${helm_archive}" -C /tmp
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm

          helm plugin install https://github.com/helm-unittest/helm-unittest.git \
            --version "${HELM_UNITTEST_VERSION}" \
            --verify=false

          k3d version
          kubectl version --client
          helm version

      - name: Install pinned gVisor
        if: ${{ matrix.shard == 'gvisor-build' }}
        env:
          GVISOR_SHA512: 1e951f8d9dd2198e16ad66066fac0db42943ac8e8ca35c7173a20f0fbc859b8185c33c478ae0dc3c4e76b8c06d99ed118286caf43ad207c96578b42af62cae72
          GVISOR_VERSION: release/20260721.0
        run: |
          gvisor_archive="/tmp/gvisor.tar.bz2"
          curl --fail --location --show-error \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            "https://storage.googleapis.com/gvisor/releases/${GVISOR_VERSION}/x86_64/gvisor.tar.bz2" \
            --output "${gvisor_archive}"
          echo "${GVISOR_SHA512}  ${gvisor_archive}" | sha512sum --check
          gvisor_extract_dir="$(mktemp -d)"
          tar -xjf "${gvisor_archive}" -C "${gvisor_extract_dir}"
          sudo install -m 0755 "${gvisor_extract_dir}/runsc" /usr/bin/runsc
          sudo install -m 0755 \
            "${gvisor_extract_dir}/containerd-shim-runsc-v1" \
            /usr/bin/containerd-shim-runsc-v1
          sudo install -d -m 0755 /usr/bin/gvisor-bin
          sudo install -m 0755 \
            "${gvisor_extract_dir}/gvisor-bin/checkpointgofer" \
            "${gvisor_extract_dir}/gvisor-bin/runsc-metric-server" \
            /usr/bin/gvisor-bin
          sudo install -D -m 0644 ./scripts/deploy/fixtures/runsc.toml /etc/containerd/runsc.toml
          rm -r "${gvisor_extract_dir}"

          runsc --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Helm chart renders
        if: ${{ matrix.shard == 'managed-install' }}
        env:
          HELM_DATA_HOME: ${{ runner.temp }}/helm-data
        run: |
          helm lint ./deploy/chart/compartment
          helm lint ./deploy/chart/compartment -f ./deploy/chart/compartment/values-kind.yaml
          helm unittest --strict ./deploy/chart/compartment
          if helm template compartment ./deploy/chart/compartment --kube-version 1.29.9 >/dev/null 2>&1; then
            echo 'Chart must reject Kubernetes versions without stable ValidatingAdmissionPolicy support.' >&2
            exit 1
          fi
          node ./deploy/chart/compartment/test/assert-operator-docs.mjs

      - name: Register local control-plane host
        run: |
          echo '127.0.0.1 console.compartment.localhost' | sudo tee -a /etc/hosts >/dev/null
          echo '127.0.0.1 console.managed-platform-e2e.managed.compartment.test managed-domain-broker' | sudo tee -a /etc/hosts >/dev/null
          echo '127.0.0.1 console.apps.example.test' | sudo tee -a /etc/hosts >/dev/null

      - name: Restore self-hosted image cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ./.compartment/self-hosted-image-cache
          key: ${{ inputs.self_hosted_image_cache_key }}
          fail-on-cache-miss: true

      - name: Build CLI artifact
        env:
          BUILD_COMMIT_SHA: ${{ github.sha }}
          COMPARTMENT_CLI_BUNDLED_COSIGN_PATH: scripts/deploy/fixtures/cosign-k3d-e2e.mjs
        run: |
          pnpm cli:build:sea \
            --distribution-channel source \
            --build-commit-sha "$BUILD_COMMIT_SHA" \
            --output-dir ./.compartment/cli-dist

      - name: Run isolated k3d e2e shard
        id: run-shard
        env:
          NO_PROXY: console.apps.example.test,console.managed.compartment.localhost,managed-domain-broker,127.0.0.1,localhost
        run: node ./scripts/deploy/run-platform-k3d-e2e-shard.mjs "${{ matrix.shard }}"

      - name: Ensure shard cleanup
        id: cleanup-shard
        if: ${{ always() && (success() || env.COMPARTMENT_E2E_KEEP_ON_FAILURE != '1') }}
        env:
          COMPARTMENT_E2E_CLEANUP_ONLY: '1'
        run: node ./scripts/deploy/run-platform-k3d-e2e-shard.mjs "${{ matrix.shard }}"

      - name: Collect final shard diagnostics
        if: ${{ always() && steps.run-shard.outcome != 'failure' && steps.cleanup-shard.outcome == 'failure' }}
        run: >-
          node ./scripts/deploy/collect-platform-k3d-e2e-diagnostics.mjs
          "./.compartment/platform-k3d-diagnostics-${{ matrix.shard }}"

      - name: Upload shard diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: platform-k3d-diagnostics-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./.compartment/platform-k3d-diagnostics-${{ matrix.shard }}
          if-no-files-found: error
