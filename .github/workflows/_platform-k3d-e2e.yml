name: Platform k3d e2e reusable

on:
  workflow_call:
    inputs:
      self_hosted_image_cache_key:
        required: true
        type: string
      runner_labels_json:
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  run-platform-k3d-e2e:
    name: run platform k3d e2e
    runs-on: ${{ fromJson(inputs.runner_labels_json) }}
    timeout-minutes: 120
    env:
      COMPARTMENT_E2E_API_URL: http://console.compartment.localhost:18080
      COMPARTMENT_E2E_COMPARTMENT_URL: http://console.compartment.localhost:18080
      COMPARTMENT_E2E_KUBE_CONTEXT: k3d-compartment-e2e
      COMPARTMENT_E2E_PLATFORM_MODE: k3d
      COMPARTMENT_E2E_PLATFORM_NAMESPACE: compartment
      COMPARTMENT_SELF_HOSTED_USER_SETUP_E2E: '1'
      COMPARTMENT_TEST_APP_NODE_IMAGE: public.ecr.aws/docker/library/node:24.15.0-bookworm
      COMPARTMENT_TEST_POSTGRES_IMAGE: postgres:16
      DOCKER_CONFIG: ${{ github.workspace }}/.compartment/docker-config
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/tool-cache
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/tool-cache
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          version: 10.6.3
          cache: true

      - name: Install pinned k3d, kubectl, Helm, and helm-unittest
        env:
          HELM_DATA_HOME: ${{ runner.temp }}/helm-data
          HELM_SHA256: e9b88b4ee95b18c706839c28d3a0220e5bc470e9cd9262410c90793c45ff8b7c
          HELM_VERSION: v4.2.3
          HELM_UNITTEST_VERSION: 1.1.1
          K3D_SHA256: dbaa79a76ace7f4ca230a1ff41dc7d8a5036a8ad0309e9c54f9bf3836dbe853e
          K3D_VERSION: v5.8.3
          KUBECTL_SHA256: 33d0cdec6967817468f0a4a90f537dfef394dcf815d91966ca651cc118393eea
          KUBECTL_VERSION: v1.33.2
        run: |
          curl --fail --location --show-error \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64" \
            --output /tmp/k3d
          echo "${K3D_SHA256}  /tmp/k3d" | sha256sum --check
          sudo install -m 0755 /tmp/k3d /usr/local/bin/k3d

          curl --fail --location --show-error \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" \
            --output /tmp/kubectl
          echo "${KUBECTL_SHA256}  /tmp/kubectl" | sha256sum --check
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl

          helm_archive="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl --fail --location --show-error \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            "https://get.helm.sh/${helm_archive}" \
            --output "/tmp/${helm_archive}"
          echo "${HELM_SHA256}  /tmp/${helm_archive}" | sha256sum --check
          tar -xzf "/tmp/${helm_archive}" -C /tmp
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm

          helm plugin install https://github.com/helm-unittest/helm-unittest.git \
            --version "${HELM_UNITTEST_VERSION}" \
            --verify=false

          k3d version
          kubectl version --client
          helm version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Helm chart renders
        env:
          HELM_DATA_HOME: ${{ runner.temp }}/helm-data
        run: |
          helm lint ./deploy/chart/compartment
          helm lint ./deploy/chart/compartment -f ./deploy/chart/compartment/values-kind.yaml
          helm unittest --strict ./deploy/chart/compartment
          node ./deploy/chart/compartment/test/assert-operator-docs.mjs

      - name: Register local control-plane host
        run: |
          echo '127.0.0.1 console.compartment.localhost' | sudo tee -a /etc/hosts >/dev/null
          echo '127.0.0.1 console.managed.compartment.test managed-domain-broker' | sudo tee -a /etc/hosts >/dev/null

      - name: Restore self-hosted image cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ./.compartment/self-hosted-image-cache
          key: ${{ inputs.self_hosted_image_cache_key }}
          fail-on-cache-miss: true

      - name: Build CLI artifact
        env:
          BUILD_COMMIT_SHA: ${{ github.sha }}
          COMPARTMENT_CLI_BUNDLED_COSIGN_PATH: scripts/deploy/fixtures/cosign-k3d-e2e.mjs
        run: |
          pnpm cli:build:sea \
            --distribution-channel source \
            --build-commit-sha "$BUILD_COMMIT_SHA" \
            --output-dir ./.compartment/cli-dist

      - name: Prepare clean k3d cluster from cached images
        run: node ./scripts/deploy/platform-k3d-e2e.mjs up --image-source archive --image-archive-dir ./.compartment/self-hosted-image-cache

      - name: Verify production managed-domain install
        env:
          COMPARTMENT_DEPLOY_E2E_INCLUDE: test/platform-k3d-managed-install.e2e.test.ts
          NO_PROXY: console.managed.compartment.test,managed-domain-broker,127.0.0.1,localhost
        run: |
          probe_managed_https() {
            for _ in $(seq 1 600); do
              if test -f ./.compartment/pebble.root.pem \
                && kubectl --namespace compartment-managed-e2e get service managed-e2e-compartment-caddy >/dev/null 2>&1 \
                && curl --silent --show-error --fail --output /dev/null --max-time 5 \
                  --cacert ./.compartment/pebble.root.pem \
                  --resolve console.managed.compartment.test:18443:127.0.0.1 \
                  https://console.managed.compartment.test:18443/; then
                echo 'Managed HTTPS probe passed.'
                return 0
              fi
              sleep 2
            done
            echo 'Managed HTTPS probe timed out.' >&2
            return 1
          }

          probe_managed_https &
          probe_pid=$!
          set +e
          pnpm --filter @compartment/cli test:e2e
          test_status=$?
          if [ "${test_status}" -ne 0 ]; then
            kill "${probe_pid}" 2>/dev/null || true
            wait "${probe_pid}" 2>/dev/null || true
            exit "${test_status}"
          fi
          wait "${probe_pid}"
          probe_status=$?
          set -e
          exit "${probe_status}"

      - name: Verify retained install-state lifecycle
        run: |
          set -euo pipefail
          release=restore2-state
          namespace=restore2-state
          secret_name="${release}-install-state"
          cleanup() {
            helm uninstall "${release}" --namespace "${namespace}" >/dev/null 2>&1 || true
            kubectl delete namespace "${namespace}" --ignore-not-found --wait=false >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          helm upgrade --install "${release}" ./deploy/chart/compartment \
            --namespace "${namespace}" \
            --create-namespace \
            --set platform.startupStage=foundation \
            --set platform.installationId=retained-installation \
            --set platform.domainMode=managed \
            --set platform.baseDomain=retained.example.test \
            --set platform.publicProtocol=https \
            --set platform.tlsMode=managed \
            --set platform.managedDomainBrokerUrl=https://broker.example.test \
            --set secrets.managedDomainBrokerToken=retained-token
          helm uninstall "${release}" --namespace "${namespace}"
          kubectl --namespace "${namespace}" get secret "${secret_name}"

          helm upgrade --install "${release}" ./deploy/chart/compartment \
            --namespace "${namespace}" \
            --set platform.startupStage=foundation \
            --set platform.installationId=replacement-attempt
          installation_id="$(kubectl --namespace "${namespace}" get secret "${secret_name}" --output jsonpath='{.data.installation-id}' | base64 --decode)"
          broker_url="$(kubectl --namespace "${namespace}" get secret "${secret_name}" --output jsonpath='{.data.managed-domain-broker-url}' | base64 --decode)"
          runtime_broker_url="$(kubectl --namespace "${namespace}" get configmap "${release}-compartment" --output jsonpath='{.data.COMPARTMENT_MANAGED_DOMAIN_BROKER_URL}')"
          test "${installation_id}" = retained-installation
          test "${broker_url}" = https://broker.example.test
          test "${runtime_broker_url}" = https://broker.example.test

      - name: Install platform and bootstrap the first owner
        env:
          COMPARTMENT_DEPLOY_E2E_INCLUDE: test/platform-k3d-install.e2e.test.ts
        run: pnpm --filter @compartment/cli test:e2e

      - name: Configure the k3d node registry route
        run: node ./scripts/deploy/platform-k3d-e2e.mjs configure

      - name: Run system user flow suite
        env:
          COMPARTMENT_DEPLOY_E2E_INCLUDE: test/system-user-flow.e2e.test.ts
        run: pnpm --filter @compartment/cli test:e2e

      - name: Install console Playwright browser
        run: pnpm --filter @compartment/console test:e2e:install

      - name: Run console suite
        env:
          COMPARTMENT_DEPLOY_E2E_INCLUDE: test/console.e2e.test.ts
        run: pnpm --filter @compartment/cli test:e2e

      - name: Run system build matrix suite
        env:
          COMPARTMENT_DEPLOY_E2E_INCLUDE: test/system-build-matrix.e2e.test.ts
        run: pnpm --filter @compartment/cli test:e2e

      - name: Verify edge LKG and measure revocation convergence
        env:
          COMPARTMENT_DEPLOY_E2E_INCLUDE: test/platform-k3d-g1.e2e.test.ts
        run: pnpm --filter @compartment/cli test:e2e

      - name: Verify bounded product-log buffers under load
        run: node ./scripts/deploy/run-platform-k3d-product-log-gate.mjs

      - name: Collect k3d diagnostics
        if: ${{ failure() }}
        run: node ./scripts/deploy/collect-platform-k3d-e2e-diagnostics.mjs ./.compartment/platform-k3d-diagnostics

      - name: Upload k3d diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: platform-k3d-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./.compartment/platform-k3d-diagnostics
          if-no-files-found: error

      - name: Tear down k3d platform
        if: ${{ always() }}
        run: node ./scripts/deploy/platform-k3d-e2e.mjs down
