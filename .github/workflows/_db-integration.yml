name: DB integration reusable

on:
  workflow_call:
    inputs:
      runner_labels_json:
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  run-db-integration:
    name: run DB integration checks
    runs-on: ${{ fromJson(inputs.runner_labels_json) }}
    timeout-minutes: 30
    services:
      postgres:
        image: ghcr.io/compartmentdev/compartment-ci-postgres:16
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_DB: compartment_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      COMPARTMENT_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/compartment_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 10.6.3
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Covers the database layer and the product log agent, whose transport behaviour needs a
      # container runtime and a loopback sink rather than a Kubernetes cluster.
      - name: Run integration checks
        run: pnpm test:integration
