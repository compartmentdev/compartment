name: Publish Self-Hosted Images (Main)

on:
  workflow_run:
    workflows:
      - Main CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: publish-self-hosted-main
  queue: max

env:
  PUBLISH_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  publish-main-images:
    name: publish main + sha
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/_publish-self-hosted-channel.yml
    with:
      channel: main
      publish_sha: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit

  build-main-cli:
    name: build CLI ${{ matrix.artifact_name }}
    needs: publish-main-images
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_name: compartment-darwin-arm64.tar.gz
            runner: macos-14
          - artifact_name: compartment-darwin-x64.tar.gz
            runner: macos-15-intel
          - artifact_name: compartment-linux-arm64.tar.gz
            runner: ubuntu-24.04-arm
          - artifact_name: compartment-linux-x64.tar.gz
            runner: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.PUBLISH_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 10.6.3
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install cosign for CLI image verification
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5
        with:
          cosign-release: v2.6.1

      - name: Build rolling CLI binary
        run: |
          pnpm cli:build:sea \
            --distribution-channel main \
            --build-commit-sha "${PUBLISH_SHA}" \
            --output-dir ./.compartment/cli-dist

      - name: Smoke test CLI binary
        run: |
          version_output="$(./.compartment/cli-dist/compartment --version)"
          expected_version_suffix="-main+$(printf '%s' "${PUBLISH_SHA}" | cut -c1-7)"
          case "$version_output" in
            *"$expected_version_suffix")
              ;;
            *)
              echo "Expected rolling CLI version to include ${expected_version_suffix}, received: ${version_output}" >&2
              exit 1
              ;;
          esac
          ./.compartment/cli-dist/compartment --help

      - name: Archive CLI binary
        run: |
          mkdir -p ./.compartment/release-assets
          tar -C ./.compartment/cli-dist -czf "./.compartment/release-assets/${{ matrix.artifact_name }}" compartment

      - name: Upload CLI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          include-hidden-files: true
          name: ${{ matrix.artifact_name }}
          path: ./.compartment/release-assets/${{ matrix.artifact_name }}

  publish-main-cli:
    name: publish rolling CLI release
    needs: build-main-cli
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.PUBLISH_SHA }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc

      - name: Download CLI artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          merge-multiple: true
          pattern: compartment-*.tar.gz
          path: ./.compartment/release-assets

      - name: Build release checksums
        run: |
          cd ./.compartment/release-assets
          sha256sum compartment-*.tar.gz > checksums.txt

      - name: Resolve immutable main release publish mode
        id: main-release
        run: |
          release_tag="sha-${PUBLISH_SHA}"

          release_state="$(node ./scripts/release/read-release-state.mjs --repo "$RELEASE_REPOSITORY" --tag "$release_tag")"
          if [ "$release_state" = "published" ]; then
            node ./scripts/release/validate-release-assets.mjs \
              --repo "$RELEASE_REPOSITORY" \
              --tag "$release_tag" \
              --repair-hint "Push a new main commit instead of clobbering immutable assets." \
              ./.compartment/release-assets/compartment-*.tar.gz \
              ./.compartment/release-assets/checksums.txt

            echo "upload_assets=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$release_state" = "draft" ]; then
            gh release edit "$release_tag" --repo "$RELEASE_REPOSITORY" --title "$release_tag" --notes "Compartment CLI main build from ${PUBLISH_SHA}." --prerelease --draft
          else
            gh release create "$release_tag" --repo "$RELEASE_REPOSITORY" --title "$release_tag" --notes "Compartment CLI main build from ${PUBLISH_SHA}." --prerelease --target "$PUBLISH_SHA" --draft
          fi

          echo "upload_assets=true" >> "$GITHUB_OUTPUT"

      - name: Upload immutable main CLI artifacts
        if: steps.main-release.outputs.upload_assets == 'true'
        run: |
          release_tag="sha-${PUBLISH_SHA}"
          gh release upload "$release_tag" ./.compartment/release-assets/compartment-*.tar.gz ./.compartment/release-assets/checksums.txt \
            --repo "$RELEASE_REPOSITORY" \
            --clobber

      - name: Publish immutable main release
        if: steps.main-release.outputs.upload_assets == 'true'
        run: |
          release_tag="sha-${PUBLISH_SHA}"
          gh release edit "$release_tag" \
            --repo "$RELEASE_REPOSITORY" \
            --title "$release_tag" \
            --notes "Compartment CLI main build from ${PUBLISH_SHA}." \
            --prerelease \
            --draft=false
