name: Publish Self-Hosted Images (Main)

on:
  workflow_run:
    workflows:
      - Main CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: publish-self-hosted-main
  queue: max

env:
  PUBLISH_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  build-main-images:
    name: build main image artifact
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ env.PUBLISH_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Prepare self-hosted build env
        env:
          PRIMARY_TAG: sha-${{ env.PUBLISH_SHA }}
        run: |
          mkdir -p ./.compartment/release-assets
          node ./scripts/deploy/render-self-hosted-env.mjs \
            --primary-tag "$PRIMARY_TAG" \
            --repository-prefix docker.io/compartmentdev \
            --output ./.compartment/.env.self-hosted

      - name: Build self-hosted images
        env:
          COMPARTMENT_CADDY_BUILDER_IMAGE: public.ecr.aws/docker/library/caddy:2.11.3-builder
          COMPARTMENT_CADDY_RUNTIME_IMAGE: public.ecr.aws/docker/library/alpine:3.22
          COMPARTMENT_GO_BUILD_IMAGE: public.ecr.aws/docker/library/golang:1.26.4-bookworm
          COMPARTMENT_NODE_BUILD_IMAGE: public.ecr.aws/docker/library/node:24.15.0-bookworm
          COMPARTMENT_NODE_RUNTIME_IMAGE: public.ecr.aws/docker/library/node:24.15.0-bookworm-slim
        run: |
          node ./scripts/deploy/build-self-hosted-images.mjs --env-file ./.compartment/.env.self-hosted

      - name: Check self-hosted runtime surface
        run: node ./scripts/deploy/check-self-hosted-runtime-surface.mjs ./.compartment/.env.self-hosted

      - name: Archive self-hosted images
        run: |
          docker image save \
            "docker.io/compartmentdev/compartment-api:sha-${PUBLISH_SHA}" \
            "docker.io/compartmentdev/compartment-caddy:sha-${PUBLISH_SHA}" \
            "docker.io/compartmentdev/compartment-edge:sha-${PUBLISH_SHA}" \
            "docker.io/compartmentdev/compartment-runtime-probe:sha-${PUBLISH_SHA}" \
            "docker.io/compartmentdev/compartment-worker:sha-${PUBLISH_SHA}" \
            | gzip -1 > ./.compartment/release-assets/self-hosted-images.tar.gz

      - name: Upload self-hosted image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          include-hidden-files: true
          name: self-hosted-images-main
          path: ./.compartment/release-assets/self-hosted-images.tar.gz

  publish-main-images:
    name: publish main + sha
    needs: build-main-images
    permissions:
      contents: read
      id-token: write
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ env.PUBLISH_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Set up Cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5
        with:
          cosign-release: v2.6.1

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514
        with:
          version: v0.70.0

      - name: Set up Docker Scout
        uses: ./.github/actions/setup-docker-scout

      - name: Download self-hosted image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: self-hosted-images-main
          path: ./.compartment/release-assets

      - name: Load self-hosted images
        run: gunzip -c ./.compartment/release-assets/self-hosted-images.tar.gz | docker load

      - name: Log in to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Scan self-hosted images before publish
        run: |
          node ./scripts/deploy/secure-self-hosted-images.mjs \
            --scan-only \
            --docker-scout \
            --repository-prefix docker.io/compartmentdev \
            "sha-${PUBLISH_SHA}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push self-hosted images
        env:
          COMPARTMENT_BUILDKIT_VERSION: v0.30.0
          COMPARTMENT_CADDY_BUILDER_IMAGE: public.ecr.aws/docker/library/caddy:2.11.3-builder
          COMPARTMENT_CADDY_RUNTIME_IMAGE: public.ecr.aws/docker/library/alpine:3.22
          COMPARTMENT_GO_BUILD_IMAGE: public.ecr.aws/docker/library/golang:1.26.4-bookworm
          COMPARTMENT_NODE_BUILD_IMAGE: public.ecr.aws/docker/library/node:24.15.0-bookworm
          COMPARTMENT_NODE_RUNTIME_IMAGE: public.ecr.aws/docker/library/node:24.15.0-bookworm-slim
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MUTABLE_TAG: main
          PRIMARY_TAG: sha-${{ env.PUBLISH_SHA }}
          STAGING_TAG: staging-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.PUBLISH_SHA }}
        run: |
          common_args=(--push --provenance=mode=max --sbom=true)
          node_args=(
            --build-arg "COMPARTMENT_NODE_BUILD_IMAGE=${COMPARTMENT_NODE_BUILD_IMAGE}"
            --build-arg "COMPARTMENT_NODE_RUNTIME_IMAGE=${COMPARTMENT_NODE_RUNTIME_IMAGE}"
          )
          worker_args=(
            "${node_args[@]}"
            --build-arg "COMPARTMENT_BUILDKIT_VERSION=${COMPARTMENT_BUILDKIT_VERSION}"
            --build-arg "COMPARTMENT_GO_BUILD_IMAGE=${COMPARTMENT_GO_BUILD_IMAGE}"
          )
          caddy_args=(
            --build-arg "COMPARTMENT_CADDY_BUILDER_IMAGE=${COMPARTMENT_CADDY_BUILDER_IMAGE}"
            --build-arg "COMPARTMENT_CADDY_RUNTIME_IMAGE=${COMPARTMENT_CADDY_RUNTIME_IMAGE}"
          )
          runtime_probe_args=(
            --build-arg "COMPARTMENT_NODE_RUNTIME_IMAGE=${COMPARTMENT_NODE_RUNTIME_IMAGE}"
          )
          mutable_tags_file="./.compartment/release-assets/published-self-hosted-mutable-tags.txt"
          : > "$mutable_tags_file"

          push_dockerhub_image() {
            local image_name="$1"
            local dockerfile="$2"
            shift 2
            docker buildx build "${common_args[@]}" "$@" \
              --tag "docker.io/compartmentdev/${image_name}:${STAGING_TAG}" \
              --file "$dockerfile" .
          }

          promote_dockerhub_image() {
            local image_name="$1"
            docker buildx imagetools create \
              --tag "docker.io/compartmentdev/${image_name}:${PRIMARY_TAG}" \
              "docker.io/compartmentdev/${image_name}:${STAGING_TAG}"
          }

          read_current_main_sha() {
            local current_main_sha
            if ! current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"; then
              echo "Failed to read current main ref." >&2
              return 1
            fi
            if [ -z "$current_main_sha" ]; then
              echo "Expected current main ref SHA." >&2
              return 1
            fi
            printf '%s\n' "$current_main_sha"
          }

          promote_dockerhub_mutable_image() {
            local image_name="$1"
            docker buildx imagetools create \
              --tag "docker.io/compartmentdev/${image_name}:${MUTABLE_TAG}" \
              "docker.io/compartmentdev/${image_name}:${PRIMARY_TAG}"
          }

          push_dockerhub_image compartment-api packages/api/Dockerfile.self-hosted "${node_args[@]}"
          push_dockerhub_image compartment-caddy packages/edge/Dockerfile.caddy.self-hosted "${caddy_args[@]}"
          push_dockerhub_image compartment-edge packages/edge/Dockerfile.self-hosted "${node_args[@]}"
          push_dockerhub_image compartment-worker packages/worker/Dockerfile.self-hosted "${worker_args[@]}"
          push_dockerhub_image compartment-runtime-probe packages/node/Dockerfile.runtime-probe.self-hosted "${runtime_probe_args[@]}"

          mapfile -t self_hosted_services < <(node ./scripts/deploy/list-self-hosted-runtime-image-artifacts.mjs)

          node ./scripts/deploy/secure-self-hosted-images.mjs \
            --scan-only \
            --docker-scout \
            --repository-prefix docker.io/compartmentdev \
            "$STAGING_TAG"

          for service in "${self_hosted_services[@]}"; do
            promote_dockerhub_image "compartment-${service}"
          done

          mutable_main_enabled=false
          current_main_sha="$(read_current_main_sha)" || exit 1
          if [ "$current_main_sha" = "$PUBLISH_SHA" ]; then
            mutable_main_enabled=true
            for service in "${self_hosted_services[@]}"; do
              promote_dockerhub_mutable_image "compartment-${service}"
            done
            printf '%s\n' "$MUTABLE_TAG" >> "$mutable_tags_file"
          fi

          for service in "${self_hosted_services[@]}"; do
            image_ref="docker.io/compartmentdev/compartment-${service}:sha-${PUBLISH_SHA}"
            docker tag "${image_ref}" "ghcr.io/compartmentdev/compartment-${service}:sha-${PUBLISH_SHA}"
            docker push "ghcr.io/compartmentdev/compartment-${service}:sha-${PUBLISH_SHA}"
          done

          if [ "$mutable_main_enabled" = true ]; then
            for service in "${self_hosted_services[@]}"; do
              image_ref="docker.io/compartmentdev/compartment-${service}:sha-${PUBLISH_SHA}"
              docker tag "${image_ref}" "ghcr.io/compartmentdev/compartment-${service}:main"
              docker push "ghcr.io/compartmentdev/compartment-${service}:main"
            done
          fi

      - name: Secure self-hosted image digests
        run: |
          tags=("sha-${PUBLISH_SHA}")
          mutable_tags_file="./.compartment/release-assets/published-self-hosted-mutable-tags.txt"
          if [ -f "$mutable_tags_file" ]; then
            while IFS= read -r mutable_tag; do
              if [ -n "$mutable_tag" ]; then
                tags+=("$mutable_tag")
              fi
            done < "$mutable_tags_file"
          fi

          node ./scripts/deploy/secure-self-hosted-images.mjs \
            --repository-prefix docker.io/compartmentdev \
            --output-dir ./.compartment/release-assets/self-hosted-sboms/dockerhub \
            "${tags[@]}"
          node ./scripts/deploy/secure-self-hosted-images.mjs \
            --repository-prefix ghcr.io/compartmentdev \
            --output-dir ./.compartment/release-assets/self-hosted-sboms/ghcr \
            "${tags[@]}"

      - name: Upload self-hosted SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          include-hidden-files: true
          name: self-hosted-sboms-main
          path: ./.compartment/release-assets/self-hosted-sboms/**/*.spdx.json

      - name: Upload self-hosted provenance artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          include-hidden-files: true
          name: self-hosted-provenance-main
          path: ./.compartment/release-assets/self-hosted-sboms/**/*.slsa-v1-provenance.json

  build-main-cli:
    name: build CLI ${{ matrix.artifact_name }}
    needs: publish-main-images
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_name: compartment-darwin-arm64.tar.gz
            runner: macos-14
          - artifact_name: compartment-darwin-x64.tar.gz
            runner: macos-15-intel
          - artifact_name: compartment-linux-arm64.tar.gz
            runner: ubuntu-24.04-arm
          - artifact_name: compartment-linux-x64.tar.gz
            runner: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.PUBLISH_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 10.6.3
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5
        with:
          cosign-release: v2.6.1

      - name: Build rolling CLI binary
        run: |
          pnpm cli:build:sea \
            --distribution-channel main \
            --default-registry-image-tag "sha-${PUBLISH_SHA}" \
            --build-commit-sha "${PUBLISH_SHA}" \
            --output-dir ./.compartment/cli-dist

      - name: Smoke test CLI binary
        run: |
          version_output="$(./.compartment/cli-dist/compartment --version)"
          expected_version_suffix="-main+$(printf '%s' "${PUBLISH_SHA}" | cut -c1-7)"
          case "$version_output" in
            *"$expected_version_suffix")
              ;;
            *)
              echo "Expected rolling CLI version to include ${expected_version_suffix}, received: ${version_output}" >&2
              exit 1
              ;;
          esac
          ./.compartment/cli-dist/compartment --help

      - name: Archive CLI binary
        run: |
          mkdir -p ./.compartment/release-assets
          tar -C ./.compartment/cli-dist -czf "./.compartment/release-assets/${{ matrix.artifact_name }}" compartment

      - name: Upload CLI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          include-hidden-files: true
          name: ${{ matrix.artifact_name }}
          path: ./.compartment/release-assets/${{ matrix.artifact_name }}

  publish-main-cli:
    name: publish rolling CLI release
    needs: build-main-cli
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Download CLI artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          merge-multiple: true
          pattern: compartment-*.tar.gz
          path: ./.compartment/release-assets

      - name: Build release checksums
        run: |
          cd ./.compartment/release-assets
          sha256sum compartment-*.tar.gz > checksums.txt

      - name: Resolve immutable main release publish mode
        id: main-release
        run: |
          release_tag="sha-${PUBLISH_SHA}"

          release_is_draft="$(gh release view "$release_tag" --repo "$RELEASE_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [ "$release_is_draft" = "false" ]; then
            gh release view "$release_tag" --repo "$RELEASE_REPOSITORY" --json assets --jq '.assets[] | [.name, .digest] | @tsv' > ./.compartment/release-assets/published-assets.tsv

            missing_assets=""
            mismatched_assets=""
            for asset_path in ./.compartment/release-assets/compartment-*.tar.gz ./.compartment/release-assets/checksums.txt; do
              asset_name="$(basename "$asset_path")"
              expected_digest="sha256:$(sha256sum "$asset_path" | awk '{ print $1 }')"
              actual_digest="$(awk -F "$(printf '\t')" -v asset_name="$asset_name" '$1 == asset_name { print $2 }' ./.compartment/release-assets/published-assets.tsv)"

              if [ -z "$actual_digest" ]; then
                missing_assets="${missing_assets} ${asset_name}"
                continue
              fi

              if [ "$actual_digest" != "$expected_digest" ]; then
                mismatched_assets="${mismatched_assets} ${asset_name}"
              fi
            done

            if [ -n "$missing_assets" ] || [ -n "$mismatched_assets" ]; then
              echo "Main release ${release_tag} is already published with missing or mismatched immutable assets." >&2
              if [ -n "$missing_assets" ]; then
                echo "Missing assets:${missing_assets}" >&2
              fi
              if [ -n "$mismatched_assets" ]; then
                echo "Mismatched assets:${mismatched_assets}" >&2
              fi
              echo "Push a new main commit instead of clobbering immutable assets." >&2
              exit 1
            fi

            echo "upload_assets=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$release_is_draft" = "true" ]; then
            gh release edit "$release_tag" --repo "$RELEASE_REPOSITORY" --title "$release_tag" --notes "Compartment CLI main build from ${PUBLISH_SHA}." --prerelease --draft
          else
            gh release create "$release_tag" --repo "$RELEASE_REPOSITORY" --title "$release_tag" --notes "Compartment CLI main build from ${PUBLISH_SHA}." --prerelease --target "$PUBLISH_SHA" --draft
          fi

          echo "upload_assets=true" >> "$GITHUB_OUTPUT"

      - name: Upload immutable main CLI artifacts
        if: steps.main-release.outputs.upload_assets == 'true'
        run: |
          release_tag="sha-${PUBLISH_SHA}"
          gh release upload "$release_tag" ./.compartment/release-assets/compartment-*.tar.gz ./.compartment/release-assets/checksums.txt \
            --repo "$RELEASE_REPOSITORY" \
            --clobber

      - name: Publish immutable main release
        if: steps.main-release.outputs.upload_assets == 'true'
        run: |
          release_tag="sha-${PUBLISH_SHA}"
          gh release edit "$release_tag" \
            --repo "$RELEASE_REPOSITORY" \
            --title "$release_tag" \
            --notes "Compartment CLI main build from ${PUBLISH_SHA}." \
            --prerelease \
            --draft=false
