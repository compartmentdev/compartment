version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    exclude-paths:
      - 'examples/**'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Europe/Vilnius'
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:30'
      timezone: 'Europe/Vilnius'
    open-pull-requests-limit: 0
